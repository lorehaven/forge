# Every push to master, and every pull request.
on = { push = ["master"], pull_request = ["*"] }

# ---------------------------------------------------------------- check
[[stage]]
name = "check"

[[stage.job]]
name  = "format"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "format --check" }]

[[stage.job]]
name  = "lint"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"0
steps = [{ anvil = "lint --all-targets --deny-warnings" }]

[[stage.job]]
name  = "deps"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "machete" }, { anvil = "audit" }]

# ---------------------------------------------------------------- build
[[stage]]
name  = "build"
needs = ["check"]

[[stage.job]]
name  = "workspace"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "build --all" }]

# ---------------------------------------------------------------- test
[[stage]]
name  = "test"
needs = ["build"]

[[stage.job]]
name  = "unit"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
env   = { RUST_BACKTRACE = "1" }
steps = [{ anvil = "test --all" }]
