# Every push to master, every pull request, and - at midnight Warsaw time, through summer and winter time
# alike - the nightly security run. The scheduled run is the `security` stage alone: every other stage opts
# out with `event != 'schedule'`, so pushes and pull requests are exactly what they were.
on = { push = ["master"], pull_request = ["*"], schedule = ["0 0 * * *"], timezone = "Europe/Warsaw" }

# ---------------------------------------------------------------- check
[[stage]]
name = "check"
when  = "event != 'schedule'"

[[stage.job]]
name  = "format"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL"]
steps = [{ anvil = "format --check" }]

[[stage.job]]
name  = "lint"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL"]
# `--json` so the scan summary page (`crate::scan`) can parse clippy's own
# structured diagnostics instead of scraping this step's human log - see
# ANVIL-3. `deny`'s own step stays plain text: nothing reads its log back.
steps = [{ anvil = "lint --all-targets --deny-warnings --json" }]

[[stage.job]]
name  = "deps"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL"]
steps = [
  { anvil = "machete --json" },
  { anvil = "audit --json" },
  { anvil = "deny" },
]

# ---------------------------------------------------------------- build
[[stage]]
name  = "build"
when  = "event != 'schedule'"
needs = ["check"]

[[stage.job]]
name  = "workspace"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL"]
steps = [{ anvil = "build --all" }]

# ---------------------------------------------------------------- test
[[stage]]
name  = "test"
when  = "event != 'schedule'"
needs = ["build"]

[[stage.job]]
name  = "unit"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL"]
env   = { RUST_BACKTRACE = "1" }
# The tests run on quench-test's own harness, which leaves a JSON/HTML report of the whole run in
# target/debug/quench-test; conveyor keeps `summary.json` and `index.html` from there as artifacts and shows the
# totals on the repo's scan page. (nextest would run every test in a process of its own, so no process would
# see the whole run to report on.) Doctests run as part of the same invocation.
steps = [{ anvil = "test --all" }]

[[stage.job]]
name      = "coverage"
image     = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL"]
# The services' integration tests skip themselves unless their `<SERVICE>_TEST_DATABASE_URL` points at a
# database with the module installed. This job gives them one: a Postgres beside the steps (below), which
# `foundry apply` fills first. Without it they would not run here and their code would count as
# uncovered. 127.0.0.1, not `localhost`: a name can resolve to ::1, which the database is not listening on.
env       = { RUST_BACKTRACE = "1", CONVEYOR_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres", DAYBOOK_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres", FOUNDRY_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres", GANTRY_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres", GATEHOUSE_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres", SAGE_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres", WAREHOUSE_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres", WORKBENCH_TEST_DATABASE_URL = "postgres://postgres:postgres@127.0.0.1:5432/postgres" }
# `--lcov`/`--text` are separate report formats - one invocation can only
# produce one, so the run that actually exercises the tests is kept
# report-less and the two reports are regenerated from its profile data
# instead of re-running everything twice. The plain `report` (no format
# flag) is the human table `crate::scan::parse_coverage` reads.
steps = [
  # Every module the tests use, one `--install` each; the modules they depend on come with them.
  { run = "cargo run -q -p foundry -- apply --catalog services/foundry/service/migrations --database-url postgres://postgres:postgres@127.0.0.1:5432/postgres --install conveyor --install daybook --install gantry --install gatehouse --install sage --install switchboard --install warehouse --install workbench" },
  { run = "cargo llvm-cov --workspace --no-fail-fast --no-report" },
  { run = "cargo llvm-cov report --lcov --output-path lcov.info" },
  { run = "cargo llvm-cov report" },
]
artifacts = ["lcov.info"]

# A throwaway database for this job alone. It is a sidecar in the job's pod, so the steps reach it on
# 127.0.0.1 and it is gone with the pod; two runs never share one. The check goes over TCP on purpose: the
# image first runs a temporary server that listens only on a socket, and a check through the socket would
# let the steps start before the real one is up.
[[stage.job.service]]
name  = "postgres"
image = "pgvector/pgvector:pg18"
env   = { POSTGRES_PASSWORD = "postgres" }
ready = "pg_isready -h 127.0.0.1 -U postgres"

# ---------------------------------------------------------------- release (by hand)
# Never started by a push, a pull request or the clock: no event is called `release`, so these stages are skipped in
# every run. They are run by naming them, which clears their `when` ("run with parameters" in the UI, or
#   conveyor run lorehaven/forge --stage release-crates,release-artifacts --wait
# in the CLI); `needs` is kept between named stages, so the artifacts follow the crates. Add `check,build,test` to the
# names to release only after the tests of the same run pass.
#
# Both stages commit and push to master (a raised version, tags), so each job first makes its checkout fit for it:
# scripts/ci-release-prepare.sh (history, tags, a branch, a credential). Needs the conveyor secrets RELEASE_GIT_TOKEN
# (write access to the repository; the repository registered with an https clone url) and ANVIL_APP_TOKEN with
# ANVIL_GATEHOUSE_URL (the application that may publish: the registry and `warehouse:write`).
#
# release-crates: the libraries and command-line tools and the service images, as `anvil release --all` does on a
# developer's machine. The images need a Docker daemon, which a job pod does not have, so the job asks for one as a
# privileged `docker:dind` service beside its steps; the steps reach it on 127.0.0.1:2375. That is a privileged container,
# which the deployment must allow for this repository (CONVEYOR_K8S_ALLOW_PRIVILEGED and CONVEYOR_PRIVILEGED_REPOS; a
# pull request never gets one): without that the job fails at the start and says so. Needs the secrets
# DOCKER_REGISTRY_USER and DOCKER_REGISTRY_PASSWORD besides the ones below; `--no-docker` leaves the images out.
[[stage]]
name  = "release-crates"
when  = "event == 'release'"
needs = ["test"]

[[stage.job]]
name    = "crates"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL", "RELEASE_GIT_TOKEN", "DOCKER_REGISTRY_USER", "DOCKER_REGISTRY_PASSWORD"]
timeout = 14400
env     = { DOCKER_HOST = "tcp://127.0.0.1:2375", DOCKER_REGISTRIES = "ennor.ddns.net ossiriand.arda:8080", GIT_AUTHOR_NAME = "Conveyor release", GIT_AUTHOR_EMAIL = "conveyor@lorehaven.invalid", GIT_COMMITTER_NAME = "Conveyor release", GIT_COMMITTER_EMAIL = "conveyor@lorehaven.invalid" }
steps = [
  { run = "sh scripts/ci-release-prepare.sh" },
  { run = "sh scripts/ci-docker-login.sh" },
  { anvil = "release --all --yes" },
]

# The daemon. `DOCKER_TLS_CERTDIR` empty makes it listen on plain tcp 2375 (the pod's network is private to the job);
# the second registry is the cluster's own, which speaks http.
[[stage.job.service]]
name       = "dind"
image      = "docker:dind"
privileged = true
env        = { DOCKER_TLS_CERTDIR = "" }
args       = ["--insecure-registry=ossiriand.arda:8080"]
ready      = "docker -H tcp://127.0.0.1:2375 info"

# release-artifacts: every program of `.anvil/artifacts.toml` (the apps, the desktop packages), each at the next version
# if the warehouse already has this one (`anvil artifact release --all --yes`). The version commits are made here and
# pushed by the last step. Needs the Android toolchain, so its own image (images/rust-android-builder), and the release
# keys: the secrets HOIST_KEYSTORE_B64, DAYBOOK_KEYSTORE_B64 and FORKLIFT_KEYSTORE_B64 (the keystore files, base64) and
# QUENCH_KEYSTORE_PASSWORD and QUENCH_KEY_PASSWORD. It takes master as it is after release-crates, not as it was when
# the run started (RELEASE_REQUIRE_SHA=0).
[[stage]]
name  = "release-artifacts"
when  = "event == 'release'"
needs = ["release-crates"]

[[stage.job]]
name    = "artifacts"
image   = "ossiriand.arda:8080/forge/ci/rust-android-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL", "RELEASE_GIT_TOKEN", "QUENCH_KEYSTORE_PASSWORD", "QUENCH_KEY_PASSWORD", "HOIST_KEYSTORE_B64", "DAYBOOK_KEYSTORE_B64", "FORKLIFT_KEYSTORE_B64"]
timeout = 10800
env     = { RELEASE_REQUIRE_SHA = "0", GIT_AUTHOR_NAME = "Conveyor release", GIT_AUTHOR_EMAIL = "conveyor@lorehaven.invalid", GIT_COMMITTER_NAME = "Conveyor release", GIT_COMMITTER_EMAIL = "conveyor@lorehaven.invalid" }
steps = [
  { run = "sh scripts/ci-release-prepare.sh" },
  { run = "sh scripts/ci-restore-keystores.sh" },
  { anvil = "artifact release --all --yes" },
  # `artifact release` commits a raised version and leaves the pushing to the pipeline.
  { run = "git push origin HEAD:master" },
]

# ---------------------------------------------------------------- security (nightly)
# Started by the clock (`on.schedule`), never by a push. One job, one report: supply-chain and static stages,
# the scanner's self-test, and a live scan of the estate are quench-test cases written to target/security,
# which conveyor keeps whatever the outcome and shows as the Security card on the repo's scan page.
#
# The live scan is READ-ONLY (no FORGE_SECTEST_ACTIVE): anonymous requests, forged credentials, traversal
# and protocol probes against the running services over cluster DNS, at 20 requests/second, ~10 minutes.
# Give it a service-account token (FORGE_SECTEST_TOKEN, as a conveyor secret) to test behind the auth wall,
# FAIL_ON is "medium": tests/forge-sectest/public-routes.txt records the reviewed anonymous routes, so a new
# unreviewed one fails the night until it is added there (or protected).
[[stage]]
name = "security"
when = "event == 'schedule'"

[[stage.job]]
name    = "nightly"
image   = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
secrets = ["ANVIL_APP_TOKEN", "ANVIL_GATEHOUSE_URL"]
timeout = 3600
env = { RUST_BACKTRACE = "1", FORGE_SECTEST_FAIL_ON = "medium", FORGE_SECTEST_TARGETS = "gatehouse=http://gatehouse.forge.svc.cluster.local/gatehouse warehouse=http://warehouse.forge.svc.cluster.local/warehouse conveyor=http://conveyor.forge.svc.cluster.local/conveyor sage=http://sage.forge.svc.cluster.local/sage switchboard=http://switchboard.forge.svc.cluster.local/switchboard workbench=http://workbench.forge.svc.cluster.local/workbench gantry=http://gantry.forge.svc.cluster.local/gantry daybook=http://daybook.forge.svc.cluster.local/daybook" }
steps = [
  { run = "export QUENCH_TEST_REPORT_DIR=$PWD/target/security; rc=0; cargo test -p forge-sectest --test scanners || rc=1; cargo test -p forge-sectest --features gate --test gate -- --test-threads=1 || rc=1; cargo test -p forge-sectest --features gate --test live -- --test-threads=1 || rc=1; exit $rc" },
]
# Every finding, not only the failing ones. Kept when the job is green; a red run's findings are in the report.
artifacts = ["target/security-findings.json"]
