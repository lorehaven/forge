[package]
name = "gauge-web"
autotests = false
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The browser's Gauge: the screens of `gauge-app` over `fetch`, with the session cookie the SSO routes set. `cdylib` is the
# module the page loads (`cargo build --target wasm32-unknown-unknown --profile wasm -p gauge-web`); `rlib` is what the
# tests and the service use (the service serves the module and the page that starts it).
[lib]
name = "gauge_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
gauge-app = { workspace = true }
gauge-core = { workspace = true }
quench-serde = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
