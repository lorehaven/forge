[package]
name = "gauge-app"
autotests = false
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The screens: the hosts, and one host with everything Gauge knows of it. The app does no I/O: it asks its host for the
# numbers (`Request`) and is told what came (`Msg`), so the same screens run in the browser and in tests.
[lib]
name = "gauge_app"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
forge-shell = { workspace = true }
gauge-core = { workspace = true }
quench-ui = { workspace = true }

[[test]]
name = "screens"
path = "tests/screens.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
