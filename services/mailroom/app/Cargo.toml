[package]
name = "mailroom-app"
autotests = false
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The screens (the client's mailbox, the reader, compose, the administrator's panel). The app does no I/O: it asks its host for
# the data and for every change (`Request`) and is told what came (`Msg`), so the same screens run in the browser and in tests.
[lib]
name = "mailroom_app"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
forge-shell = { workspace = true }
quench-serde = { workspace = true }
quench-ui = { workspace = true }
mailroom-core = { workspace = true }

[lints]
workspace = true

[[test]]
name = "screens"
path = "tests/screens.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
