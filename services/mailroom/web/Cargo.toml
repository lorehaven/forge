[package]
name = "mailroom-web"
autotests = false
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The browser's Mailroom: the screens of `mailroom-app` over `fetch`, with the session cookie the SSO routes set.
[lib]
name = "mailroom_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
mailroom-app = { workspace = true }
mailroom-core = { workspace = true }
quench-core = { workspace = true }
quench-serde = { workspace = true }
quench-tz = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true
