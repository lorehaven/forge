[package]
name = "daybook-web"
autotests = false
version = "0.1.6"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The browser's Daybook: the same screens and controller as the apps, over `fetch`. `cdylib` is the module the page loads
# (`cargo build --target wasm32-unknown-unknown --profile wasm -p daybook-web`); `rlib` is what the tests and the service
# use (the service serves the module and the page that starts it).
[lib]
name = "daybook_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
daybook-app = { workspace = true }
forge-shell = { workspace = true }
daybook-core = { workspace = true }
daybook-host = { workspace = true }
daybook-net = { workspace = true }
quench-core = { workspace = true }
quench-serde = { workspace = true }
quench-style = { workspace = true }
quench-tz = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
