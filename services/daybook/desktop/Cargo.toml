[package]
name = "daybook-desktop"
autotests = false
version = "0.1.10"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The desktop app: the same screens as on the phone, drawn by the native renderer in a Wayland window. Reminders are
# shown (with `notify-send`) while the window is open; a computer has no alarm service for an app that is closed.
[lib]
name = "daybook_desktop"
path = "src/lib.rs"

# The window is a feature, so the library (the platform, the reminders) builds and tests without a display.
[features]
default = ["window"]
window = ["dep:quench-desktop-native", "dep:quench-style", "dep:quench-ui", "dep:quench-ui-native", "dep:daybook-app"]

[[bin]]
name = "daybook"
path = "src/main.rs"
required-features = ["window"]

[dependencies]
daybook-app = { workspace = true, optional = true }
daybook-core = { workspace = true }
daybook-host = { workspace = true, features = ["native"] }
daybook-net = { workspace = true, features = ["client"] }
quench-core = { workspace = true }
quench-desktop-native = { workspace = true, optional = true }
quench-style = { workspace = true, optional = true }
quench-tz = { workspace = true }
quench-ui = { workspace = true, optional = true }
quench-ui-native = { workspace = true, optional = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-image = { registry = "ennor", version = "0.1.0" }
quench-layout = { registry = "ennor", version = "0.1.3" }
quench-raster = { registry = "ennor", version = "0.1.2" }
quench-test = { workspace = true }

# `cargo run -p daybook-desktop --example shots -- <dir>` draws the screens offscreen to PNG files (no window, no display).
[[example]]
name = "shots"
path = "examples/shots.rs"
required-features = ["window"]
