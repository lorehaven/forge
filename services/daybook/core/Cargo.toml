[package]
name = "daybook-core"
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
autotests = false

# Daybook's logic with no interface and no I/O: tasks, lists, labels and repeat rules as the service sends them, due dates
# (with a time, or all day) and how they look, the order, the reminders to schedule, the rules of the task form and the
# calendar the date picker draws. It builds for every host, and its tests run natively and fast.
[lib]
name = "daybook_core"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[[test]]
name = "nlp"
path = "tests/nlp.rs"
harness = false

[dependencies]
quench-core = { workspace = true }
quench-serde = { workspace = true }
quench-tz = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }
