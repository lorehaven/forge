[package]
name = "daybook-surface"
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
autotests = false

[lib]
name = "daybook_surface"
path = "src/lib.rs"

# The program the Android host starts to draw the screen (`quench android build-native` copies it into the
# app as libquench_surface.so). It reads touches and keys from stdin and writes frames to stdout.
[[bin]]
name = "quench_surface"
path = "src/main.rs"

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dependencies]
daybook-app = { workspace = true }
daybook-core = { workspace = true }
daybook-host = { workspace = true, features = ["native"] }
daybook-net = { workspace = true, features = ["client"] }
quench-android-surface = { workspace = true }
quench-core = { workspace = true }
quench-serde = { workspace = true }
quench-style = { workspace = true }
quench-tz = { workspace = true }
quench-ui = { workspace = true }
quench-ui-native = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }
