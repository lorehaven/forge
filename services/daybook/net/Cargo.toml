[package]
name = "daybook-net"
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
autotests = false

[lib]
name = "daybook_net"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

# `client` is the blocking client over gatehouse (a program's); without it this is only the error type and the settings,
# which is what the browser's build uses.
[features]
default = ["client"]
client = ["dep:gatehouse-client"]

[dependencies]
daybook-core = { workspace = true }
gatehouse-client = { workspace = true, optional = true }
quench-serde = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }
