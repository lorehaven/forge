[package]
name = "songbook-core"
version = "0.1.0"
edition.workspace = true
publish = false
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
autotests = false

[lints]
workspace = true

# What Songbook's API says and the rules that name things: the wire model, song identity, file names. No I/O, and it
# builds for the browser: the service and the browser client share it.
[lib]
name = "songbook_core"
path = "src/lib.rs"

[dependencies]
quench-serde = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
