[package]
name = "songbook-surface"
version = "0.1.0"
edition.workspace = true
publish = false
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
autotests = false

# Songbook on Android, drawn by the native renderer with no WebView: the screens of `songbook-player`, the sign-in, and the
# device's side done by the app's plugins through the surface bridge (the playback is the `player` plugin's: the same
# ExoPlayer session that Android Auto controls). `quench android build-native` ships the program as `libquench_surface.so`.
[lints]
workspace = true

[lib]
name = "songbook_surface"
path = "src/lib.rs"

[[bin]]
name = "songbook_surface"
path = "src/main.rs"

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[[example]]
name = "shots"
path = "examples/shots.rs"

[dependencies]
songbook-core = { workspace = true }
songbook-native = { workspace = true }
songbook-player = { workspace = true }
quench-android-surface = { workspace = true }
quench-serde = { workspace = true }
quench-style = { workspace = true }
quench-ui = { workspace = true }
quench-ui-native = { workspace = true }

[dev-dependencies]
quench-image = { workspace = true }
quench-layout = { workspace = true }
quench-raster = { workspace = true }
quench-test = { workspace = true }
