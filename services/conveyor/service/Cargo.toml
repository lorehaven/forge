[package]
name = "conveyor-service"
version = "0.7.1"
edition = { workspace = true }
authors = { workspace = true }
description = "Conveyor - the Forge CI/CD service: webhooks, pipelines and runs"
keywords = ["ci", "cd", "pipeline", "automation"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"
autotests = false

[lib]
name = "conveyor_service"
path = "src/lib.rs"

[lints]
workspace = true

[[bin]]
name = "conveyor-service"
path = "src/main.rs"

[dependencies]
quench-pg = { workspace = true }
quench-crypto = { workspace = true }
quench-log = { workspace = true }
quench-core = { workspace = true }
quench-serde = { workspace = true }
conveyor-pipeline = { workspace = true }
forge-web = { workspace = true }
conveyor-core = { workspace = true }
conveyor-web = { workspace = true }
quench-auth = { workspace = true }
quench-client = { workspace = true }
quench-db = { workspace = true }
quench-http = { workspace = true }
quench-starter = { workspace = true }
quench-k8s = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
