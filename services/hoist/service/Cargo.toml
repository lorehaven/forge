[package]
name = "hoist-service"
version = "0.1.0"
edition.workspace = true
description = "Hoist's public catalogue: F-Droid, IzzyOnDroid and Aptoide merged into one, served to the app's Public tab"
publish = false
autotests = false

[lib]
name = "hoist_service"
path = "src/lib.rs"

[[bin]]
name = "hoist-service"
path = "src/main.rs"

[dependencies]
quench-auth = { workspace = true }
quench-client = { workspace = true }
quench-core = { workspace = true }
quench-db = { workspace = true }
quench-http = { workspace = true }
quench-log = { workspace = true }
quench-pg = { workspace = true }
quench-serde = { workspace = true }
quench-starter = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
