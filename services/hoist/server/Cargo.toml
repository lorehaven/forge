[package]
name = "hoist-server"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "hoist-server"
path = "src/main.rs"

[features]
# The wasm module is built into the binary (`quench build --release` does this).
embed = []

[dependencies]
hoist-app = { workspace = true }
quench-fullstack = { workspace = true }
quench-http = { workspace = true }
tokio = { workspace = true }