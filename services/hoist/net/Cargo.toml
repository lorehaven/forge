[package]
name = "hoist-net"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[lib]
name = "hoist_net"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dependencies]
hoist-core = { workspace = true }
quench-client = { workspace = true, features = ["blocking"] }
quench-crypto = { workspace = true }
quench-serde = { workspace = true }

[dev-dependencies]
quench-crypto = { workspace = true }
quench-test = { workspace = true }
