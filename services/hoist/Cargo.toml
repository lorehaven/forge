[workspace]
members = ["surface", "core", "app", "net", "desktop", "server", "service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
quench-android-surface = { registry = "ennor", version = "0.1.1" }
quench-android = { registry = "ennor", version = "0.1.0" }
quench-auth = { registry = "ennor", version = "0.4.14" }
quench-core = { registry = "ennor", version = "0.1.6" }
quench-db = { registry = "ennor", version = "0.2.13" }
quench-log = { registry = "ennor", version = "0.1.8" }
quench-pg = { registry = "ennor", version = "0.1.8" }
quench-starter = { registry = "ennor", version = "0.4.16" }
quench-desktop = { registry = "ennor", version = "0.1.0" }
quench-fullstack = { registry = "ennor", version = "0.1.3" }
quench-client = { registry = "ennor", version = "0.2.17" }
quench-crypto = { registry = "ennor", version = "0.1.8" }
quench-desktop-native = { registry = "ennor", version = "0.1.1" }
quench-style = { registry = "ennor", version = "0.1.2" }
quench-ui-native = { registry = "ennor", version = "0.1.1" }
quench-http = { registry = "ennor", version = "0.1.14" }
quench-serde = { registry = "ennor", version = "0.1.6" }
quench-test = { registry = "ennor", version = "0.1.2" }
quench-ui = { registry = "ennor", version = "0.1.3" }
quench-ui-web = { registry = "ennor", version = "0.1.3" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
hoist-core = { path = "core" }
hoist-net = { path = "net" }
hoist-desktop = { path = "desktop" }
hoist-app = { path = "app" }
hoist-service = { path = "service" }

# The browser build, as `quench build --release` makes it: small and slow to compile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The browser build while you work: quick to compile.
[profile.wasm-dev]
inherits = "dev"
# The renderer lays out and paints a whole screen on every change: unoptimised, that is ~200 ms on a phone and every
# tap feels slow. Dependencies are built once, so optimising them costs nothing after the first build.
[profile.dev.package."*"]
opt-level = 3
