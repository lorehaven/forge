[package]
name = "hoist-surface"
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The program the Android host starts to draw the screen (`quench android build-native` copies it into the
# app as libquench_surface.so; it is named for the project, as three projects in one workspace cannot all leave a
# `quench_surface`). It reads touches and keys from stdin and writes frames to stdout.
[[bin]]
name = "hoist_surface"
path = "src/main.rs"

[dependencies]
hoist-app = { workspace = true }
hoist-core = { workspace = true }
hoist-desktop = { path = "../desktop", default-features = false }
quench-android-surface = { workspace = true }
quench-style = { workspace = true }
quench-ui = { workspace = true }
quench-ui-native = { workspace = true }