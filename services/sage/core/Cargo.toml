[package]
name = "sage-core"
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
autotests = false

# What Sage's API says and how the browser reads it: the wire records, the events of a streamed answer, the markdown subset the
# answers are written in, the composer's rules. No I/O, and it builds for the browser: the service and the client share it.
[lib]
name = "sage_core"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dependencies]
quench-serde = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }
