[package]
name = "sage"
version = "0.6.4"
edition = { workspace = true }
authors = { workspace = true }
description = "Sage - AI workspace service"
keywords = ["ai", "assistant", "development", "tools"]
categories = ["asynchronous", "development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "sage_service"
path = "src/lib.rs"

[lints]
workspace = true

[[bin]]
name = "sage-service"
path = "src/main.rs"

[dependencies]
quench-pg = { workspace = true }
quench-log = { workspace = true }
quench-core = { workspace = true }
quench-serde = { workspace = true }
quench-convert = { workspace = true }
quench-html = { workspace = true }
forge-web = { workspace = true }
quench-pdf = { workspace = true }
quench-auth = { workspace = true }
quench-cache = { workspace = true }
quench-client = { workspace = true }
quench-config = { workspace = true }
quench-db = { workspace = true }
quench-http = { workspace = true }
quench-starter = { workspace = true }
quench-regex = { workspace = true }
sage-core = { workspace = true }
sage-web = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "pg_rows"
path = "tests/pg_rows.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
