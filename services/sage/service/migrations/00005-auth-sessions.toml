[[migrations]]
id = "0005-auth-sessions"
author = "quench-srv"

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS sage.sessions (
    id TEXT PRIMARY KEY,
    username TEXT NOT NULL REFERENCES sage.users(username) ON DELETE CASCADE,
    refresh_token_hash TEXT NOT NULL UNIQUE,
    created_at TEXT NOT NULL,
    expires_at TEXT NOT NULL,
    revoked_at TEXT
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS sage_sessions_username_idx ON sage.sessions(username);"
