[package]
name = "warehouse-web"
autotests = false
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The browser's Warehouse: the screens of `warehouse-app` over `fetch`, with the session cookie the SSO routes set.
# `cdylib` is the module the page loads (`cargo build --target wasm32-unknown-unknown --profile wasm -p warehouse-web`);
# `rlib` is what the tests and the service use (the service serves the module and the page that starts it).
[lib]
name = "warehouse_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
quench-serde = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }
warehouse-app = { workspace = true }
warehouse-core = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-core = { workspace = true }
quench-test = { workspace = true }
