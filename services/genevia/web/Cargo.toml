[package]
name = "genevia-web"
autotests = false
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The browser's Genevia: the screens of `genevia-app` over `fetch`, with the session cookie the service's sign-in set.
# `cdylib` is the module the page loads (`cargo build --target wasm32-unknown-unknown --profile wasm -p genevia-web`);
# `rlib` is what the tests and the service use (the service serves the module and the page that starts it).
[lib]
name = "genevia_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
genevia-app = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true
