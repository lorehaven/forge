[package]
name = "genevia"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Genevia - family trees imported from GEDCOM, viewed as a list, a pedigree and a fan"
keywords = ["genealogy", "family-tree", "gedcom"]
categories = ["web-programming"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "genevia_service"
path = "src/lib.rs"

[lints]
workspace = true

[[bin]]
name = "genevia-service"
path = "src/main.rs"

[dependencies]
forge-web = { workspace = true }
genevia-core = { workspace = true }
genevia-web = { workspace = true }
quench-auth = { workspace = true }
quench-core = { workspace = true }
quench-db = { workspace = true }
quench-http = { workspace = true }
quench-log = { workspace = true }
quench-pg = { workspace = true }
quench-serde = { workspace = true }
quench-starter = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"
harness = false
