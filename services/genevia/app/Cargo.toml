[package]
name = "genevia-app"
autotests = false
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The screens: the trees, a tree's list, pedigree and fan views, the side panel and the dialogs that change a tree. The app does
# no I/O: it talks to the service through `api` over a `Host` the page installs, so the same screens run in the browser and
# in tests.
[lib]
name = "genevia_app"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
forge-shell = { workspace = true }
genevia-core = { workspace = true }
quench-serde = { workspace = true }
quench-ui = { workspace = true }

[[test]]
name = "screens"
path = "tests/screens.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true
