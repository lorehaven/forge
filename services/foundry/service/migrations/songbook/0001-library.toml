# Settings and bookkeeping: the key scheme, the nightly schedule and its last result.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.meta (
    key TEXT PRIMARY KEY,
    value TEXT NOT NULL
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS song_artist_artist ON ${schema}.song_artist (artist_id);"

[[migrations.changes]]
