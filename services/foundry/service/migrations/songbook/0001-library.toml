[[migrations]]
id = "0001-library"
author = "songbook-service"
since = "0.1.0"

# The library index, moved from SQLite (meta/library.db). No foreign keys, as before: the service deletes what hangs on a
# row itself, and the data move loads the tables in any order. Ids are identity columns that accept explicit values, so the
# move keeps the ids the playlists and the apps already hold.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.artists (
    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    deezer_id BIGINT UNIQUE,
    name TEXT NOT NULL,
    listed_as TEXT UNIQUE
);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.albums (
    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    deezer_id BIGINT UNIQUE,
    title TEXT NOT NULL,
    year TEXT,
    type TEXT,
    genre TEXT,
    owner_id BIGINT
);
"""

# `key` is the identity of a song (artists and title, normalised); `filename` is its audio file without the extension.
# `yt_official` and `yt_manual` are 0/1 as before. `yt_status` is NULL (not looked up), 'ok' or 'miss'.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.songs (
    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    key TEXT NOT NULL UNIQUE,
    title TEXT NOT NULL,
    filename TEXT NOT NULL UNIQUE,
    duration BIGINT,
    yt_url TEXT NOT NULL DEFAULT '',
    yt_channel TEXT NOT NULL DEFAULT '',
    yt_title TEXT NOT NULL DEFAULT '',
    yt_official BIGINT NOT NULL DEFAULT 0,
    yt_score DOUBLE PRECISION,
    yt_manual BIGINT NOT NULL DEFAULT 0,
    yt_status TEXT,
    yt_candidate TEXT NOT NULL DEFAULT '',
    rank BIGINT,
    yt_views BIGINT
);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.song_artist (
    song_id BIGINT NOT NULL,
    artist_id BIGINT NOT NULL,
    position BIGINT NOT NULL,
    PRIMARY KEY (song_id, artist_id)
);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.song_album (
    song_id BIGINT NOT NULL,
    album_id BIGINT NOT NULL,
    track_no BIGINT,
    PRIMARY KEY (song_id, album_id)
);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.song_track (
    deezer_id BIGINT PRIMARY KEY,
    song_id BIGINT NOT NULL
);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.tags (
    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    kind TEXT NOT NULL,
    name TEXT NOT NULL,
    UNIQUE (kind, name)
