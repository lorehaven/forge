[[migrations]]
id = "0002-listeners"
author = "songbook-service"
since = "0.1.0"

# What each signed-in person owns, moved from SQLite (meta/user.db). Kept in tables of their own so that writing one never
# drops the library's cached copy. `owner` is the person's user name; `at` and `created` are Unix seconds.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.playlists (
    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    owner TEXT NOT NULL,
    name TEXT NOT NULL,
    created BIGINT NOT NULL DEFAULT 0
);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.playlist_songs (
    playlist_id BIGINT NOT NULL,
    position BIGINT NOT NULL,
    song_id BIGINT NOT NULL,
    PRIMARY KEY (playlist_id, position)
);
"""

# The latest plays of a person (the service keeps 500); `id` orders plays that share a second.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.plays (
    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    owner TEXT NOT NULL,
    song_id BIGINT NOT NULL,
    at BIGINT NOT NULL
);
"""

# The things a person started (an album, a mix, a playlist), most recent first (the service keeps 60).
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.contexts (
    owner TEXT NOT NULL,
    key TEXT NOT NULL,
    kind TEXT NOT NULL,
    name TEXT NOT NULL,
    sub TEXT NOT NULL,
    art_kind TEXT NOT NULL,
    art_key TEXT NOT NULL,
    query TEXT NOT NULL,
    shuffle BIGINT NOT NULL,
    at BIGINT NOT NULL,
    PRIMARY KEY (owner, key)
);
"""

# Where a person stopped listening, on any device.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.resume (
    owner TEXT PRIMARY KEY,
    song_id BIGINT NOT NULL,
    position_ms BIGINT NOT NULL,
    queue TEXT NOT NULL,
    idx BIGINT NOT NULL,
    device TEXT NOT NULL,
    at BIGINT NOT NULL
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS playlists_owner ON ${schema}.playlists (owner);"

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS plays_owner_at ON ${schema}.plays (owner, at);"

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS contexts_owner_at ON ${schema}.contexts (owner, at);"
