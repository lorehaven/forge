[[migrations]]
id = "0001-mail"
author = "mailroom-service"
since = "0.1.0"

# One mailbox per person (`owner` is the Gatehouse user name), made the first time the person signs in or a service writes to them.
# A disabled mailbox still receives mail; its owner cannot open it or send from it.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.mailboxes (
    owner TEXT PRIMARY KEY,
    address TEXT NOT NULL UNIQUE,
    created BIGINT NOT NULL,
    last_seen BIGINT,
    disabled BOOLEAN NOT NULL DEFAULT FALSE
);
"""

# Mail, one row per mailbox it is in: a message to three people is three rows (and one more in the sender's `sent`). `folder` is
# `inbox`, `sent` or `trash`; `moved` is when it came to that folder (the trash is emptied after a while). `source` is the name of
# the service that wrote it, empty for a person's mail. `to_json`/`cc_json` are arrays of {name, address}. `search` is the
# lower-cased text a search looks in. `size` counts the text, the HTML and the attachments.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.messages (
    seq BIGINT GENERATED ALWAYS AS IDENTITY,
    id TEXT PRIMARY KEY,
    owner TEXT NOT NULL REFERENCES ${schema}.mailboxes (owner) ON DELETE CASCADE,
    folder TEXT NOT NULL,
    message_id TEXT NOT NULL,
    in_reply_to TEXT NOT NULL DEFAULT '',
    from_name TEXT NOT NULL DEFAULT '',
    from_address TEXT NOT NULL,
    source TEXT NOT NULL DEFAULT '',
    to_json TEXT NOT NULL DEFAULT '[]',
    cc_json TEXT NOT NULL DEFAULT '[]',
    subject TEXT NOT NULL DEFAULT '',
    unsubscribe TEXT NOT NULL DEFAULT '',
    date BIGINT NOT NULL,
    moved BIGINT NOT NULL,
    preview TEXT NOT NULL DEFAULT '',
    seen BOOLEAN NOT NULL DEFAULT FALSE,
    flagged BOOLEAN NOT NULL DEFAULT FALSE,
    answered BOOLEAN NOT NULL DEFAULT FALSE,
    attachments BOOLEAN NOT NULL DEFAULT FALSE,
    size INTEGER NOT NULL DEFAULT 0,
    search TEXT NOT NULL DEFAULT ''
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS messages_folder_date ON ${schema}.messages (owner, folder, date DESC, seq DESC);"

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS messages_trash ON ${schema}.messages (moved) WHERE folder = 'trash';"

# The text and the HTML of a message, apart from the row the list reads.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.bodies (
    message_id TEXT PRIMARY KEY REFERENCES ${schema}.messages (id) ON DELETE CASCADE,
    text TEXT NOT NULL DEFAULT '',
    html TEXT
);
"""

# Attachment bytes are stored once (`blobs`) and every copy of the message points at them; a blob nobody points at any more is
# removed by the maintenance pass.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.blobs (
    id TEXT PRIMARY KEY,
    data BYTEA NOT NULL,
    created BIGINT NOT NULL
);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.attachments (
    message_id TEXT NOT NULL REFERENCES ${schema}.messages (id) ON DELETE CASCADE,
    idx INTEGER NOT NULL,
    filename TEXT NOT NULL,
    media_type TEXT NOT NULL,
    size INTEGER NOT NULL,
    blob_id TEXT NOT NULL,
    PRIMARY KEY (message_id, idx)
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS attachments_blob ON ${schema}.attachments (blob_id);"

# What the services delivered (never what people wrote to each other): who asked, to whom, the subject, how it went. `idem_key`
# makes a retry of the same request a no-op.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.deliveries (
    seq BIGINT GENERATED ALWAYS AS IDENTITY,
    id TEXT PRIMARY KEY,
    source TEXT NOT NULL,
    kind TEXT NOT NULL DEFAULT '',
    recipients TEXT NOT NULL,
    subject TEXT NOT NULL DEFAULT '',
    status TEXT NOT NULL,
    delivered INTEGER NOT NULL DEFAULT 0,
    error TEXT,
    created BIGINT NOT NULL,
    idem_key TEXT
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS deliveries_created ON ${schema}.deliveries (created DESC, seq DESC);"

[[migrations.changes]]
sql = "CREATE UNIQUE INDEX IF NOT EXISTS deliveries_idem ON ${schema}.deliveries (source, idem_key) WHERE idem_key IS NOT NULL;"

# Files uploaded for a message being written; removed when sent or after a day.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.uploads (
    id TEXT PRIMARY KEY,
    owner TEXT NOT NULL,
    filename TEXT NOT NULL,
    media_type TEXT NOT NULL,
    data BYTEA NOT NULL,
    size INTEGER NOT NULL,
    created BIGINT NOT NULL
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS uploads_owner ON ${schema}.uploads (owner);"

# The administrator's settings (one JSON document under `main`).
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.settings (
    key TEXT PRIMARY KEY,
    value TEXT NOT NULL
);
"""

# What administrators did.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.audit (
    seq BIGINT GENERATED ALWAYS AS IDENTITY,
    id TEXT PRIMARY KEY,
    at BIGINT NOT NULL,
    actor TEXT NOT NULL,
    action TEXT NOT NULL,
    target TEXT NOT NULL DEFAULT '',
    detail TEXT NOT NULL DEFAULT ''
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS audit_at ON ${schema}.audit (at DESC, seq DESC);"
