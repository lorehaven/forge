[package]
name = "gatehouse-web"
autotests = false
version = "0.1.0"
edition.workspace = true
publish = false
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

# The browser's Gatehouse: the screens of `gatehouse-app` over `fetch`, with the session cookie the service's sign-in set.
# `cdylib` is the module the page loads (`cargo build --target wasm32-unknown-unknown --profile wasm -p gatehouse-web`);
# `rlib` is what the tests and the service use.
[lib]
name = "gatehouse_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
quench-serde = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }
gatehouse-app = { workspace = true }
gatehouse-core = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-core = { workspace = true }
quench-test = { workspace = true }
