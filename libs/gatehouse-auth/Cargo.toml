[package]
name = "gatehouse-auth"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Application-token credentials for the CLI tools - secret file, token exchange, login"
keywords = ["authentication", "tools"]
categories = ["authentication", "development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[lib]
name = "gatehouse_auth"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "form"] }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
