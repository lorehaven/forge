[package]
name = "quench-cache"
version = "0.1.1"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - caching: in-process by default, Redis behind the `redis` feature"
keywords = ["cache", "redis", "performance"]
categories = ["caching"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }

[dependencies]
dashmap = { workspace = true }
redis = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["request-cache", "data-cache"]
# Shared, cross-replica cache. Off by default: it pulls in a Redis client and
# most callers only need the in-process one.
redis = ["dep:redis", "data-cache"]
request-cache = []
data-cache = []

[dev-dependencies]
tokio = { workspace = true }
