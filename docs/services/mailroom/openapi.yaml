openapi: 3.1.0
info:
  title: Mailroom
  version: 0.1.2
  description: >
    The estate's own mail. Everything under /api/v1 is behind the realm's Auth middleware (bearer token or session cookie, audience
    mailroom); each route checks the grant it needs (read, write, send or admin) itself. Mail stays inside the estate: nothing is
    delivered to an address outside it, and an administrator sees the mailboxes and their size, never what is in them.
servers:
  - url: '{base}'
    variables:
      base:
        default: /mailroom
        description: BASE_PATH of the deployment.
tags:
  - name: mail
    description: A person's own mailbox.
  - name: services
    description: How a service writes to people.
  - name: admin
    description: The administrator's panel.
  - name: ui
    description: The browser client and its sign-in.
paths:
  /api/v1/me:
    get:
      tags: [mail]
      operationId: me
      summary: Who the caller is, and their address
      x-permission: mailroom:read
      responses:
        '200': {description: The caller's mailbox, created on first use.}
        '401': {description: No valid token or session.}
        '403': {description: The token lacks the grant, or the mailbox is disabled.}
  /api/v1/folders:
    get:
      tags: [mail]
      operationId: listFolders
      summary: The three folders with their counts
      x-permission: mailroom:read
      responses:
        '200': {description: Inbox, sent and trash.}
        '401': {description: No valid token or session.}
        '403': {description: The token lacks the grant.}
  /api/v1/messages:
    get:
      tags: [mail]
      operationId: listMessages
      summary: Messages in a folder, newest first
      x-permission: mailroom:read
      parameters:
        - {name: folder, in: query, required: false, schema: {type: string, enum: [inbox, sent, trash]}}
        - {name: q, in: query, required: false, schema: {type: string}, description: Search in subject, sender and text.}
        - {name: unread, in: query, required: false, schema: {type: string}}
        - {name: flagged, in: query, required: false, schema: {type: string}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200': {description: A page of summaries.}
        '400': {description: A parameter is not acceptable.}
        '401': {description: No valid token or session.}
        '403': {description: The token lacks the grant.}
  /api/v1/messages/{id}:
    get:
      tags: [mail]
      operationId: getMessage
      summary: One message of the caller's, and mark it seen
      x-permission: mailroom:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The message.}
        '404': {description: No such message in the caller's mailbox (someone else's looks the same).}
  /api/v1/messages/{id}/html:
    get:
      tags: [mail]
      operationId: getMessageHtml
      summary: The sanitised HTML of a message, for a sandboxed frame
      x-permission: mailroom:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: remote, in: query, required: false, schema: {type: string}, description: Allow remote images when `1`.}
      responses:
        '200': {description: HTML with its own content-security-policy, never cached.}
        '404': {description: No such message, or it has no HTML part.}
  /api/v1/messages/{id}/attachments/{index}:
    get:
      tags: [mail]
      operationId: getAttachment
      summary: One attachment of a message
      x-permission: mailroom:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: index, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: The file, as a download.}
        '404': {description: No such message or attachment.}
  /api/v1/people:
    get:
      tags: [mail]
      operationId: listPeople
      summary: Addresses that start like what is being typed
      x-permission: mailroom:read
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Matching addresses, never mailboxes' contents.}
  /api/v1/outgoing:
    post:
      tags: [mail]
      operationId: compose
      summary: A person writes to people
      x-permission: mailroom:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Compose'
            example: {to: [sectest-alice], subject: Hello, text: Hello there}
      responses:
        '201': {description: Sent; a copy is in the sender's sent folder.}
        '400': {description: A recipient outside the estate, a header injection, a body over the limit.}
        '403': {description: The token lacks the grant.}
  /api/v1/send:
    post:
      tags: [services]
      operationId: sendFromService
      summary: A service writes to a person
      x-permission: mailroom:send
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
            example: {to: [sectest-alice], subject: Notice, text: Something happened, kind: notification}
      responses:
        '201': {description: Delivered.}
        '200': {description: A retry with the same idempotency key; nothing was delivered twice.}
        '400': {description: A recipient that is not a mailbox of this estate.}
        '403': {description: The token lacks the grant.}
  /api/v1/message-changes:
    post:
      tags: [mail]
      operationId: changeMessages
      summary: Mark, star, move or delete messages
      x-permission: mailroom:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Change'
            example: {ids: [m1], seen: true}
      responses:
        '204': {description: Done.}
        '400': {description: An unknown folder, or a delete outside the trash.}
        '404': {description: A message that is not the caller's.}
  /api/v1/messages/{id}/thread:
    get:
      tags: [mail]
      operationId: getThread
      summary: The other messages of the conversation a message belongs to, oldest first
      description: >
        Found by the links in the headers (what a message answers and what answers it, a few steps each way, at most 30), not by
        the subject: automated mail that shares a subject is not a conversation.
      x-permission: mailroom:read
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The other messages (summaries), empty when it is alone.}
        '404': {description: No such message in the caller's mailbox.}
  /api/v1/drafts:
    get:
      tags: [mail]
      operationId: listDrafts
      summary: The caller's drafts, the latest first
      x-permission: mailroom:read
      responses:
        '200': {description: The drafts (at most 200).}
    post:
      tags: [mail]
      operationId: createDraft
      summary: Keep a message that is being written
      description: Nothing is checked yet (recipients are as typed). A person keeps at most 100 drafts; attachments are not kept.
      x-permission: mailroom:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInput'
            example: {to: sectest-alice, subject: Hello, text: Dear Alice}
      responses:
        '201': {description: The draft, with its id.}
        '400': {description: Too long, or too many drafts.}
  /api/v1/drafts/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [mail]
      operationId: getDraft
      summary: One draft
      x-permission: mailroom:read
      responses:
        '200': {description: The draft.}
        '404': {description: No such draft of the caller's.}
    put:
      tags: [mail]
      operationId: saveDraft
      summary: Change a draft
      x-permission: mailroom:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInput'
      responses:
        '200': {description: The draft as kept.}
        '400': {description: Too long.}
        '404': {description: No such draft of the caller's (someone else's looks the same).}
    delete:
      tags: [mail]
      operationId: deleteDraft
      summary: Throw a draft away
      x-permission: mailroom:write
      responses:
        '204': {description: Gone (also when there was none).}
  /api/v1/mutes:
    get:
      tags: [mail]
      operationId: listMutes
      summary: The senders whose mail goes straight to the archive
      x-permission: mailroom:read
      responses:
        '200': {description: The muted addresses, lower-case.}
  /api/v1/mutes/{address}:
    parameters:
      - {name: address, in: path, required: true, schema: {type: string}}
    put:
      tags: [mail]
      operationId: muteSender
      summary: Mute a sender
      description: Their mail from now on is put in the archive, already read. At most 200 senders.
      x-permission: mailroom:write
      responses:
        '204': {description: Muted.}
        '400': {description: Not an address, or too many muted senders.}
    delete:
      tags: [mail]
      operationId: unmuteSender
      summary: Let a sender back into the inbox
      x-permission: mailroom:write
      responses:
        '204': {description: Done.}
  /api/v1/signature:
    put:
      tags: [mail]
      operationId: saveSignature
      summary: Keep the text added to the end of the messages the caller starts
      x-permission: mailroom:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signature'
            example: {text: 'Ann, estate office'}
      responses:
        '200': {description: The signature as kept (trailing blank lines removed).}
        '400': {description: Longer than 2000 characters.}
  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: getSettings
      summary: The limits
      x-permission: mailroom:admin
      responses:
        '200': {description: The settings.}
        '403': {description: Not an administrator.}
    put:
      tags: [admin]
      operationId: putSettings
      summary: Change the limits
      x-permission: mailroom:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsInput'
            example: {daily_budget: 250}
      responses:
        '200': {description: The settings after the change.}
        '400': {description: A value that is not acceptable; nothing changed.}
        '403': {description: Not an administrator.}
  /api/v1/admin/stats:
    get:
      tags: [admin]
      operationId: stats
      summary: What is there, never what is in it
      x-permission: mailroom:admin
      responses:
        '200': {description: Counts.}
  /api/v1/admin/mailboxes:
    get:
      tags: [admin]
      operationId: listMailboxes
      summary: The mailboxes with their size
      x-permission: mailroom:admin
      parameters:
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200': {description: A page.}
  /api/v1/admin/deliveries:
    get:
      tags: [admin]
      operationId: listDeliveries
      summary: What the services delivered
      x-permission: mailroom:admin
      parameters:
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200': {description: A page; mail between people is not listed.}
  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: audit
      summary: What the administrators did
      x-permission: mailroom:admin
      parameters:
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        '200': {description: A page.}
  /api/v1/uploads:
    post:
      tags: [mail]
      operationId: upload
      summary: Upload a file to attach to a message
      description: A multipart form with the file in the field `file`. The id it returns goes in a message's `attachments`.
      x-permission: mailroom:write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: 'Kept until it is sent or deleted: its `id`, `filename` and `size`.'}
        '400': {description: No file in the upload, or it could not be read (too large).}
        '403': {description: The token lacks the grant.}
  /api/v1/uploads/{id}:
    delete:
      tags: [mail]
      operationId: deleteUpload
      summary: Drop an upload that was not sent
      x-permission: mailroom:write
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Gone.}
        '404': {description: No such upload of the caller's.}
  /api/v1/admin/mailboxes/{owner}:
    delete:
      tags: [admin]
      operationId: deleteMailbox
      summary: Delete a mailbox with everything in it
      description: The deletion is written to the audit log. Nothing else of the person's is touched.
      x-permission: mailroom:admin
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Deleted.}
        '403': {description: Not an administrator.}
        '404': {description: No such mailbox.}
  /api/v1/admin/mailboxes/{owner}/disable:
    post:
      tags: [admin]
      operationId: disableMailbox
      summary: Switch a mailbox off
      description: A disabled mailbox still receives mail, but its owner cannot open it or send from it.
      x-permission: mailroom:admin
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Disabled.}
        '403': {description: Not an administrator.}
        '404': {description: No such mailbox.}
  /api/v1/admin/mailboxes/{owner}/enable:
    post:
      tags: [admin]
      operationId: enableMailbox
      summary: Switch a mailbox on again
      x-permission: mailroom:admin
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Enabled.}
        '403': {description: Not an administrator.}
        '404': {description: No such mailbox.}
  /ui:
    get:
      tags: [ui]
      operationId: uiRoot
      summary: Redirect to the home page, or to login without a session
      security: []
      responses:
        '302': {description: 'To {base}/ui/home, or {base}/ui/login when not signed in.'}
  /ui/:
    get:
      tags: [ui]
      operationId: uiRootSlash
      summary: Same as /ui
      security: []
      responses:
        '302': {description: 'To {base}/ui/home, or {base}/ui/login when not signed in.'}
  /ui/home:
    get:
      tags: [ui]
      operationId: uiHome
      summary: Client page, the inbox
      security: []
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/home/:
    get:
      tags: [ui]
      operationId: uiHomeSlash
      summary: Same as /ui/home
      security: []
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/folder/{id}:
    get:
      tags: [ui]
      operationId: uiFolder
      summary: Client page, one folder
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/message/{id}:
    get:
      tags: [ui]
      operationId: uiMessage
      summary: Client page, one message
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/drafts:
    get:
      tags: [ui]
      operationId: uiDrafts
      summary: Client page, the drafts
      security: []
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/muted:
    get:
      tags: [ui]
      operationId: uiMuted
      summary: Client page, the settings (signature, notifications, muted senders)
      security: []
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/compose:
    get:
      tags: [ui]
      operationId: uiCompose
      summary: Client page, a new message
      security: []
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/compose/{mode}/{id}:
    get:
      tags: [ui]
      operationId: uiComposeFrom
      summary: Client page, a reply or a forward of a message, or a saved draft
      security: []
      parameters:
        - {name: mode, in: path, required: true, schema: {type: string, enum: [reply, replyall, forward, draft]}}
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/admin:
    get:
      tags: [ui]
      operationId: uiAdmin
      summary: Client page, the administrator's panel
      security: []
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/admin/{section}:
    get:
      tags: [ui]
      operationId: uiAdminSection
      summary: Client page, one section of the panel
      security: []
      parameters:
        - {name: section, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ClientPage'}
        '302': {description: 'To {base}/ui/login without a valid session cookie.'}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/assets/app.css:
    get:
      tags: [ui]
      operationId: uiAssetStyle
      summary: The shell stylesheet followed by Mailroom's
      security: []
      responses:
        '200': {description: The file., content: {text/css: {schema: {type: string, format: binary}}}}
  /ui/assets/quench.js:
    get:
      tags: [ui]
      operationId: uiAssetLoader
      summary: The client loader
      security: []
      responses:
        '200': {description: The file., content: {text/javascript: {schema: {type: string, format: binary}}}}
  /ui/assets/shell.js:
    get:
      tags: [ui]
      operationId: uiAssetShell
      summary: The page shell's script
      security: []
      responses:
        '200': {description: The file., content: {text/javascript: {schema: {type: string, format: binary}}}}
  /ui/assets/favicon.png:
    get:
      tags: [ui]
      operationId: uiAssetIcon
      summary: The icon
      security: []
      responses:
        '200': {description: The file., content: {image/png: {schema: {type: string, format: binary}}}}
  /ui/assets/app.wasm:
    get:
      tags: [ui]
      operationId: uiAssetModule
      summary: The browser client module
      security: []
      responses:
        '200': {description: The file., content: {application/wasm: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/ClientMissing'}
  /ui/login:
    get:
      tags: [ui]
      operationId: uiLogin
      summary: Start sign-in (SSO redirect to Gatehouse)
      security: []
      responses:
        '302': {description: "To {base}/ui/home (refresh cookie accepted) or to Gatehouse's /api/v1/authorize; sets the state cookie."}
        '503': {description: 'Text `gatehouse is not configured`.'}
  /ui/login/:
    get:
      tags: [ui]
      operationId: uiLoginSlash
      summary: Same as /ui/login
      security: []
      responses:
        '302': {description: See /ui/login.}
        '503': {description: 'Text `gatehouse is not configured`.'}
  /ui/auth/callback:
    get:
      tags: [ui]
      operationId: uiAuthCallback
      summary: Complete the authorization-code exchange
      security: []
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
      responses:
        '302': {description: "To {base}/ui/home with session cookies, or to {base}/ui/login on any failure."}
        '503': {description: 'Text `gatehouse is not configured`.'}
  /ui/logout:
    get:
      tags: [ui]
      operationId: uiLogout
      summary: Realm logout through Gatehouse
      security: []
      responses:
        '302': {description: "To Gatehouse's /ui/logout with a redirect back to {base}/ui/login."}
        '503': {description: 'Text `gatehouse is not configured`.'}
  /ui/status:
    get:
      tags: [ui]
      operationId: uiStatus
      summary: Session status for the page shell
      security: []
      responses:
        '200':
          description: Always 200.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStatus'}
  /ui/refresh:
    post:
      tags: [ui]
      operationId: uiRefresh
      summary: Exchange the refresh cookie for new cookies
      security: []
      responses:
        '200':
          description: New session and refresh cookies set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStatus'}
        '401': {description: No refresh cookie, or Gatehouse refused it. Empty body.}
components:
  responses:
    ClientPage:
      description: The HTML page that starts the browser client (cache-control no-store, nonce CSP).
      content:
        text/html: {schema: {type: string}}
    ClientMissing:
      description: app.wasm is not in WEB_DIR ("the browser client is not installed on this server").
  schemas:
    AuthStatus:
      type: object
      required: [authenticated]
      properties:
        authenticated: {type: boolean}
        username: {type: [string, 'null']}
        roles: {type: array, items: {type: string}}
    Compose:
      type: object
      required: [to, subject, text]
      properties:
        to: {type: array, items: {type: string}}
        cc: {type: array, items: {type: string}}
        bcc: {type: array, items: {type: string}}
        subject: {type: string}
        text: {type: string}
        in_reply_to: {type: [string, 'null'], description: The id of the message being answered.}
        attachments: {type: array, items: {type: string}, description: Ids from the upload endpoint.}
        draft: {type: [string, 'null'], description: The draft this was written in; it is removed once the message is sent.}
    DraftInput:
      type: object
      properties:
        to: {type: string, description: As typed (names or addresses, separated by commas).}
        cc: {type: string}
        bcc: {type: string}
        subject: {type: string}
        text: {type: string}
        in_reply_to: {type: [string, 'null'], description: The id of the message being answered.}
    Signature:
      type: object
      required: [text]
      properties:
        text: {type: string, maxLength: 2000}
    SendRequest:
      type: object
      required: [to, subject, text]
      properties:
        to: {type: array, items: {type: string}, description: Usernames or `username@<domain>`; nothing outside the estate.}
        subject: {type: string}
        text: {type: string}
        html: {type: [string, 'null']}
        unsubscribe: {type: [string, 'null'], description: The link that stops this kind of mail.}
        kind: {type: [string, 'null']}
        idempotency_key: {type: [string, 'null'], description: A retry with the same key does not deliver twice.}
    Change:
      type: object
      description: Either `ids` (1 to 200 messages) or `all_in` (a whole folder, up to 5000 messages), not both.
      properties:
        ids: {type: array, items: {type: string}}
        all_in: {type: [string, 'null'], description: 'Every message of this folder (`inbox`, `archive`, `sent` or `trash`) instead of `ids`.'}
        seen: {type: [boolean, 'null']}
