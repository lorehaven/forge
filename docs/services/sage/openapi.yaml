      security: []
      responses:
        '302':
          description: To Gatehouse's /ui/logout with a redirect back to {base}/ui/login.
        '503':
          description: Text `gatehouse is not configured` (GATEHOUSE_URL, GATEHOUSE_CLIENT_ID or GATEHOUSE_CLIENT_SECRET missing).
  /ui/status:
    get:
      tags:
      - ui
      operationId: uiStatus
      summary: Session status for the page shell
      security: []
      responses:
        '200':
          description: Always 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /ui/refresh:
    post:
      tags:
      - ui
      operationId: uiRefresh
      summary: Exchange the refresh cookie for new cookies
      security: []
      responses:
        '200':
          description: New session and refresh cookies set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
              example:
                authenticated: true
                username: null
                roles: []
        '401':
          description: No refresh cookie, or Gatehouse refused it. Empty body.
components:
  schemas:
    Created:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    Project:
      type: object
      required:
      - id
      - name
      - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        updated_at:
          type: string
          description: RFC 3339.
    NewProject:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 120
    ConversationItem:
      type: object
      required:
      - id
      - title
      - project_id
      - updated_at
      properties:
        id:
          type: string
        title:
          type: string
          description: The first 30 characters of the first message, with `...` when longer; blank until the first message.
        project_id:
          type:
          - string
          - 'null'
        updated_at:
          type: string
    FileInfo:
      type: object
      required:
      - id
      - file_name
      - mime_type
      - file_size
      - conversation_id
      - project_id
      - message_id
      - status
      - error_message
      properties:
        id:
          type: string
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
        conversation_id:
          type:
          - string
          - 'null'
        project_id:
          type:
          - string
          - 'null'
        message_id:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - uploaded
          - processing
          - ready
          - failed
        error_message:
          type:
          - string
          - 'null'
    StoredFile:
      description: 'A files row as stored (GET /api/v1/files*, reprocess): FileInfo plus owner and timestamps.'
      allOf:
      - $ref: '#/components/schemas/FileInfo'
      - type: object
        required:
        - owner
        - created_at
        - updated_at
        properties:
          owner:
            type: string
          created_at:
            type: string
          updated_at:
            type: string
    FileChunk:
      type: object
      required:
      - id
      - file_id
      - chunk_index
      - content
      - embedding_model
      - metadata
      - created_at
      properties:
        id:
          type: string
        file_id:
          type: string
        chunk_index:
          type: integer
        content:
          type: string
        embedding_model:
          type:
          - string
          - 'null'
        metadata:
          description: 'JSON: heading, page, language, depending on the format.'
        created_at:
          type: string
    UploadForm:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          format: binary
        conversation_id:
          type: string
        project_id:
          type: string
    Source:
      type: object
      required:
      - file_name
      - chunk_index
      - detail
      - similarity
      properties:
        file_name:
          type: string
          description: File name, or the web page label.
        chunk_index:
          type:
          - integer
          - 'null'
        detail:
          type:
          - string
          - 'null'
        similarity:
          type:
          - number
          - 'null'
    MessageNode:
      type: object
      required:
      - id
      - parent_id
      - role
      - content
      - created_at
      - siblings
      - sources
      - attachments
      properties:
        id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        created_at:
          type: string
        siblings:
          type: array
          items:
            type: string
          description: Ids of the alternatives at this point of the tree, this one included, oldest first.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
    ConversationView:
      type: object
      required:
      - id
      - title
      - project_id
      - messages
      properties:
        id:
          type: string
        title:
          type: string
        project_id:
          type:
          - string
          - 'null'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageNode'
    ModelOption:
      type: object
      required:
      - id
      - model
      properties:
        id:
          type: string
          description: Switchboard instance id.
        model:
          type: string
    DefaultModelState:
      type: object
      required:
      - name
      - embedding
      - state
      properties:
        name:
          type: string
        embedding:
          type: boolean
        state:
          type: string
          enum:
          - running
          - starting
          - pending
          - failed
          - unknown
    SearchProviderOption:
      type: object
      required:
      - id
      - label
      properties:
        id:
          type: string
        label:
          type: string
    ModelsView:
      type: object
      required:
      - switchboard_ok
      - ready
      - instances
      - defaults
      - search_providers
      - default_search_provider
      - accept
      properties:
        switchboard_ok:
          type: boolean
        ready:
          type: boolean
        instances:
          type: array
          items:
            $ref: '#/components/schemas/ModelOption'
        defaults:
          type: array
          items:
            $ref: '#/components/schemas/DefaultModelState'
        search_providers:
          type: array
          items:
            $ref: '#/components/schemas/SearchProviderOption'
        default_search_provider:
          type: string
        accept:
          type: string
          description: 'The `accept` value of the file picker: every allowed extension with a dot, comma-separated (image
            extensions only when SAGE_IMAGES_ENABLED).'
    SwitchBody:
      type: object
      required:
      - target_message_id
      properties:
        target_message_id:
          type: string
    EditBody:
      type: object
      required:
      - new_content
      properties:
        new_content:
          type: string
    RegenerateBody:
      type: object
      required:
      - message_id
      properties:
        message_id:
          type: string
          description: An assistant message.
    TurnStarted:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    Resumed:
      type: object
      required:
      - id
      properties:
        id:
          type:
          - string
          - 'null'
    TurnRequest:
      type: object
      required:
      - instance_id
      - message
      - conversation_id
      properties:
        instance_id:
          type: string
          description: A chat-capable Switchboard instance id (from GET /api/v1/models).
        message:
          type: string
        conversation_id:
          type: string
          description: From GET /api/v1/conversation-id for a new chat.
        project_id:
          type:
          - string
          - 'null'
        search_provider:
          type:
          - string
          - 'null'
          description: duckduckgo, searxng, brave or serpapi; the configured default when absent.
        capability_profile:
          type:
          - string
          - 'null'
          description: web_assistant, code_assistant or cli_agent; an unknown name, or a profile broader than the configured one, falls back to the configured profile. Accepted
            from the body although the browser client never sends it.
        tool_confirmations:
          type: array
          items:
            type: string
          default: []
          description: Names of tools the caller confirms (command, file_ops).
        file_ids:
          type: string
          default: ''
          description: Staged file ids, comma separated.
        parent_id:
          description: Ignored (reset to null).
        skip_user_message:
          description: Ignored (reset to false).
    ChatRequest:
      type: object
      required:
      - instance_id
      - message
      properties:
        instance_id:
          type: string
        message:
          type: string
        history:
          type: array
          items:
            type: object
            required:
            - role
            - content
            properties:
              role:
                type: string
                enum:
                - user
                - assistant
              content:
                type: string
          default: []
          description: Earlier turns, oldest first; other roles are dropped.
        search_provider:
          type:
          - string
          - 'null'
        evidence:
          type:
          - array
          - 'null'
          items:
            type: object
            required:
            - url
            - text
            properties:
              url:
                type: string
              text:
                type: string
          description: Fixed source passages. Present (even empty) means planning, search and fetching are skipped and the
            answer is grounded on these.
    CapabilitiesResponse:
      type: object
      required:
      - profile
      - description
      - available_tools
      - available_search_providers
      properties:
        profile:
          type: string
        description:
          type: string
        available_tools:
          type: array
          items:
            type: string
        available_search_providers:
          type: array
          items:
            type: string
    ToolMetrics:
      type: object
      required:
      - calls
      - successes
      - failures
      - timeouts
      - total_duration_ms
      - min_duration_ms
      - max_duration_ms
      properties:
        calls:
          type: integer
        successes:
          type: integer
        failures:
          type: integer
        timeouts:
          type: integer
        total_duration_ms:
          type: integer
        min_duration_ms:
          type: integer
          description: u128::MAX until a call was recorded.
        max_duration_ms:
          type: integer
    ProfileMetrics:
      type: object
      required:
      - profile
      - total_calls
      - total_successes
      - total_failures
      - tools
      properties:
        profile:
          type: string
        total_calls:
          type: integer
        total_successes:
          type: integer
        total_failures:
          type: integer
        tools:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ToolMetrics'
    MetricsResponse:
      type: object
      required:
      - profiles
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileMetrics'
    UserCosts:
      type: object
      required:
      - user_id
      - request_count
      - total_duration_ms
      - total_tokens_used
      - total_api_calls
      - estimated_cost
      - avg_cost_per_request
      properties:
        user_id:
          type: string
        request_count:
          type: integer
        total_duration_ms:
          type: integer
        total_tokens_used:
          type: integer
        total_api_calls:
          type: integer
        estimated_cost:
          type: number
        avg_cost_per_request:
          type: number
    ProfileCosts:
      type: object
      required:
      - profile
      - request_count
      - total_duration_ms
      - total_tokens_used
      - total_api_calls
      - estimated_cost
      - avg_cost_per_request
      properties:
        profile:
          type: string
        request_count:
          type: integer
        total_duration_ms:
          type: integer
        total_tokens_used:
          type: integer
        total_api_calls:
          type: integer
        estimated_cost:
          type: number
        avg_cost_per_request:
          type: number
    CostsResponse:
      type: object
      required:
      - users
      - profiles
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserCosts'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileCosts'
    ContextStatus:
      type: object
      required:
      - profile
      - current_tokens
      - max_tokens
      - remaining_tokens
      - usage_percent
      - is_near_limit
      - is_at_limit
      properties:
        profile:
          type: string
        current_tokens:
          type: integer
        max_tokens:
          type: integer
        remaining_tokens:
          type: integer
        usage_percent:
          type: number
        is_near_limit:
          type: boolean
        is_at_limit:
          type: boolean
    ChatStats:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        stats:
          type: object
          properties:
            total_messages:
              type: integer
            total_tokens:
              type: integer
            max_tokens:
              type: integer
            system_tokens:
              type: integer
            utilization_percent:
              type: number
            near_limit:
              type: boolean
            at_limit:
              type: boolean
        display:
          type: string
        warning:
          type:
          - string
          - 'null'
        error:
          type: string
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    AuthStatus:
      type: object
      required:
      - authenticated
      - username
      - roles
      properties:
        authenticated:
          type: boolean
        username:
          type:
          - string
          - 'null'
        roles:
          type: array
          items:
            type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from Gatehouse, audience sage.
    sessionCookie:
      type: apiKey
      in: cookie
      name: forge_session
  responses:
    Unauthorized:
      description: No valid token or session (Auth middleware; also unmapped /api/v1 paths). Empty body, or a redirect for
        a browser.
    ClientPage:
      description: The HTML page that starts the browser client (cache-control no-store, nonce CSP).
      content:
        text/html:
          schema:
            type: string
    ClientMissing:
      description: app.wasm is not in WEB_DIR ("the browser client is not installed on this server").
