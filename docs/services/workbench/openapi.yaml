              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ClientMissing'
  /ui/login:
    get:
      tags:
      - ui
      operationId: uiLogin
      summary: Start sign-in (SSO redirect to Gatehouse)
      security: []
      responses:
        '302':
          description: To {base}/ui/home (refresh cookie accepted, new cookies set) or to Gatehouse's /api/v1/authorize; sets
            the cookie forge_authorize_state.
        '503':
          description: Text `gatehouse is not configured` (GATEHOUSE_URL, GATEHOUSE_CLIENT_ID or GATEHOUSE_CLIENT_SECRET missing).
  /ui/login/:
    get:
      tags:
      - ui
      operationId: uiLoginSlash
      summary: Same as /ui/login
      security: []
      responses:
        '302':
          description: See /ui/login.
        '503':
          description: Text `gatehouse is not configured` (GATEHOUSE_URL, GATEHOUSE_CLIENT_ID or GATEHOUSE_CLIENT_SECRET missing).
  /ui/auth/callback:
    get:
      tags:
      - ui
      operationId: uiAuthCallback
      summary: Complete the authorization-code exchange
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: To {base}/ui/home with session cookies, or to {base}/ui/login on any failure.
        '503':
          description: Text `gatehouse is not configured` (GATEHOUSE_URL, GATEHOUSE_CLIENT_ID or GATEHOUSE_CLIENT_SECRET missing).
  /ui/logout:
    get:
      tags:
      - ui
      operationId: uiLogout
      summary: Realm logout through Gatehouse
      security: []
      responses:
        '302':
          description: To Gatehouse's /ui/logout with a redirect back to {base}/ui/login.
        '503':
          description: Text `gatehouse is not configured` (GATEHOUSE_URL, GATEHOUSE_CLIENT_ID or GATEHOUSE_CLIENT_SECRET missing).
  /ui/status:
    get:
      tags:
      - ui
      operationId: uiStatus
      summary: Session status for the page shell
      security: []
      responses:
        '200':
          description: Always 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /ui/refresh:
    post:
      tags:
      - ui
      operationId: uiRefresh
      summary: Exchange the refresh cookie for new cookies
      security: []
      responses:
        '200':
          description: New session and refresh cookies set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
              example:
                authenticated: true
                username: null
                roles: []
        '401':
          description: No refresh cookie, or Gatehouse refused it. Empty body.
components:
  schemas:
    Me:
      type: object
      required:
      - username
      properties:
        username:
          type: string
    User:
      type: object
      required:
      - username
      - display_name
      properties:
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
    Project:
      type: object
      required:
      - id
      - key
      - name
      - description
      - created_at
      - updated_at
      properties:
        id:
          type: string
        key:
          type: string
          description: Unique short code used in issue keys (WB-4).
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        created_at:
          type: string
          description: RFC 3339 timestamp.
        updated_at:
          type: string
    CreateProject:
      type: object
      required:
      - key
      - name
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
    UpdateProject:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
    Issue:
      type: object
      required:
      - id
      - project_id
      - parent_id
      - seq
      - kind
      - title
      - description
      - status
      - priority
      - assignee
      - reporter
      - estimate
      - created_at
      - updated_at
      properties:
        id:
          type: string
        project_id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        seq:
          type: integer
          format: int32
          description: Number within the project; the key is `{project.key}-{seq}`.
        kind:
          type: string
          description: The client offers task, bug, story. Not validated by the service.
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - blocked
          - todo
          - in-progress
          - done
          - rejected
        priority:
          type: string
          description: The client offers low, medium, high. Not validated.
        assignee:
          type:
          - string
          - 'null'
        reporter:
          type: string
        estimate:
          type:
          - integer
          - 'null'
          format: int32
          description: Story points.
        created_at:
          type: string
        updated_at:
          type: string
    CreateIssue:
      type: object
      required:
      - title
      properties:
        parent_id:
          type:
          - string
          - 'null'
        kind:
          type: string
          default: task
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        priority:
          type: string
          default: medium
        assignee:
          type:
          - string
          - 'null'
          description: A username in the realm (foreign key to auth.users).
        estimate:
          type:
          - integer
          - 'null'
          format: int32
    UpdateIssue:
      type: object
      required:
      - title
      - kind
      - priority
      properties:
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        kind:
          type: string
        priority:
          type: string
        assignee:
          type:
          - string
          - 'null'
        estimate:
          type:
          - integer
          - 'null'
          format: int32
    Transition:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - blocked
          - todo
          - in-progress
          - done
          - rejected
    Comment:
      type: object
      required:
      - id
      - issue_id
      - author
      - body
      - created_at
      properties:
        id:
          type: string
        issue_id:
          type: string
        author:
          type: string
        body:
          type: string
        created_at:
          type: string
    NewComment:
      type: object
      required:
      - body
      properties:
        body:
          type: string
    Label:
      type: object
      required:
      - id
      - project_id
      - name
      - color
      - created_at
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        color:
          type: string
        created_at:
          type: string
    CreateLabel:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        color:
          type: string
          default: '#888888'
          description: Not validated.
    IssueLink:
      type: object
      required:
      - id
      - issue_id
      - linked_issue_id
      - kind
      - created_at
      properties:
        id:
          type: string
        issue_id:
          type: string
        linked_issue_id:
          type: string
        kind:
          type: string
          enum:
          - blocks
          - relates_to
        created_at:
          type: string
    NewLink:
      type: object
      required:
      - linked_issue_id
      - kind
      properties:
        linked_issue_id:
          type: string
        kind:
          type: string
          enum:
          - blocks
          - relates_to
    LinkedIssue:
      type: object
      required:
      - link_id
      - issue_id
      - project_key
      - seq
      - title
      - status
      properties:
        link_id:
          type: string
        issue_id:
          type: string
        project_key:
          type: string
        seq:
          type: integer
        title:
          type: string
        status:
          type: string
    RelatedIssues:
      type: object
      required:
      - blocks
      - blocked_by
      - relates_to
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/LinkedIssue'
        blocked_by:
          type: array
          items:
            $ref: '#/components/schemas/LinkedIssue'
        relates_to:
          type: array
          items:
            $ref: '#/components/schemas/LinkedIssue'
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    AuthStatus:
      type: object
      required:
      - authenticated
      - username
      - roles
      properties:
        authenticated:
          type: boolean
        username:
          type:
          - string
          - 'null'
        roles:
          type: array
          items:
            type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from Gatehouse, audience workbench.
    sessionCookie:
      type: apiKey
      in: cookie
      name: forge_session
  responses:
    Unauthorized:
      description: No valid token or session (Auth middleware; also unmapped /api/v1 paths). Empty body, or a redirect for
        a browser.
    ClientPage:
      description: The HTML page that starts the browser client (cache-control no-store, nonce CSP).
      content:
        text/html:
          schema:
            type: string
    ClientMissing:
      description: app.wasm is not in WEB_DIR ("the browser client is not installed on this server").
