      security: []
      responses:
        '200': {description: 'WebAssembly (`application/wasm`).'}
        '404': {description: 'The module is not installed in the web directory.'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A gatehouse access token whose audience includes `conveyor` (a person's, or a client-credentials token).
    sessionCookie:
      type: apiKey
      in: cookie
      name: forge_session
      description: The realm session cookie (name from AUTH_COOKIE_NAME).
  responses:
    BadRequest:
      description: 'Invalid input. Body `{"error": "<text>"}`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: No valid token or session (`Auth`). A browser request is redirected instead.
    Forbidden:
      description: 'The caller lacks the grant. Body `{"error": "no write access to this repository"}` and similar.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 'Not found. Body `{"error": "no such run"}` and similar.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: 'A state or uniqueness conflict. Body `{"error": "<text>"}`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotPostgres:
      description: The service runs against an in-memory database (`conveyor's queue needs Postgres; ...`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: 'A missing or invalid sealing key, or no Postgres. Body `{"error": "<text>"}`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Provider:
      type: string
      enum: [github, generic]
    Trigger:
      type: string
      enum: [push, pull_request, manual, schedule]
    Status:
      type: string
      enum: [queued, running, success, failed, cancelled, skipped]
    Project:
      type: object
      required: [id, name, parent_id, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        parent_id: {type: [string, 'null'], description: 'Null for a root node.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectView:
      allOf:
        - {$ref: '#/components/schemas/Project'}
        - type: object
          required: [path]
          properties:
            path: {type: string, description: "Names from the root, joined with `/`."}
    CreateProject:
      type: object
      required: [name]
      properties:
        name: {type: string}
        parent_id: {type: [string, 'null']}
    UpdateProject:
      type: object
      properties:
        name: {type: [string, 'null']}
        parent_id: {type: [string, 'null']}
        to_root: {type: boolean, default: false}
    Repo:
      type: object
      required: [id, provider, owner, name, clone_url, default_branch, registered_by, project_id, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        provider: {$ref: '#/components/schemas/Provider'}
        owner: {type: string}
        name: {type: string}
        clone_url: {type: string}
        default_branch: {type: string}
        registered_by: {type: string}
        project_id: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RegisterRepo:
      type: object
      required: [owner, name, clone_url, project_id]
      properties:
        provider: {type: [string, 'null'], enum: [github, generic, null]}
        owner: {type: string}
        name: {type: string}
        clone_url: {type: string}
        default_branch: {type: [string, 'null']}
        project_id: {type: string}
    UpdateRepo:
      type: object
      properties:
        owner: {type: [string, 'null']}
        name: {type: [string, 'null']}
        clone_url: {type: [string, 'null']}
        default_branch: {type: [string, 'null']}
        project_id: {type: [string, 'null']}
        enabled: {type: [boolean, 'null']}
    SetEnabled:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    TriggerRun:
      type: object
      properties:
        git_ref: {type: [string, 'null'], description: 'Full ref or a branch/tag ref; defaults to refs/heads/<default branch>.'}
        sha: {type: [string, 'null'], description: '7 to 64 hex digits.'}
        stages:
          type: [array, 'null']
          items: {type: string}
          description: At most 64 distinct names of at most 128 characters; blanks are dropped; an empty list is a 400.
    Run:
      type: object
      required: [id, repo_id, trigger, git_ref, sha, status, queued_at, attempt]
      properties:
        id: {type: string}
        repo_id: {type: string}
        trigger: {$ref: '#/components/schemas/Trigger'}
        git_ref: {type: string}
        sha: {type: string}
        message: {type: [string, 'null']}
        delivery_id: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/Status'}
        queued_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        claimed_by: {type: [string, 'null']}
        claimed_at: {type: [string, 'null'], format: date-time}
        attempt: {type: integer, format: int32}
        error: {type: [string, 'null']}
        resumed_from: {type: [string, 'null']}
        stages:
          type: [array, 'null']
          items: {type: string}
      example:
        id: 5b0f2f2a-3f9e-4c57-8f36-1a2d0e2a9d11
        repo_id: 2c4f7b14-0a8e-4e55-9b4f-6a3e1d9c0b22
        trigger: push
        git_ref: refs/heads/master
        sha: 0123456789abcdef0123456789abcdef01234567
        message: Fix the thing
        delivery_id: 8a1f0c4e-aaaa-bbbb-cccc-000000000001
        status: queued
        queued_at: "2026-10-30T10:15:00Z"
        started_at: null
        finished_at: null
        claimed_by: null
        claimed_at: null
        attempt: 0
        error: null
        resumed_from: null
        stages: null
    Job:
      type: object
      required: [id, run_id, stage, name, needs, status]
      properties:
        id: {type: string}
        run_id: {type: string}
        stage: {type: string}
        name: {type: string}
        needs:
          type: array
          items: {type: string}
          description: The stages this job's stage waited on.
        status: {$ref: '#/components/schemas/Status'}
        exit_code: {type: [integer, 'null'], format: int32}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        error: {type: [string, 'null']}
        reused_from_run: {type: [string, 'null']}
    Artifact:
      type: object
      required: [id, run_id, job_id, kind, name, uri, created_at]
      properties:
        id: {type: string}
        run_id: {type: string}
        job_id: {type: string}
        kind: {type: string, description: "`file` for everything conveyor records itself (the type also allows `crate`, `image`)."}
        name: {type: string}
        version: {type: [string, 'null']}
        uri: {type: string}
        digest: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    ArtifactView:
      allOf:
        - {$ref: '#/components/schemas/Artifact'}
        - type: object
          required: [href]
          properties:
            href: {type: string, description: "`uri` with the in-cluster warehouse address replaced by `WAREHOUSE_PUBLIC_URL` when that is set."}
    RunDetail:
      allOf:
        - {$ref: '#/components/schemas/Run'}
        - type: object
          required: [jobs, artifacts]
          properties:
            jobs:
              type: array
              items: {$ref: '#/components/schemas/Job'}
            artifacts:
              type: array
              items: {$ref: '#/components/schemas/ArtifactView'}
    RunsPage:
      type: object
      required: [runs, page, pages, total]
      properties:
        runs:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        page: {type: integer, format: int32}
        pages: {type: integer, format: int32, description: 'At least 1.'}
        total: {type: integer, format: int64}
    LogChunk:
      type: object
      required: [seq, stream, line, at]
      properties:
        seq: {type: integer, format: int64}
        stream: {type: string, enum: [stdout, stderr]}
        line: {type: string}
        at: {type: string, format: date-time}
    StoredSchedule:
      type: object
      required: [id, repo_id, expression, timezone, next_run_at]
      properties:
        id: {type: string}
        repo_id: {type: string}
        expression: {type: string}
        timezone: {type: string}
        next_run_at: {type: string, format: date-time}
        last_run_at: {type: [string, 'null'], format: date-time}
    KnownStage:
      type: object
      required: [name, on_by_default]
      properties:
        name: {type: string}
        on_by_default: {type: boolean}
    Access:
      type: object
      required: [username, read, write]
      properties:
        username: {type: string}
        read: {type: array, items: {type: string}}
        write: {type: array, items: {type: string}}
    CheckChip:
      type: object
      required: [kind, passed, findings]
      properties:
        kind: {type: string, enum: [lint, machete, audit, coverage, tests, security]}
        passed: {type: boolean}
        findings: {type: integer}
        metric: {type: [string, 'null']}
    RepoChecks:
      type: object
      required: [repo_id, checks]
      properties:
        repo_id: {type: string}
        checks: {type: array, items: {$ref: '#/components/schemas/CheckChip'}}
    Finding:
      type: object
      required: [title]
      properties:
        title: {type: string}
        id: {type: [string, 'null']}
        severity: {type: [string, 'null']}
        date: {type: [string, 'null']}
        location: {type: [string, 'null']}
        extra: {type: [string, 'null']}
    CheckDetail:
      type: object
      required: [kind, job_name, passed, headline, findings, has_report]
      properties:
        kind: {type: string, enum: [lint, machete, audit, coverage, tests, security]}
        job_name: {type: string, description: "`stage/job`."}
        passed: {type: boolean}
        headline: {type: string}
        findings: {type: array, items: {$ref: '#/components/schemas/Finding'}, description: 'At most 50.'}
        metric: {type: [string, 'null']}
        has_report: {type: boolean}
        origin: {oneOf: [{$ref: '#/components/schemas/Run'}, {type: 'null'}]}
    ScanReport:
      type: object
      required: [checks]
      properties:
        run: {oneOf: [{$ref: '#/components/schemas/Run'}, {type: 'null'}]}
        checks: {type: array, items: {$ref: '#/components/schemas/CheckDetail'}}
    ScanFinding:
      type: object
      required: [severity, check, service, method, path, detail]
      properties:
        severity: {type: string}
        check: {type: string}
        service: {type: string}
        method: {type: string}
        path: {type: string}
        detail: {type: string}
    ScanFindings:
      type: object
      required: [findings, run_id, created_at]
      properties:
        findings: {type: array, items: {$ref: '#/components/schemas/ScanFinding'}}
        run_id: {type: string}
        created_at: {type: string, format: date-time}
    Credential:
      type: object
      required: [id, name, kind, username, preview, created_by, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: [string, 'null']}
        repo_id: {type: [string, 'null']}
        name: {type: string}
        kind: {type: string, enum: [http_token]}
        username: {type: string}
        preview: {type: string, description: "`••••…` and the last four characters of the token."}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SetCredential:
      type: object
      required: [name, username, token]
      properties:
        name: {type: string, description: 'Letters, digits, underscores; not starting with a digit. A label, not an identity.'}
        kind: {type: string, default: http_token, enum: [http_token]}
        username: {type: string, description: 'No control characters.'}
        token: {type: string, description: 'At least 4 characters, no control characters.'}
    SecretRef:
      type: object
      required: [id, name, created_by, created_at, updated_at]
      properties:
        id: {type: string}
        repo_id: {type: [string, 'null']}
        name: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SetSecret:
      type: object
      required: [value]
      properties:
        value: {type: string}
    Subscription:
      type: object
      required: [id, created_at]
      properties:
        id: {type: string}
        repo_id: {type: [string, 'null']}
        project_id: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    SubscriptionState:
      type: object
      required: [subscribed]
      properties:
        subscribed: {type: boolean}
    GenericEvent:
      type: object
      required: [delivery_id, owner, name, ref, sha]
      properties:
        delivery_id: {type: string, description: 'Unique per delivery; a repeat is not queued twice.'}
        owner: {type: string}
        name: {type: string}
        ref: {type: string, description: 'Full ref, for example refs/heads/master.'}
        sha: {type: string}
        message: {type: [string, 'null']}
        event: {type: [string, 'null'], enum: [push, pull_request, null], description: 'Defaults to push.'}
    Ignored:
      type: object
      required: [ignored]
      properties:
        ignored: {type: string}
    AuthStatus:
      type: object
      required: [authenticated, username, roles]
      properties:
        authenticated: {type: boolean}
        username: {type: [string, 'null']}
        roles: {type: array, items: {type: string}}
