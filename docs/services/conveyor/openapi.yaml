  /api/v1/webhooks/{provider}:
    post:
      tags: [webhooks]
      operationId: receiveWebhook
      summary: Receive a provider delivery
      description: |
        The one unauthenticated endpoint (outside `Auth`). `provider` is `github` or `generic`. Order of checks: provider known,
        payload parsed, fields validated, repository registered, signature verified against the repository's `WEBHOOK_SECRET`
        secret (else `CONVEYOR_WEBHOOK_SECRET`; without either, 503), repository enabled, fork rule, tag rule, then the run is
        queued with the provider's delivery id (a redelivery is not queued again).
        GitHub: header `X-Hub-Signature-256: sha256=<hex>`, `X-GitHub-Event` (`push`, `pull_request`; others are ignored) and
        `X-GitHub-Delivery`. Generic: header `X-Conveyor-Signature-256: sha256=<hex>` and the JSON body of `GenericEvent`.
        The signature is HMAC-SHA256 of the raw body.
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string, enum: [github, generic]}}
        - {name: X-Hub-Signature-256, in: header, required: false, schema: {type: string}}
        - {name: X-GitHub-Event, in: header, required: false, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: false, schema: {type: string}}
        - {name: X-Conveyor-Signature-256, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/GenericEvent'}
                - {type: object, description: 'A GitHub `push` or `pull_request` event payload (only the fields conveyor reads are listed in the webhooks section of the API page).'}
      responses:
        '200':
          description: A redelivery; the run made for it the first time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '202':
          description: 'Either the newly queued run, or {"ignored": "<reason>"} for an event that is acknowledged and not built.'
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/Run'}
                  - {$ref: '#/components/schemas/Ignored'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: '`{"error": "bad signature"}`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503':
          description: 'No webhook secret is configured for the repository or the estate (`conveyor is not configured to accept webhooks for this repository`), or the database is not Postgres.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
