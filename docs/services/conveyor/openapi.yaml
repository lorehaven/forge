      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: category, in: path, required: true, schema: {type: string, enum: [tests, security]}}
        - {name: download, in: query, required: false, schema: {type: string}}
