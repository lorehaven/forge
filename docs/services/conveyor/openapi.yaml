openapi: 3.1.0
info:
  title: Conveyor service
  version: 0.7.3
  description: |
    The CI service of the estate: a registry of repositories organised in a project tree, a Postgres-backed run queue,
    workers that check out a commit and run the `.conveyor.toml` it carries, logs (stored and streamed over SSE),
    sealed secrets and git credentials, scheduled runs, scan summaries and run-result mail.
    Everything under `/api/v1` needs a verified identity except `/api/v1/webhooks/{provider}`, which is authenticated by
    an HMAC signature. Access is decided per project: `conveyor:<action>` is the blanket grant,
    `conveyor:project:<id>:<action>` a grant on one node of the tree and everything beneath it (actions: `read`, `write`).
    Error bodies are `{"error": "<text>"}`. Times are RFC 3339 strings.
servers:
  - url: "{base}"
    variables:
      base:
        default: /conveyor
        description: The service's BASE_PATH.
tags:
  - name: projects
    description: The organisational tree.
  - name: repos
    description: Registered repositories.
  - name: runs
    description: Triggering, reading, cancelling and restarting runs; schedules and stages.
  - name: logs
    description: Job logs, stored and streamed.
  - name: overview
    description: Reads that serve the front page, the history and the access of the caller.
  - name: scan
    description: Code-quality summaries and stored reports.
  - name: secrets
    description: Sealed values injected into jobs that name them (write-only).
  - name: credentials
    description: Sealed git credentials used by checkouts (write-only).
  - name: subscriptions
    description: Following the results of a repository or project.
  - name: webhooks
    description: Provider deliveries (signature-authenticated).
  - name: auth
    description: Sign-in forwarded to gatehouse.
  - name: ui
    description: The browser client's page routes and files.
paths:
  /api/v1/projects:
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project node
      description: |
        With `parent_id`, needs write on that parent (or the blanket write grant); without it (a root node) only the blanket
        `conveyor:write` is enough. The name is trimmed. Sibling names are unique (a root name is unique among roots).
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write (or conveyor:project:<parent_id>:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProject'}
            example: {name: lorehaven, parent_id: null}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/NotPostgres'}
    get:
      tags: [projects]
      operationId: listProjects
      summary: List project nodes
      description: |
        With `all=true`: every node, at any depth. Otherwise the children of `parent_id` (the roots when it is absent).
        No per-project permission is checked: any authenticated caller sees the names and structure of the tree.
      security: [{bearer: []}, {sessionCookie: []}]
      parameters:
        - {name: parent_id, in: query, required: false, schema: {type: string}}
        - {name: all, in: query, required: false, schema: {type: boolean}}
      responses:
        '200':
          description: The nodes.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Project'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/NotPostgres'}
  /api/v1/projects/{id}:
    get:
      tags: [projects]
      operationId: readProject
      summary: Read a project node
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read (or conveyor:project:<id>:read, or on an ancestor)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The node and its full path (`root/child/...`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Rename or move a project node
      description: |
        Rename happens first, then the move; they are separate statements, so a refused move leaves the rename applied.
        `to_root: true` moves to the root level and wins over `parent_id`. A move needs write on the destination as well.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the node (and on the destination parent)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProject'}
      responses:
        '200':
          description: The node after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete a project node
      description: Refused with 409 while the node has child nodes or an attached repository.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the node
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: 'Deleted.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/repos:
    post:
      tags: [repos]
      operationId: registerRepo
      summary: Register a repository
      description: |
        `provider` defaults to `github`. `owner`, `name`, `project_id` are required and trimmed; `clone_url` is checked
        (not empty, not starting with `-`, no control characters). `default_branch` defaults to `master`. The registering
        account (the token's `sub`, or `dev` with auth off) becomes `registered_by` and must exist in the realm's users.
        A second registration of the same `(provider, owner, name)` is a 409.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the target project
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRepo'}
            example: {owner: lorehaven, name: forge, clone_url: "https://github.com/lorehaven/forge.git", default_branch: master, project_id: "0d3c2f0e-3f0e-4d6e-9d84-0a5b1f8a77c1"}
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [repos]
      operationId: listRepos
      summary: List the repositories the caller may read
      description: |
        Filtered, not refused: with the blanket `conveyor:read` (or auth off) every repository; otherwise those under a
        project the caller holds `project:<id>:read` on, descendants included.
      security: [{bearer: []}, {sessionCookie: []}]
      responses:
        '200':
          description: The repositories.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Repo'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/repos/{id}:
    get:
      tags: [repos]
      operationId: readRepo
      summary: Read a repository
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The repository.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [repos]
      operationId: updateRepo
      summary: Partially update a repository
      description: Absent fields are left alone. `provider` cannot be changed. Moving to another project needs write there too.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the project (and on the destination project)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRepo'}
      responses:
        '200':
          description: The repository after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [repos]
      operationId: deleteRepo
      summary: Delete a repository
      description: Removes the repository and, through the foreign keys, its runs, jobs, logs, artifacts rows, secrets, credential, schedules and subscriptions.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: 'Deleted.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/repos/{id}/enabled:
    post:
      tags: [repos]
      operationId: setRepoEnabled
      summary: Enable or disable a repository
      description: A disabled repository keeps its history and stops accepting triggers (webhooks are acknowledged and ignored, manual runs are refused with 409, queued runs are not claimed).
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetEnabled'}
      responses:
        '200':
          description: The repository after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Repo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/repos/{repo_id}/runs:
    post:
      tags: [runs]
      operationId: triggerRun
      summary: Start a run by hand
      description: |
        The body is optional (an empty body means all defaults). Without `git_ref` the default branch is built
        (`refs/heads/<default_branch>`); without `sha`, the remote is asked (`git ls-remote`) what the ref points at, using the
        repository's git credential if there is one. The pipeline's `on` patterns do not gate a manual run. With `stages`, only
        those stages run, each whatever its own `when` says. The delivery id is empty, so asking for the same commit twice is
        allowed.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the repository's project
      parameters:
        - {name: repo_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TriggerRun'}
            example: {git_ref: refs/heads/master, stages: [security]}
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502':
          description: The remote could not be asked what the ref points at.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/repos/{repo_id}/schedules:
    get:
      tags: [runs]
      operationId: listSchedules
      summary: A repository's schedules
      description: Read-only. Rows exist once a run of the default branch has read a pipeline that declares `on.schedule`. Ordered by `next_run_at`, then expression.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: repo_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The schedules.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/StoredSchedule'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/repos/{repo_id}/stages:
    get:
      tags: [runs]
      operationId: listStages
      summary: The stages of a repository's pipeline, as its recent runs recorded them
      description: |
        Looks through the newest 30 runs that were not limited to some stages. Empty until the repository has run.
        `on_by_default` is false for a stage the newest ordinary (non-schedule) run left out by its own `when`.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: repo_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The stages, in an order that respects `needs`.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/KnownStage'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List runs, newest first
      description: |
        With `repo_id`: that repository's runs (403/404 as for the repository). Without: every run the caller may read
        (filtered, not refused). `limit` defaults to 50 and is clamped to 1..500.
      security: [{bearer: []}, {sessionCookie: []}]
      parameters:
        - {name: repo_id, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: The runs.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Run'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs/{id}:
    get:
      tags: [runs]
      operationId: readRun
      summary: A run with its jobs and artifacts
      description: A run whose repository has since been deleted answers 403, not 404.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The run (fields at the top level) plus `jobs` and `artifacts`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/runs/{id}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Ask a run to stop
      description: |
        A queued run becomes `cancelled` at once. A running run is flagged (`cancel_requested`); the worker holding it notices
        within about two seconds, stops the executor's job and finishes the run `cancelled`. Accepted, not complete.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '202': {description: 'Accepted, no body.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/runs/{id}/restart:
    post:
      tags: [runs]
      operationId: restartRun
      summary: Restart a failed or cancelled run
      description: |
        Queues a new run of the same trigger, ref, sha, message and stage selection, with `resumed_from` set to this run.
        Stages that fully passed last time are carried over instead of rerun.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:write on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '202':
          description: The new run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/jobs/{id}/logs:
    get:
      tags: [logs]
      operationId: readJobLogs
      summary: A job's stored log
      description: Only what was persisted when the job finished. Live output is `/api/v1/jobs/{id}/stream`.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The lines, in order.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LogChunk'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/jobs/{id}/stream:
    get:
      tags: [logs]
      operationId: streamJobLog
      summary: A job's log as server-sent events
      description: |
        If the executor still knows the job (it is running), the history so far and then the live lines; otherwise the stored
        log. Either way the stream ends with `event: done`. Frames are `id: <seq>`, `event: stdout|stderr`, `data: <line>`; a
        subscriber that fell behind gets `event: lagged`. See the events page.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - name: format
          in: query
          required: false
          description: "`text` (default): the line as written. `html`: an escaped `<span class=\"log-line[ log-stderr]\">`."
          schema: {type: string, enum: [text, html]}
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema: {type: string}
              example: "id: 7\nevent: stdout\ndata: compiling thing\n\nevent: done\ndata: end of log\n\n"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/jobs/{id}/raw:
    get:
      tags: [logs]
      operationId: rawJobLog
      summary: A job's log as plain text
      description: One line per log line, no framing. A running job's output keeps streaming until it ends.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The log.
          content:
            text/plain:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/access:
    get:
      tags: [overview]
      operationId: access
      summary: What the caller may read and write
      description: Ids of the projects the caller may read and write (descendants of a granted node included). With the blanket grant, or with auth off, every project.
      security: [{bearer: []}, {sessionCookie: []}]
      responses:
        '200':
          description: Access.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Access'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/overview/runs:
    get:
      tags: [overview]
      operationId: overviewRuns
      summary: The front page's runs
      description: |
        The newest 200 runs in scope, reduced to at most `CONVEYOR_HOME_MAX_RUNS_PER_REPO` per repository and
        `CONVEYOR_HOME_RECENT_RUNS` in total (defaults 1 and 5). `project` limits the scope to a node and everything under it.
      security: [{bearer: []}, {sessionCookie: []}]
      parameters:
        - {name: project, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: The runs, newest first.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Run'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/overview/history:
    get:
      tags: [overview]
      operationId: overviewHistory
      summary: One page of the run history
      description: Page size is `CONVEYOR_RUNS_PAGE_SIZE` (default 25). `page` starts at 1; a value below 1 is 1.
      security: [{bearer: []}, {sessionCookie: []}]
      parameters:
        - {name: project, in: query, required: false, schema: {type: string}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunsPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/scan:
    get:
      tags: [scan]
      operationId: scanChips
      summary: The check chips of every readable repository
      security: [{bearer: []}, {sessionCookie: []}]
      responses:
        '200':
          description: One entry per readable repository.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RepoChecks'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/repos/{id}/scan:
    get:
      tags: [scan]
      operationId: repoScan
      summary: A repository's code-quality summary
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The newest run and the checks (lint, machete, audit, coverage, tests, security) that exist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScanReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/repos/{id}/scan/findings:
    get:
      tags: [scan]
      operationId: scanFindings
      summary: Every finding of the newest security scan
      description: From the `security-findings.json` artifact of the newest run that kept one, most severe first. 404 `no scanner findings` when there is none.
      security: [{bearer: []}, {sessionCookie: []}]
      x-permission: conveyor:read on the repository's project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The findings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScanFindings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/repos/{id}/scan/{category}/report:
    get:
      tags: [scan]
      operationId: scanReport
      summary: The stored report page of a check
      description: |
        Only `tests` and `security` keep one (`index.html` and `security.html`). Served by conveyor with
        `content-security-policy: sandbox allow-scripts`, `x-content-type-options: nosniff` and `cache-control: private, max-age=60`
