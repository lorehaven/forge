        must contain `repository:<name>:pull` (GET/HEAD) or `:push` (POST/PATCH/PUT/DELETE) for the repository
        in the path (`*` as repository or action matches all). `/v2/` and `/v2/_catalog` are not scope-checked.
        Appends the body (streamed) to the upload; the total is capped by `MAX_DOCKER_BLOB_BYTES`.'
