  /ui/login:
    get:
      tags:
      - ui
      summary: Hand the browser to Gatehouse
      description: A still-good refresh cookie is renewed in place (302 to `<base>/ui/home`, new cookies).
        Otherwise a 302 to Gatehouse's `/api/v1/authorize` (PKCE S256, `client_id` = `GATEHOUSE_CLIENT_ID`,
        `redirect_uri` = this service's `/ui/auth/callback`) with the state cookie `forge_authorize_state`.
        `503 gatehouse is not configured` (text) when `GATEHOUSE_URL`, `GATEHOUSE_CLIENT_ID` or `GATEHOUSE_CLIENT_SECRET`
        is missing.
      security: []
      responses:
        '302':
          description: To Gatehouse, or home after a silent renewal.
        '503':
          description: Gatehouse not configured.
  /ui/login/:
    get:
      tags:
      - ui
      summary: Hand the browser to Gatehouse (trailing slash)
      description: Same as `/ui/login`.
      security: []
      responses:
        '302':
          description: To Gatehouse.
        '503':
          description: Gatehouse not configured.
  /ui/auth/callback:
    get:
      tags:
      - ui
      summary: Authorization-code callback
      description: Receives `code` and `state` from Gatehouse, checks the state against the `forge_authorize_state`
        cookie, exchanges the code at Gatehouse's `/api/v1/token` (`GATEHOUSE_CLIENT_ID`, `GATEHOUSE_CLIENT_SECRET`,
        the PKCE verifier from the cookie) and sets the session and refresh cookies. Any failure (missing
        or corrupt state, state mismatch, no code, unreachable or refusing Gatehouse) is a 302 to `<base>/ui/login`
        with the state cookie cleared.
      security: []
      parameters:
      - name: code
        in: query
        required: false
        description: From Gatehouse.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: Must match the state cookie.
        schema:
          type: string
      responses:
        '302':
          description: 'Success: to the saved destination (`<base>/ui/home`) with cookies set. Failure:
            to `<base>/ui/login`.'
        '503':
          description: '`GATEHOUSE_URL` not set.'
  /ui/logout:
    get:
      tags:
      - ui
      summary: Sign out
      description: Delegates to Gatehouse's logout.
      security: []
      responses:
        '302':
          description: To Gatehouse.
