  /api/v1/artifacts/{program}/{platform}/{version_code}:
    put:
      tags:
      - artifacts
      summary: Publish a build
      description: 'Auth: `Auth` + `RequireWrite`: any valid realm identity reads, `warehouse:write` is
        needed for PUT/DELETE. Answers 404 `artifact storage is not enabled` unless `FEATURE_ARTIFACTS_ENABLED`
        (or `FEATURE_APK_ENABLED`). The raw body is streamed to a staging file (limited to `MAX_FILE_BYTES`,
        default 1 GiB), SHA-256 computed, identity checked, and moved to `<ARTIFACT_STORAGE_PATH>/<program>/<platform>/<version_code>/<filename>`.
        Android: package name and `versionCode` are read from the APK''s `AndroidManifest.xml` and must
        match the path (422); `format` is `apk`. Other platforms: `?format=` is required.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      parameters:
      - name: program
        in: path
        required: true
        description: 'Reverse-DNS id: dot-separated segments of `[A-Za-z_][A-Za-z0-9_]*`, at most 255
          characters.'
        schema:
          type: string
        example: dev.lorehaven.pedlar
      - name: platform
        in: path
        required: true
        description: '`android`, `linux`, `windows` or `macos`.'
        schema:
          type: string
        example: linux
      - name: version_code
        in: path
        required: true
        description: Integer build number, or `latest` on the metadata and download routes.
        schema:
          type: string
        example: '42'
      - name: format
        in: query
        required: false
        description: 'Required off Android: a token of letters, digits, `.`, `-`, `_` (lower-cased).'
        schema:
          type: string
      - name: arch
        in: query
        required: false
        description: Optional; ignored for Android.
        schema:
          type: string
      - name: version_name
        in: query
        required: false
        description: Optional; default the version code.
        schema:
          type: string
      - name: label
        in: query
        required: false
        description: Optional.
        schema:
          type: string
      - name: filename
        in: query
        required: false
        description: 'Optional served name: one path component; default `<program>-<version_code>.<format>`.'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactView'
        '400':
          description: Interrupted upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: the upload was interrupted
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '403':
          description: '`RequireWrite`: the token lacks the blanket `warehouse:write` action (empty body).'
        '409':
          description: The same program/platform/format/version already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: this version has already been published
        '413':
          description: Over `MAX_FILE_BYTES` (default 1 GiB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: artifact exceeds the 1073741824-byte limit
        '422':
          description: Unknown platform, bad program/format/filename, bad or mismatching APK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: format is required for non-android artifacts
        '500':
          description: Storage failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: could not store the file
    get:
