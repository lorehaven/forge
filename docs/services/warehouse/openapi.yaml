# OpenAPI 3.1 description of the service's HTTP routes, hand-checked against the source.
openapi: 3.1.0
info:
  title: Warehouse
  version: 0.8.2
  description: 'Warehouse is the Forge estate''s storage service: a Cargo registry, a Docker Registry
    v2, named file storages, a multi-platform artifact registry and a rivet package registry. Version
    is that of `warehouse-service`.'
servers:
- url: '{base}'
  description: Mounted under BASE_PATH.
  variables:
    base:
      default: /warehouse
      description: 'The `BASE_PATH` the service is mounted under (`/` when unset; deployments use `/warehouse`).
        The Docker routes ignore it: they are at the server root.'
tags:
- name: crates
  description: 'Cargo registry: publish, download, yank, owners, search (JSON API under `/api/v1/crates`).'
- name: crates-index
  description: Cargo sparse index served at `/index`.
- name: docker
  description: Docker Registry HTTP API v2 and its token endpoint. Served at the **server root** (`/v2`,
    `/token`), outside `BASE_PATH`.
- name: files
  description: 'Named file storages: static (operator-configured directories) and dynamic (database-backed,
    owned, quota-limited).'
- name: artifacts
  description: Multi-platform artifact registry addressed by `{program}/{platform}/{version_code}`.
- name: apk
  description: Deprecated `android`-only alias of the artifact API.
- name: rivets
  description: '`.rivet` package registry (whole Riveter overlays, versioned).'
- name: admin
  description: Garbage collection of the crates and Docker storages.
- name: ui-api
  description: JSON the browser client reads and writes (`/ui/api/...`), behind the realm session cookie.
- name: ui
  description: Pages, redirects, sign-in handover and the client's static files (`/ui/...`).
paths:
  /api/v1/crates/new:
    put:
      tags:
      - crates
      summary: Publish a crate
      description: 'Cargo''s publish wire format: `u32 LE json length`, the metadata JSON (`name`, `vers`,
        `deps[]`, `features`, optional `features2`, `links`, `rust_version`), `u32 LE tarball length`,
        the `.crate` tarball. Streams the tarball to `<CRATES_STORAGE_PATH>/<name>/<version>/<name>-<version>.crate`,
        computes SHA-256 and appends one JSON line to the sparse index file. The handler itself requires
        an `Authorization` header (401 without one) besides the middleware.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CratePublishResponse'
              example:
                warnings:
                  invalid_categories: []
                  invalid_badges: []
                  other: []
        '400':
          description: Short or truncated payload, bad metadata JSON, interrupted body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: payload too short
        '401':
          description: No Authorization header (or middleware refusal).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: missing authorization token
        '403':
          description: '`RequireWrite`: the token lacks the blanket `warehouse:write` action (empty body).'
        '409':
          description: Version already published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: this version has already been published
        '422':
          description: Invalid crate name or version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: invalid crate name
        '500':
          description: Storage failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: failed to write crate chunk
  /api/v1/crates/{name}/{version}/download:
    get:
      tags:
      - crates
      summary: Download a `.crate`
      description: 'Auth: writes need `warehouse:write` (Auth + RequireWrite); reads need nothing unless
        `CRATES_REQUIRE_AUTH_FOR_READS=true`, then any valid realm identity.'
      security: []
      parameters:
      - name: name
        in: path
        required: true
        description: 'Crate name: 1 to 64 of ASCII letters, digits, `-`, `_`.'
        schema:
          type: string
        example: serde
      - name: version
        in: path
        required: true
        description: 'Version string: 1 to 64 of letters, digits, `.`, `-`, `+`.'
        schema:
          type: string
        example: 1.0.0
      responses:
        '200':
          description: 'The tarball (`application/octet-stream`, `Content-Disposition: attachment; filename="name-version.crate"`).'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown crate or version, or invalid name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: crate or version not found
  /api/v1/crates/{name}/{version}/yank:
    delete:
      tags:
      - crates
      summary: Yank a version
      description: 'Sets `yanked: true` in the index line; the tarball stays.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      parameters:
      - name: name
        in: path
        required: true
        description: 'Crate name: 1 to 64 of ASCII letters, digits, `-`, `_`.'
        schema:
          type: string
        example: serde
      - name: version
        in: path
        required: true
        description: 'Version string: 1 to 64 of letters, digits, `.`, `-`, `+`.'
        schema:
          type: string
        example: 1.0.0
      responses:
        '200':
          description: Yanked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
              example:
                ok: true
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '403':
          description: '`RequireWrite`: the token lacks the blanket `warehouse:write` action (empty body).'
        '404':
          description: No such crate/version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: crate or version not found
        '500':
          description: Index write failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: 'failed to write index file: ...'
  /api/v1/crates/{name}/{version}/unyank:
    put:
      tags:
      - crates
      summary: Unyank a version
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      parameters:
      - name: name
        in: path
        required: true
        description: 'Crate name: 1 to 64 of ASCII letters, digits, `-`, `_`.'
        schema:
          type: string
        example: serde
      - name: version
        in: path
        required: true
        description: 'Version string: 1 to 64 of letters, digits, `.`, `-`, `+`.'
        schema:
          type: string
        example: 1.0.0
      responses:
        '200':
          description: Unyanked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
              example:
                ok: true
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '403':
          description: '`RequireWrite`: the token lacks the blanket `warehouse:write` action (empty body).'
        '404':
          description: No such crate/version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: crate or version not found
        '500':
          description: Index write failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: 'failed to write index file: ...'
  /api/v1/crates/{name}/owners:
    get:
      tags:
      - crates
      summary: List owners
      description: 'Auth: writes need `warehouse:write` (Auth + RequireWrite); reads need nothing unless
        `CRATES_REQUIRE_AUTH_FOR_READS=true`, then any valid realm identity. Names are lower-cased.'
      security: []
      parameters:
      - name: name
        in: path
        required: true
        description: 'Crate name: 1 to 64 of ASCII letters, digits, `-`, `_`.'
        schema:
          type: string
        example: serde
      responses:
        '200':
          description: Owners from `<name>/owners.json` (empty when none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrateOwners'
              example:
                users:
                - id: 1
                  login: alice
        '404':
          description: Crate not published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: crate not found
    put:
      tags:
      - crates
      summary: Add owners
      description: 'Adds logins (blank and case-insensitive duplicates skipped); ids are assigned in sequence.
        Owners are informational: no route checks them.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      parameters:
      - name: name
        in: path
        required: true
        description: 'Crate name: 1 to 64 of ASCII letters, digits, `-`, `_`.'
        schema:
          type: string
        example: serde
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrateOwnersRequest'
            example:
              users:
              - alice
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
              example:
                ok: true
        '400':
          description: Empty `users`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: users list must not be empty
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '403':
          description: '`RequireWrite`: the token lacks the blanket `warehouse:write` action (empty body).'
        '404':
          description: Crate not published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: crate not found
        '500':
          description: Not saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: 'failed to save owners: ...'
    delete:
      tags:
      - crates
      summary: Remove owners
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      parameters:
      - name: name
        in: path
        required: true
        description: 'Crate name: 1 to 64 of ASCII letters, digits, `-`, `_`.'
        schema:
          type: string
        example: serde
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrateOwnersRequest'
            example:
              users:
              - alice
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
              example:
                ok: true
        '400':
          description: Empty `users`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: users list must not be empty
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '403':
          description: '`RequireWrite`: the token lacks the blanket `warehouse:write` action (empty body).'
        '404':
          description: Crate not published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: crate not found
        '500':
          description: Not saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: 'failed to save owners: ...'
  /api/v1/crates:
    get:
      tags:
      - crates
      summary: Search crates
      description: 'Auth: writes need `warehouse:write` (Auth + RequireWrite); reads need nothing unless
        `CRATES_REQUIRE_AUTH_FOR_READS=true`, then any valid realm identity. Substring match on directory
        names (lower-cased); `description` is always null.'
      security: []
      parameters:
      - name: q
        in: query
        required: true
        description: Search text; blank gives 400.
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        description: Clamped to 1..100.
        schema:
          type: integer
          default: 10
      - name: page
        in: query
        required: false
        description: From 1.
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: A page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrateSearchResponse'
              example:
                crates:
                - name: serde
                  max_version: 1.0.0
                  description: null
                meta:
                  total: 1
        '400':
          description: Blank query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoErrors'
              example:
                errors:
                - detail: search query must not be empty
  /index/{path}:
    get:
      tags:
      - crates-index
      summary: Sparse index
      description: 'Auth: writes need `warehouse:write` (Auth + RequireWrite); reads need nothing unless
        `CRATES_REQUIRE_AUTH_FOR_READS=true`, then any valid realm identity. `config.json` returns the
        registry configuration; any other path is `<prefix>/<name>` per the crates.io layout (`1/a`, `2/ab`,
        `3/a/abc`, `ab/cd/abcd...`); the body is the crate''s index file, one JSON line per version. `ETag`
        is `sha256:<hex>` of the body; a matching `If-None-Match` gets 304.'
      security: []
      parameters:
      - name: path
        in: path
        required: true
        description: '`config.json`, or `<prefix>/<crate name>`; the route pattern is `{path:.*}`.'
        schema:
          type: string
        example: se/rd/serde
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: '`config.json` as `application/json`, or the index file as `text/plain; charset=utf-8`
            with `ETag` and `Cache-Control: no-cache`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CratesIndexConfig'
              example:
                dl: https://ennor.ddns.net/warehouse/api/v1/crates/{crate}/{version}/download
                api: https://ennor.ddns.net/warehouse
            text/plain:
              schema:
                type: string
        '304':
          description: Not modified.
        '404':
          description: Unknown path, wrong prefix, or no index file (empty body).
  /v2/:
    get:
      tags:
      - docker
      summary: Registry check
      description: 'Unless `SERVICE_AUTH_ENABLED` is false, a request without a valid token gets 401 with
        `WWW-Authenticate: Bearer realm="<SERVICE_REALM>",service="<SERVICE_NAME>"`; the token''s `scope`
        must contain `repository:<name>:pull` (GET/HEAD) or `:push` (POST/PATCH/PUT/DELETE) for the repository
        in the path (`*` as repository or action matches all). `/v2/` and `/v2/_catalog` are not scope-checked.'
      security:
      - dockerBearer: []
      responses:
        '200':
          description: 'Reachable. Header `Docker-Distribution-API-Version: registry/2.0`.'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: UNAUTHORIZED
                  message: authentication required
                  detail: {}
        '429':
          description: Too many failed authentications from this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: DENIED
                  message: too many authentication attempts
                  detail: {}
    head:
      tags:
      - docker
      summary: Registry check (HEAD)
      description: Same as `GET /v2/`.
      security:
      - dockerBearer: []
      responses:
        '200':
          description: Reachable.
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: UNAUTHORIZED
                  message: authentication required
                  detail: {}
  /v2/_catalog:
    get:
      tags:
      - docker
      summary: List repositories
      description: 'Unless `SERVICE_AUTH_ENABLED` is false, a request without a valid token gets 401 with
        `WWW-Authenticate: Bearer realm="<SERVICE_REALM>",service="<SERVICE_NAME>"`; the token''s `scope`
        must contain `repository:<name>:pull` (GET/HEAD) or `:push` (POST/PATCH/PUT/DELETE) for the repository
        in the path (`*` as repository or action matches all). `/v2/` and `/v2/_catalog` are not scope-checked.'
      security:
      - dockerBearer: []
      parameters:
      - name: n
        in: query
        required: false
        description: Page size, default 100.
        schema:
          type: integer
      - name: last
        in: query
        required: false
        description: Previous page's last repository.
        schema:
          type: string
      responses:
        '200':
          description: 'A page; when full, `Link: </v2/_catalog?n=N&last=X>; rel="next"`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerCatalog'
              example:
                repositories:
                - forge/ci/rust-builder
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: UNAUTHORIZED
                  message: authentication required
                  detail: {}
  /v2/{name}/tags/list:
    get:
      tags:
      - docker
      summary: List tags
      description: 'Unless `SERVICE_AUTH_ENABLED` is false, a request without a valid token gets 401 with
        `WWW-Authenticate: Bearer realm="<SERVICE_REALM>",service="<SERVICE_NAME>"`; the token''s `scope`
        must contain `repository:<name>:pull` (GET/HEAD) or `:push` (POST/PATCH/PUT/DELETE) for the repository
        in the path (`*` as repository or action matches all). `/v2/` and `/v2/_catalog` are not scope-checked.'
      security:
      - dockerBearer: []
      parameters:
      - name: name
        in: path
        required: true
        description: Repository name; may contain `/`. The route pattern is `{name:.+}` (`{name:.*}` for
          the upload start). Must not contain `\`, `.`/`..` components or be rooted.
        schema:
          type: string
        example: forge/ci/rust-builder
      - name: n
        in: query
        required: false
        description: Page size, default 100.
        schema:
          type: integer
      - name: last
        in: query
        required: false
        description: Previous page's last tag.
        schema:
          type: string
      responses:
        '200':
          description: A page (`Link` rel=next when full).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerTagList'
              example:
                name: forge/x
                tags:
                - latest
        '400':
          description: Invalid repository name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: NAME_UNKNOWN
                  message: invalid repository name
                  detail: {}
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: UNAUTHORIZED
                  message: authentication required
                  detail: {}
        '404':
          description: No such repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: NAME_UNKNOWN
                  message: repository name not known to registry
                  detail: {}
  /v2/{name}/blobs/uploads/:
    post:
      tags:
      - docker
      summary: Start a blob upload
      description: 'Unless `SERVICE_AUTH_ENABLED` is false, a request without a valid token gets 401 with
        `WWW-Authenticate: Bearer realm="<SERVICE_REALM>",service="<SERVICE_NAME>"`; the token''s `scope`
        must contain `repository:<name>:pull` (GET/HEAD) or `:push` (POST/PATCH/PUT/DELETE) for the repository
        in the path (`*` as repository or action matches all). `/v2/` and `/v2/_catalog` are not scope-checked.
        With `mount` (a digest) and `from` both present and the blob already stored, answers 201 without
        an upload (blobs are global, not per repository).'
      security:
      - dockerBearer: []
      parameters:
      - name: name
        in: path
        required: true
        description: Repository name; may contain `/`. The route pattern is `{name:.+}` (`{name:.*}` for
          the upload start). Must not contain `\`, `.`/`..` components or be rooted.
        schema:
          type: string
        example: forge/ci/rust-builder
      - name: mount
        in: query
        required: false
        description: Digest to mount.
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Source repository (only its presence is checked).
        schema:
          type: string
      responses:
        '202':
          description: 'Upload started. Headers `Location: /v2/<name>/blobs/uploads/<uuid>`, `Docker-Upload-UUID`,
            `Range: 0-0`.'
        '201':
          description: Mounted. Headers `Location`, `Docker-Content-Digest`.
        '400':
          description: Invalid name or digest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: NAME_UNKNOWN
                  message: invalid repository name
                  detail: {}
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: UNAUTHORIZED
                  message: authentication required
                  detail: {}
        '429':
          description: More than `MAX_CONCURRENT_UPLOADS` upload requests in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: DENIED
                  message: too many concurrent upload requests
                  detail: {}
        '500':
          description: Could not create the upload file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: UNSUPPORTED
                  message: internal server error
                  detail: {}
  /v2/{name}/blobs/uploads/{uuid}:
    get:
      tags:
      - docker
      summary: Upload status
      description: 'Unless `SERVICE_AUTH_ENABLED` is false, a request without a valid token gets 401 with
        `WWW-Authenticate: Bearer realm="<SERVICE_REALM>",service="<SERVICE_NAME>"`; the token''s `scope`
        must contain `repository:<name>:pull` (GET/HEAD) or `:push` (POST/PATCH/PUT/DELETE) for the repository
        in the path (`*` as repository or action matches all). `/v2/` and `/v2/_catalog` are not scope-checked.'
      security:
      - dockerBearer: []
      parameters:
      - name: name
        in: path
        required: true
        description: Repository name; may contain `/`. The route pattern is `{name:.+}` (`{name:.*}` for
          the upload start). Must not contain `\`, `.`/`..` components or be rooted.
        schema:
          type: string
        example: forge/ci/rust-builder
      - name: uuid
        in: path
        required: true
        description: Upload id from the start response.
        schema:
          type: string
        example: 5d6f1d6e-0000-4000-8000-000000000000
      responses:
        '204':
          description: 'Headers `Location`, `Docker-Upload-UUID`, `Range: 0-<size-1>` (`0-0` when empty),
            `Content-Length: 0`.'
        '400':
          description: Invalid name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
                - code: NAME_UNKNOWN
                  message: invalid repository name
                  detail: {}
        '404':
          description: No such upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerErrors'
              example:
                errors:
