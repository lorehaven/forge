  /api/v1/rivets/{name}/{version}:
    put:
      tags:
      - rivets
      summary: Publish a package
      description: 'Auth: `Auth` + `RequireWrite`: any valid realm identity reads, `warehouse:write` publishes
        or yanks. Answers 404 `rivet storage is not enabled` unless `FEATURE_RIVETS_ENABLED` (read on
        every call). The body (the `.rivet`, `tar.zst`) is streamed to a staging file, limited to `RIVET_MAX_BYTES`
        (default 64 MiB), then fully validated with `rivet_package::Package::read` (default limits); its
        `rivet.toml` name and version must equal the path. The file is hard-linked into place (no clobbering)
        and the row inserted.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      parameters:
      - name: name
        in: path
        required: true
        description: 'Package name: a DNS-1123 label.'
        schema:
          type: string
        example: forge
      - name: version
        in: path
        required: true
        description: Semver, optionally with build metadata.
        schema:
          type: string
        example: 0.4.0
      requestBody:
        required: true
        content:
          application/zstd:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RivetView'
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '403':
          description: '`RequireWrite`: the token lacks the blanket `warehouse:write` action (empty body).'
        '404':
          description: Rivets disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: rivet storage is not enabled
        '409':
          description: Exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: this package version has already been published
        '413':
          description: Over `RIVET_MAX_BYTES`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: package exceeds the 67108864-byte limit
        '422':
          description: Invalid name/version, invalid archive, or manifest mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: the archive declares `a` version 1.0.0, which does not match the published path
                  `b/1.0.0`
        '500':
          description: Storage failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: could not store the package
