        the per-storage check below. **Static** storage: read open to that identity, write needs `warehouse:write`.
        **Dynamic** storage: owner, wildcard role, or `warehouse:storage:<name>:<action>`; the blanket
        `warehouse:read`/`write` does not apply. Everything answers 404 `file storage is not enabled`
        unless `FEATURE_FILES_ENABLED`. Static: a shallow directory walk of `prefix`; dynamic: flat prefix
        match on stored paths. Page size `n` default 500, max 2000; `Link: <...>; rel="next"` when more
        follow.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - name: storage
        in: path
        required: true
        description: 'Storage name: letters, digits, `-`, `_`.'
        schema:
          type: string
        example: media
      - name: prefix
        in: query
        required: false
        description: Subtree (default root).
        schema:
          type: string
      - name: n
        in: query
        required: false
        description: Page size (1..2000, default 500).
        schema:
          type: integer
      - name: last
        in: query
        required: false
        description: Previous page's last item (exclusive); a stale cursor restarts.
        schema:
          type: string
      - name: desc
        in: query
        required: false
        description: Newest/last first.
        schema:
          type: boolean
          default: false
