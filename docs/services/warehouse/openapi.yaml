  /admin/crates/gc:
    post:
      tags:
      - admin
      summary: Garbage-collect the crates storage
      description: Deletes tarballs of yanked versions (so a later unyank cannot restore them) and of
        versions missing from the index, repairs index entries that point at missing tarballs, removes
        orphan `owners.json` and empty directories. `Auth` + `RequireWrite`.
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      responses:
        '200':
          description: What was done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GcCratesReport'
              example:
                deleted_crates: 2
                kept_crates: 10
                removed_index_entries: 1
                deleted_owner_files: 0
                removed_empty_dirs: 3
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '403':
          description: '`RequireWrite`: the token lacks the blanket `warehouse:write` action (empty body).'
        '500':
          description: GC failed (empty body).
