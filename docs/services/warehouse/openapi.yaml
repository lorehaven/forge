  /token:
    get:
      tags:
      - docker
      summary: Issue a registry token
      description: 'Basic-auth with realm credentials (or anonymous when `SERVICE_AUTH_ENABLED` is false).
        `service` must equal `SERVICE_NAME`. The token (10 minutes) carries `scope` exactly as requested
        (default `docker`): **the requested scope is not checked against the user''s grants** (see the
        report).'
      security:
      - dockerBasic: []
      parameters:
      - name: service
        in: query
        required: true
        description: Must equal this service's name.
        schema:
          type: string
      - name: scope
        in: query
        required: false
        description: '`repository:<name>:pull,push`, space separated for several.'
        schema:
          type: string
      - name: account
        in: query
        required: false
        description: Ignored.
        schema:
          type: string
      - name: client_id
        in: query
        required: false
        description: Ignored.
        schema:
          type: string
      - name: offline_token
        in: query
        required: false
        description: Ignored.
        schema:
          type: boolean
      responses:
        '200':
          description: Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerToken'
              example:
                token: eyJ...
                expires_in: 600
                issued_at: '2026-10-30T08:00:00Z'
        '400':
          description: '`service` mismatch (empty body).'
        '401':
          description: 'Bad or missing credentials; `WWW-Authenticate: Basic realm="registry"`.'
  /api/v1/files:
    get:
      tags:
      - files
      summary: List storages
      description: 'Auth: `Auth` middleware (any valid realm identity with audience `warehouse`) plus
        the per-storage check below. **Static** storage: read open to that identity, write needs `warehouse:write`.
        **Dynamic** storage: owner, wildcard role, or `warehouse:storage:<name>:<action>`; the blanket
        `warehouse:read`/`write` does not apply. Everything answers 404 `file storage is not enabled`
        unless `FEATURE_FILES_ENABLED`.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Static storages by name; dynamic ones with owner, quota, usage, sync flag, filtered
            to those the caller may read.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageSummary'
              example:
              - name: media
              - name: phone
                owner: alice
                quota_bytes: 10737418240
                used_bytes: 1024
                sync_enabled: true
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '404':
          description: Files are not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: file storage is not enabled
    post:
      tags:
      - files
      summary: Provision a dynamic storage
      description: Needs the blanket `warehouse:write` (checked in the handler, not by `RequireWrite`).
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: warehouse:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStorage'
            example:
              name: phone
              owner: alice
              quota_bytes: 10737418240
              sync_enabled: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicStorage'
        '400':
          description: Invalid name or unknown owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: no such user to own this storage
        '401':
          description: Missing/invalid token or no session (empty body or the framework's text).
        '403':
          description: Lacks write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: write access to warehouse is required to provision a storage
        '404':
          description: Files are not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: file storage is not enabled
        '409':
          description: Name taken by a static or dynamic storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: a storage with that name already exists
        '500':
          description: Not created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: could not create the storage
  /api/v1/files/{storage}:
