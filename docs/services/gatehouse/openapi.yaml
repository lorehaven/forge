                $ref: '#/components/schemas/UnsubscribeInfo'
        '404':
          description: Unknown token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_not_found
  /ui:
    get:
      tags:
      - ui
      summary: Entry point
      description: Redirects to `/ui/home` when signed in, otherwise to the login page.
      security: []
      responses:
        '302':
          description: To `/ui/home` or `/ui/login`.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/:
    get:
      tags:
      - ui
      summary: Entry point (trailing slash)
      description: Same as `/ui`.
      security: []
      responses:
        '302':
          description: To `/ui/home` or `/ui/login`.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/login:
    get:
      tags:
      - ui
      summary: Sign-in page
      description: If a refresh cookie is still good the session is renewed and the browser is sent on
        (302, new cookies) to `?redirect=` or `/ui/home`; otherwise the client page.
      security: []
      parameters:
      - name: redirect
        in: query
        required: false
        description: 'Where to go after signing in: a rooted same-origin path, or a URL under a prefix
          of `AUTH_REDIRECT_HOSTS`. Invalid values are ignored.'
        schema:
          type: string
      - name: err
        in: query
        required: false
        description: 'A notice code shown on the page: `1` (wrong credentials) or a translation key from
          the fixed list (`ui_login_verify_invalid`, `ui_login_reset_invalid`, `ui_login_account_disabled`,
          `ui_login_account_locked`, `ui_login_email_unverified`, `ui_login_rate_limited`, `ui_login_invite_invalid`,
          `ui_login_confirm_email_invalid`).'
        schema:
          type: string
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Silent refresh.
          headers:
            Location:
              description: '`?redirect=` or `/ui/home`; sets both cookies.'
              schema:
                type: string
    post:
      tags:
      - ui
      summary: Sign in
      description: 'Answers a redirect in every case. Success: cookies set and `302` to the validated
        `redirect` or `/ui/home`; if the user''s saved `preferred_locale` is supported and the browser
        holds no explicit language choice, a `qlocale` cookie (1 year) is also set. MFA: `302` to `/ui/login/mfa?pending=...`.
        Refusals: `302` to `/ui/login?err=...` (`1` wrong credentials or unknown user, `ui_login_account_disabled`,
        `ui_login_account_locked`, `ui_login_email_unverified`).'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                redirect:
                  type: string
                  description: Optional; validated.
              required:
              - username
              - password
            example: username=alice&password=...&redirect=%2Fsage%2Fui%2Fhome
      responses:
        '302':
          description: See description.
          headers:
            Location:
              description: '`/ui/home`, the redirect, `/ui/login/mfa?...` or `/ui/login?err=...`'
              schema:
                type: string
  /ui/login/:
    get:
      tags:
      - ui
      summary: Sign-in page (trailing slash)
      description: If a refresh cookie is still good the session is renewed and the browser is sent on
        (302, new cookies) to `?redirect=` or `/ui/home`; otherwise the client page.
      security: []
      parameters:
      - name: redirect
        in: query
        required: false
        description: 'Where to go after signing in: a rooted same-origin path, or a URL under a prefix
          of `AUTH_REDIRECT_HOSTS`. Invalid values are ignored.'
        schema:
          type: string
      - name: err
        in: query
        required: false
        description: 'A notice code shown on the page: `1` (wrong credentials) or a translation key from
          the fixed list (`ui_login_verify_invalid`, `ui_login_reset_invalid`, `ui_login_account_disabled`,
          `ui_login_account_locked`, `ui_login_email_unverified`, `ui_login_rate_limited`, `ui_login_invite_invalid`,
          `ui_login_confirm_email_invalid`).'
        schema:
          type: string
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Silent refresh.
          headers:
            Location:
              description: '`?redirect=` or `/ui/home`; sets both cookies.'
              schema:
                type: string
  /ui/login/mfa:
    get:
      tags:
      - ui
      summary: Second-factor page
      description: Needs the `pending` query field (a framework `400` without it).
      security: []
      parameters:
      - name: pending
        in: query
        required: true
        description: The signed pending token from `POST /ui/login`.
        schema:
          type: string
      - name: redirect
        in: query
        required: false
        description: Carried through.
        schema:
          type: string
      - name: err
        in: query
        required: false
        description: '`1` after a wrong code.'
        schema:
          type: string
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: '`pending` missing (text body).'
    post:
      tags:
      - ui
      summary: Check the second factor
      description: '`pending` is `username:expires:HMAC` (valid 120 s). A wrong code counts toward the
        lockout and sends the browser back to `/ui/login/mfa?pending=...&err=1`.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                pending:
                  type: string
                code:
                  type: string
                redirect:
                  type: string
              required:
              - pending
              - code
            example: pending=alice%3A1767000000%3Aab12...&code=123456
      responses:
        '302':
          description: Success as `POST /ui/login`; refusals to `/ui/login?err=ui_login_account_disabled|ui_login_account_locked`;
            a wrong code or a bad `pending` back to the code page.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/status:
    get:
      tags:
      - ui
      summary: Session status for the page watcher
      description: Always 200. Reads the session cookie and its signature only (not the session store).
        `roles` is the token scope split on commas (`quench-auth` `auth_status`); the scope is space-separated,
        so for a non-wildcard user it comes back as one element.
      security: []
      responses:
        '200':
          description: Whether the cookie is worth anything.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
              example:
                authenticated: true
                username: alice
                roles:
                - user sage:read
  /ui/refresh:
    post:
      tags:
      - ui
      summary: Renew the session from the refresh cookie
      description: Rotates the refresh cookie in-process and sets both cookies.
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Renewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authenticated'
              example:
                authenticated: true
          headers:
            Set-Cookie:
              description: The session cookie and the refresh cookie (two headers).
        '401':
          description: No refresh cookie, or it is no longer good.
  /ui/logout:
    get:
      tags:
      - ui
      summary: Sign out
      description: Revokes the session behind the refresh cookie (realm-wide), clears both cookies and
        redirects to the validated `?redirect=` or `/ui/login`.
      security: []
      parameters:
      - name: redirect
        in: query
        required: false
        description: Validated like the login redirect.
        schema:
          type: string
      responses:
        '302':
          description: To the redirect or the login page; cookies cleared.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/home:
    get:
      tags:
      - ui
      summary: Services dashboard page
      description: 'Needs a session; without one: 302 to the login page. The client draws the cards from
        `GET /api/v1/ui/dashboard`.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: 'No session: to the login page.'
          headers:
            Location:
              description: '`<base>/ui/login`'
              schema:
                type: string
  /ui/home/:
    get:
      tags:
      - ui
      summary: Services dashboard page (trailing slash)
      description: 'Needs a session; without one: 302 to the login page. The client draws the cards from
        `GET /api/v1/ui/dashboard`.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: 'No session: to the login page.'
          headers:
            Location:
              description: '`<base>/ui/login`'
              schema:
                type: string
  /ui/register:
    get:
      tags:
      - ui
      summary: Registration page
      description: Public.
      security: []
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - ui
      summary: Register
      description: 'Invalid address, rate limit (20/hour per client, 3/day per address), or a realm error
        come back as `302 /ui/register?err=<key>`. Success: the account is created as role `user` with
        the catalog''s `registration.default_template` grants, a verification link (24 h) is mailed, and
        the browser goes to `/ui/login?registered=1`.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                email:
                  type: string
              required:
              - username
              - password
              - email
            example: username=carol&password=...&email=carol%40example.org
      responses:
        '302':
          description: '`/ui/login?registered=1` or `/ui/register?err=...`'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/register/:
    get:
      tags:
      - ui
      summary: Registration page (trailing slash)
      description: Public.
      security: []
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
  /ui/verify:
    get:
      tags:
      - ui
      summary: Confirm an address from the verification link
      description: Spends the token and marks the address confirmed.
      security: []
      parameters:
      - name: token
        in: query
        required: true
        description: From the mail.
        schema:
          type: string
      responses:
        '302':
          description: '`/ui/login?verified=1` or `/ui/login?err=ui_login_verify_invalid`'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
        '400':
          description: '`token` missing (text body).'
  /ui/forgot-password:
    get:
      tags:
      - ui
      summary: Forgot-password page
      description: Public.
      security: []
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - ui
      summary: Request a password reset
      description: 'Rate limited (20/hour per client, 3/hour per username; over the limit: `/ui/login?err=ui_login_rate_limited`).
        Otherwise always `302 /ui/login?reset_requested=1`, whether or not the account exists; if it has
