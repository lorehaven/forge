components:
  schemas:
    Permissions:
      type: object
      description: 'Grants as `{service: [action, ...]}`. Actions are plain catalog names (`read`) or
        resource-scoped `<resource_type>:<resource_id>:<action>` (`project:7:write`). Sets: duplicates
        collapse, order is sorted.'
      additionalProperties:
        type: array
        items:
          type: string
      example:
        sage:
        - read
        - write
        switchboard:
        - launch
    Role:
      type: string
      enum:
      - admin
      - user
      - service
      description: '`admin` and `service` are wildcard roles (every permission on every service). Only
        `admin` may assign them.'
    Problem:
      type: object
      description: 'The `{"error": "..."}` body of most refusals.'
      properties:
        error:
          type: string
          description: Reason in English (the user API) or a translation key (the page API and the form
            posts).
      required:
      - error
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: EdDSA-signed JWT.
        refresh_token:
          type: string
          description: Opaque, single use (rotated on refresh). Empty string for the `client_credentials`
            and `app_token` grants.
        token_type:
          type: string
          description: Always `Bearer`.
        expires_in:
          type: integer
          description: Access token lifetime in seconds (`ACCESS_TOKEN_TTL_SECS`, default 900).
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
    LoginError:
      type: object
      description: Body of a refused `POST /api/v1/auth/login` (always status 401).
      properties:
        error:
          type: string
          enum:
          - mfa_required
          - account_disabled
          - account_locked
          - email_unverified
          - invalid_credentials
      required:
      - error
    UserInfo:
      type: object
      description: What a token says. `permissions` is empty for a wildcard role.
      properties:
        sub:
          type: string
          description: Username (or client id).
        roles:
          type: array
          items:
            type: string
          description: Scope entries without a colon (the roles).
        audiences:
          type: array
          items:
            type: string
          description: The token's `aud`.
        permissions:
          $ref: '#/components/schemas/Permissions'
      required:
      - sub
      - roles
      - audiences
      - permissions
    UserView:
      type: object
      description: A user as the API shows them. The password hash and MFA secret never leave.
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          $ref: '#/components/schemas/Permissions'
        wildcard:
          type: boolean
          description: True when a role grants everything.
        email:
          type:
          - string
          - 'null'
        email_verified:
          type: boolean
        invite_sent:
          type: boolean
          description: 'Only on the response to creating an invited user: whether the invitation was accepted
            for delivery. The account exists either way.'
      required:
      - username
      - roles
      - permissions
      - wildcard
      - email
      - email_verified
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          description: 1 to 64 characters of ASCII letters, digits and `. _ - @ +`; trimmed.
        password:
          type: string
          description: Required unless `invite` is true.
          default: ''
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: Empty means `["user"]`. `admin`/`service` need the literal admin role.
          default: []
        permissions:
          $ref: '#/components/schemas/Permissions'
        email:
          type:
          - string
          - 'null'
          description: Required when `invite` is true.
        invite:
          type: boolean
          description: Email the address an invitation to choose a password; the account gets a random
            password nobody is told.
          default: false
      required:
      - username
    UpdateUserRequest:
      type: object
      description: Every field optional; absent leaves it alone.
      properties:
        password:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          $ref: '#/components/schemas/Permissions'
    ReplacePermissionsRequest:
      type: object
      description: '`permissions` defaults to `{}`, which removes every grant.'
      properties:
        permissions:
          $ref: '#/components/schemas/Permissions'
    ApplyTemplateRequest:
      type: object
      properties:
        template:
          type: string
          description: A template name from `[templates.*]` of the permission catalog.
      required:
      - template
    Me:
      type: object
      description: The caller's current access, wildcard resolved (every catalog action for a wildcard
        role).
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        wildcard:
          type: boolean
        effective:
          $ref: '#/components/schemas/Permissions'
      required:
      - username
      - roles
      - wildcard
      - effective
    CreateAppToken:
      type: object
      properties:
        name:
          type: string
          description: Non-blank after trimming.
        scope:
          type: array
          items:
            type: string
          description: '`service:action` entries the token is limited to; each must be held by the owner.
            Empty is the owner''s full access.'
          default: []
        expires_in_days:
          type:
          - integer
          - 'null'
          description: At least 1; capped at 365. Omitted means 365.
      required:
      - name
    AppTokenView:
      type: object
      properties:
        id:
          type: string
          description: 'Public handle: 12 characters.'
        name:
          type: string
        scope:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked:
          type: boolean
      required:
      - id
      - name
      - scope
      - created_at
      - expires_at
      - last_used_at
      - revoked
    CreatedAppToken:
      allOf:
      - $ref: '#/components/schemas/AppTokenView'
      - type: object
        properties:
          secret:
            type: string
            description: '`lht_` + 43 URL-safe characters. Shown once; only its SHA-256 is stored.'
        required:
        - secret
      description: An `AppTokenView` plus the one-time `secret`.
    TokenRequest:
      type: object
      description: Form fields; which are required depends on `grant_type`.
      properties:
        grant_type:
          type: string
          enum:
          - authorization_code
          - refresh_token
          - client_credentials
          - app_token
        code:
          type: string
          description: 'authorization_code: the code from `/api/v1/authorize`.'
        redirect_uri:
          type: string
          description: 'authorization_code: must equal the one the code was issued for.'
        code_verifier:
          type: string
          description: 'authorization_code: the PKCE verifier (S256).'
        client_id:
          type: string
          description: authorization_code, client_credentials.
        client_secret:
          type: string
          description: authorization_code, client_credentials.
        refresh_token:
          type: string
          description: refresh_token grant.
        app_token:
          type: string
          description: 'app_token grant: the `lht_...` secret.'
      required:
      - grant_type
    Jwks:
      type: object
      description: RFC 7517 JWK Set of every non-retired key.
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
                enum:
                - OKP
              crv:
                type: string
                enum:
                - Ed25519
              kid:
                type: string
              x:
                type: string
                description: Base64url (no padding) public key.
            required:
            - kty
            - crv
            - kid
            - x
      required:
      - keys
    NotifyBody:
      type: object
      properties:
        username:
          type: string
        template:
          type: string
          description: 'A template id: `conveyor.run.failed`, `conveyor.run.succeeded`, `conveyor.run.recovered`.'
        vars:
          type: object
          additionalProperties:
            type: string
          description: Exactly the variables the template declares (`project`, `run`, `ref`, `url` for
            the three conveyor templates).
          default: {}
        dedupe_key:
          type:
          - string
          - 'null'
          description: Repeating a key for the same person and template within a day sends nothing.
        requested:
          type: boolean
          description: 'The person subscribed in the calling service: sends a kind that is off by default
            unless they opted out of it here.'
          default: false
      required:
      - username
      - template
    NotifyResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - accepted
          - skipped
          - failed
        reason:
          type: string
          description: 'skipped: `no_such_user`, `no_verified_email`, `not_subscribed`, `duplicate`, `rate_limited`.
            failed: the mail error text.'
        retryable:
          type: boolean
          description: failed only.
      required:
      - status
    TestTokenRequest:
      type: object
      properties:
        sub:
          type: string
        aud:
          type: array
          items:
            type: string
          default: []
        scope:
          type: string
          description: Space separated roles and `service:action` entries.
        iat:
          type:
          - integer
          - 'null'
          description: Unix seconds; default now.
        exp:
          type:
          - integer
          - 'null'
          description: Unix seconds; default now + access TTL.
      required:
      - sub
      - scope
    AuthStatus:
      type: object
      description: What the page's session watcher is told. Reads the cookie and its signature only.
      properties:
        authenticated:
          type: boolean
        username:
          type:
          - string
          - 'null'
        roles:
          type: array
          items:
            type: string
      required:
      - authenticated
      - username
      - roles
    ServiceCard:
      type: object
      properties:
        url:
          type: string
        title_key:
          type: string
          description: '`ui_service_<name>_title`'
        desc_key:
          type: string
          description: '`ui_service_<name>_desc`'
        label:
          type: string
          description: Shown when no translation applies.
        description:
          type:
          - string
          - 'null'
        card_class:
          type: string
          description: '`home-card-<name>`'
      required:
      - url
      - title_key
      - desc_key
      - label
      - card_class
    Dashboard:
      type: object
      properties:
        admin:
          type: boolean
          description: Whether the person holds the `admin` role.
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCard'
      required:
      - admin
      - services
    Subscription:
      type: object
      properties:
        id:
          type: string
        service:
          type: string
        label_key:
          type: string
        wanted:
          type: boolean
      required:
      - id
      - service
      - label_key
      - wanted
    Account:
      type: object
      properties:
        username:
          type: string
        display_name:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
          description: A pasted address; never the bytes of an uploaded picture.
        has_avatar:
          type: boolean
        title:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        preferred_locale:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        email_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        has_notice_address:
          type: boolean
          description: Whether a confirmed address exists for notices.
        timezones:
          type: array
          items:
            type: string
          description: Every IANA zone name known.
        locales:
          type: array
          items:
            type: string
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
      required:
      - username
      - has_avatar
      - email_verified
      - mfa_enabled
      - has_notice_address
      - timezones
      - locales
      - subscriptions
    MfaEnrollment:
      type: object
      properties:
        secret:
          type: string
          description: Base32 TOTP secret; nothing is stored yet.
        uri:
          type: string
          description: '`otpauth://totp/...`'
        qr:
          type:
          - string
          - 'null'
          description: SVG `data:` URI of the QR code.
      required:
      - secret
      - uri
    MfaEnrollRequest:
      type: object
      properties:
        secret:
          type: string
        code:
          type: string
          description: The current code from the authenticator.
      required:
      - secret
      - code
    Grant:
      type: object
      properties:
        service:
          type: string
        actions:
          type: array
          items:
            type: string
      required:
      - service
      - actions
    AdminUserRow:
      type: object
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        wildcard:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
      required:
      - username
      - roles
      - wildcard
      - grants
    AdminUsers:
      type: object
      properties:
        actor:
          type: string
        admin:
          type: boolean
          description: Whether the viewer is a literal administrator (may pick roles).
        can_create:
          type: boolean
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserRow'
      required:
      - actor
      - admin
      - can_create
      - users
    CatalogService:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        actions:
          type: array
          items:
            type: string
      required:
      - name
      - label
      - actions
    AdminUser:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          description: 'The most privileged role held: `admin`, `service` or `user`.'
        wildcard:
          type: boolean
        held:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        email:
          type:
          - string
          - 'null'
        email_verified:
          type: boolean
        disabled:
          type: boolean
        locked:
          type: boolean
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          description: '`2026-10-29 10:00 UTC`'
        last_login_at:
          type:
          - string
          - 'null'
        is_self:
          type: boolean
        viewer_admin:
          type: boolean
        can_edit:
          type: boolean
        can_delete:
          type: boolean
        can_manage_permissions:
          type: boolean
        services:
          type: array
          items:
            $ref: '#/components/schemas/CatalogService'
        templates:
          type: array
          items:
            type: string
      required:
      - username
      - role
      - wildcard
      - held
      - email_verified
      - disabled
      - locked
      - mfa_enabled
      - created_at
      - is_self
      - viewer_admin
      - can_edit
      - can_delete
      - can_manage_permissions
      - services
      - templates
    ConfirmEmail:
      type: object
      properties:
        new_email:
          type: string
      required:
      - new_email
    UnsubscribeInfo:
      type: object
      properties:
        label_key:
          type: string
      required:
      - label_key
    Done:
      type: object
      properties:
        done:
          type: boolean
      required:
      - done
    Authenticated:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
      - authenticated
    AvatarUpload:
      type: object
      description: multipart/form-data fields. A missing or empty field leaves the value alone (blank
        cannot clear).
      properties:
        avatar_file:
          type: string
          description: PNG, JPEG, GIF or WebP, at most 262 144 bytes (type sniffed from the bytes).
          format: binary
        avatar_url:
          type: string
          description: http(s) address; ignored when a file is uploaded.
        avatar_remove:
          type: string
          description: Present (any value) clears the picture; wins over the others.
        display_name:
          type: string
        title:
          type: string
        timezone:
          type: string
          description: IANA zone name.
        preferred_locale:
          type: string
          enum:
          - en-US
          - pl-PL
          - es-ES
          - de-DE
          - fr-FR
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'An access token issued by Gatehouse (`Authorization: Bearer <token>`). Its audience
        must include `gatehouse`; when it carries a session id the session must still be active.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: forge_session
      description: The access token in the session cookie. The name is `AUTH_COOKIE_NAME` (default `forge_session`);
        `HttpOnly`, `Secure`, `SameSite=Lax`, path `/`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: forge_refresh
      description: The refresh token. Name is `AUTH_REFRESH_COOKIE_NAME` (default `forge_refresh`); Max-Age
        is `REFRESH_TOKEN_TTL_SECS`.
  parameters: {}
  responses: {}
