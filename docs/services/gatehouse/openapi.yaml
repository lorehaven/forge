      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
  /ui/reset-password:
    get:
      tags:
      - ui
      summary: Reset-password page
      description: Needs `token` in the query.
      security: []
      parameters:
      - name: token
        in: query
        required: true
        description: From the mail.
        schema:
          type: string
      - name: err
        in: query
        required: false
        description: A notice key.
        schema:
          type: string
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: '`token` missing.'
    post:
      tags:
      - ui
      summary: Set a new password
      description: Spends the token, sets the password, ends every session of the user, confirms an unconfirmed
        address, mails a password-changed notice. An empty password returns to the form with `err=ui_reset_error_password_empty`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
              - token
              - password
            example: token=...&password=...
      responses:
        '302':
          description: '`/ui/login?reset=1`, `/ui/login?err=ui_login_reset_invalid` or back to the form.'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/resend-verification:
    get:
      tags:
      - ui
      summary: Resend-verification page
