# OpenAPI 3.1 description of the service's HTTP routes, hand-checked against the source.
openapi: 3.1.0
info:
  title: Gatehouse
  version: 0.4.2
  description: 'Gatehouse is the Forge estate''s authentication service: one identity store, one login,
    one session. It issues Ed25519-signed tokens that every other service verifies against its JWKS. Version
    is that of `gatehouse-service`.'
servers:
- url: '{base}'
  description: Mounted under BASE_PATH.
  variables:
    base:
      default: /gatehouse
      description: The `BASE_PATH` the service is mounted under (`/` when unset; deployments use `/gatehouse`).
tags:
- name: auth
  description: 'Token API: password login, refresh, logout, userinfo. JSON in and out; the credential
    is in the body.'
- name: oauth
  description: 'OAuth 2 surface: authorization code with PKCE, the token endpoint (four grants), JWKS
    and signing key rotation.'
- name: users
  description: Realm user administration and the caller's own effective access. Each route needs a `gatehouse:*`
    catalog action.
- name: app-tokens
  description: A person's long-lived application tokens for command-line tools.
- name: notify
  description: Notifications that other services ask Gatehouse to send.
- name: test
  description: Token minting for the BDD harness; answers 404 unless `GATEHOUSE_TEST_MODE=true`.
- name: pages
  description: JSON the browser client draws its screens from (`/api/v1/ui/...`).
- name: ui
  description: 'Single sign-on and account pages (`/ui/...`): HTML shells, form posts that answer with
    redirects, and the client''s static files.'
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Password login
      description: Checks the credentials and returns a token pair. An account with a second factor, a
        disabled or locked account, and an unconfirmed address are refused with a code in the body; the
        second-factor step exists only on the browser path (`POST /ui/login/mfa`). A wrong password counts
        toward the lockout (`GATEHOUSE_LOGIN_MAX_ATTEMPTS`, `GATEHOUSE_LOCKOUT_DURATION_SECS`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: correct horse
      responses:
        '200':
          description: Tokens issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJhbGciOiJFZERTQSIs...
                refresh_token: Zm9vYmFy...
                token_type: Bearer
                expires_in: 900
        '401':
          description: Refused; the code says why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginError'
              example:
                error: invalid_credentials
        '400':
          description: Malformed JSON (text body).
        '500':
          description: The user store failed.
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Rotate a refresh token
      description: The refresh token comes from the JSON body or, when the body is empty or not the expected
        JSON, from the refresh cookie. The old token is spent; presenting it again within a short grace
        period returns the result of the first rotation. Rotations are serialised in-process. In the cookie
        flow the response also sets the session and refresh cookies.
      security:
      - refreshCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: Zm9vYmFy...
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            Set-Cookie:
              description: The session cookie and the refresh cookie (two headers).
        '400':
          description: No refresh token in the body or the cookie.
        '401':
          description: Unknown, expired or revoked token, or the user is gone.
        '500':
          description: Store or signing failure.
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Revoke a session
      description: Revokes the session behind the refresh token, realm-wide (every service sees it on
        its next request). Answers 204 even for an unknown token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: Zm9vYmFy...
      responses:
        '204':
          description: Revoked.
        '400':
          description: Malformed JSON (text body).
        '500':
          description: Session store failure.
  /api/v1/auth/userinfo:
    get:
      tags:
      - auth
      summary: What a token says
      description: 'Accepts only an `Authorization: Bearer` header (never the cookie). The token must
        verify, include the `gatehouse` audience and (when it has a session id) belong to an active session.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Subject, roles, audiences, permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
              example:
                sub: alice
                roles:
                - user
                audiences:
                - sage
                - gatehouse
                permissions:
                  sage:
                  - read
                  - write
        '401':
          description: No acceptable token (empty body).
  /api/v1/authorize:
    get:
      tags:
      - oauth
      summary: Authorization endpoint (code + PKCE)
      description: Without a session cookie the browser is sent to `/ui/login?redirect=<this URL>`; with
        one a single-use code (valid 60 seconds) is created and the browser is redirected to `redirect_uri?code=...&state=...`.
        `redirect_uri` must equal one registered for the client (built from `<PREFIX>_UI_URL` or `<PREFIX>_URL`
        plus the client's `redirect_path`).
      security:
      - sessionCookie: []
      parameters:
      - name: client_id
        in: query
        required: true
        description: A client from `config/clients.toml`.
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        description: Exact match of the registration.
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: Opaque, returned unchanged.
        schema:
          type: string
      - name: scope
        in: query
        required: false
        description: Stored with the code; the issued token's audience comes from the client's `allowed_scopes`,
          not from this.
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        description: Base64url SHA-256 of the verifier.
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        description: Only `S256` is supported (also when omitted).
        schema:
          type: string
          enum:
          - S256
      responses:
        '302':
          description: To the login page, or back to the client with a code.
          headers:
            Location:
              description: '`/ui/login?redirect=...` or `<redirect_uri>?code=...&state=...`'
              schema:
                type: string
        '400':
          description: 'Unknown client, unregistered redirect_uri, or a challenge method other than S256
            (or a missing query field: text body).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: unknown client
        '401':
          description: The session's user no longer exists.
        '500':
          description: Code could not be stored.
  /api/v1/token:
    post:
      tags:
      - oauth
      summary: Token endpoint
      description: 'Form-encoded. `authorization_code`: code + redirect_uri + client_id + client_secret
        + code_verifier, returns an access token narrowed to the client''s `allowed_scopes` plus a refresh
        token. `refresh_token`: rotates like `/auth/refresh`. `client_credentials`: access-only token
        for the client, scope `service`, audience = the client''s `allowed_scopes`. `app_token`: exchanges
        an application token (`lht_...`) for an access-only token carrying the owner''s current grants
        narrowed to the token''s scope.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example: grant_type=app_token&app_token=lht_...
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJ...
                refresh_token: ''
                token_type: Bearer
                expires_in: 900
        '400':
          description: Unsupported grant, missing field, unknown client, wrong secret, bad/expired/used
            code, redirect mismatch, PKCE failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: PKCE verification failed
        '401':
          description: 'refresh_token / app_token grant: unknown, expired, revoked or exhausted token,
            or the user is gone.'
        '500':
          description: Store or signing failure.
  /.well-known/jwks.json:
    get:
      tags:
      - oauth
      summary: Public signing keys
      description: The Ed25519 public keys (one active, plus recently rotated-out ones until their retirement).
        Unauthenticated; relying parties cache it.
      security: []
      responses:
        '200':
          description: JWK Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              example:
                keys:
                - kty: OKP
                  crv: Ed25519
                  kid: 0b9c...
                  x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
  /api/v1/admin/keys/rotate:
    post:
      tags:
      - oauth
      summary: Rotate the signing key
      description: Retires the active key (it stays in JWKS for one access-token lifetime) and generates
        a new one.
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:manage-signing-keys
      responses:
        '204':
          description: Rotated.
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Authenticated but lacking the required `gatehouse` action (empty body).
        '500':
          description: Rotation failed.
  /api/v1/users:
    get:
      tags:
      - users
      summary: List users
      description: Sorted by username.
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:read-users
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserView'
              example:
              - username: alice
                roles:
                - user
                permissions:
                  sage:
                  - read
                wildcard: false
                email: alice@example.org
                email_verified: true
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Authenticated but lacking the required `gatehouse` action (empty body).
        '500':
          description: Store failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
      - users
      summary: Create a user
      description: Roles default to `["user"]`. Grants are checked against the catalog. With `invite`
        true and an `email`, the account gets a random password and an invitation link (7 days) is mailed;
        `invite_sent` reports whether mail was accepted. Assigning `admin` or `service` needs the literal
        `admin` role.
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:create-user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              username: bob
              password: s3cret
              roles:
              - user
              permissions:
                workbench:
                - read
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Missing `create-user` (empty body), or `admin`/`service` roles requested without
            the admin role (JSON body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: only an admin may assign the admin or service role
        '400':
          description: Rejected input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: username must not be empty
        '409':
          description: A rule keeping the realm reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: the realm must keep at least one admin
        '500':
          description: The change could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: the change could not be saved
  /api/v1/users/{username}:
    get:
      tags:
      - users
      summary: Read one user
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:read-users
      parameters:
      - name: username
        in: path
        required: true
        description: The account name.
        schema:
          type: string
        example: alice
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Authenticated but lacking the required `gatehouse` action (empty body).
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: no such user
    patch:
      tags:
      - users
      summary: Change password, roles or grants
      description: Only the given fields change. Changing roles or grants, or changing another user at
        all, ends the target's sessions. Removing `admin` from yourself or from the last admin is refused.
        A password change mails a security notice to the confirmed address.
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:edit-user
      parameters:
      - name: username
        in: path
        required: true
        description: The account name.
        schema:
          type: string
        example: alice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              permissions:
                sage:
                - read
                - write
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Missing `edit-user`, or roles need admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: only an admin may assign the admin or service role
        '400':
          description: Rejected input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: username must not be empty
        '404':
          description: No such user or template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: no such user
        '409':
          description: A rule keeping the realm reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: the realm must keep at least one admin
        '500':
          description: The change could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: the change could not be saved
    delete:
      tags:
      - users
      summary: Delete a user
      description: Refused for yourself and for the last admin. Ends the user's sessions.
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:delete-user
      parameters:
      - name: username
        in: path
        required: true
        description: The account name.
        schema:
          type: string
        example: alice
      responses:
        '204':
          description: Deleted.
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Authenticated but lacking the required `gatehouse` action (empty body).
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: '`you cannot delete your own account` or `the realm must keep at least one admin`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: you cannot delete your own account
        '500':
          description: Not saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/users/{username}/permissions:
    put:
      tags:
      - users
      summary: Replace a user's grants
      description: Replaces the whole grant set (an empty `permissions` removes everything). Ends the
        target's sessions.
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:manage-permissions
      parameters:
      - name: username
        in: path
        required: true
        description: The account name.
        schema:
          type: string
        example: alice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePermissionsRequest'
            example:
              permissions:
                sage:
                - read
                conveyor:
                - project:7:write
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Authenticated but lacking the required `gatehouse` action (empty body).
        '400':
          description: Rejected input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: username must not be empty
        '404':
          description: No such user or template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: no such user
        '500':
          description: The change could not be saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: the change could not be saved
  /api/v1/users/{username}/template:
    post:
      tags:
      - users
      summary: Apply a grant template
      description: Replaces the user's grants with the template's.
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:manage-permissions
      parameters:
      - name: username
        in: path
        required: true
        description: The account name.
        schema:
          type: string
        example: alice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTemplateRequest'
            example:
              template: editor
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Authenticated but lacking the required `gatehouse` action (empty body).
        '404':
          description: No such user or no such permission template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: no such permission template
        '500':
          description: Not saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me:
    get:
      tags:
      - users
      summary: The caller's own effective access
      description: Read from the user record, not the token, so a grant added since the token was minted
        shows. A wildcard role lists every catalog action of every service.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Effective access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                username: alice
                roles:
                - user
                wildcard: false
                effective:
                  sage:
                  - read
                  - write
        '401':
          description: Missing, invalid or revoked token (empty body).
  /api/v1/me/tokens:
    post:
      tags:
      - app-tokens
      summary: Mint an application token
      description: Needs a login session behind the credential (a token with no session id, such as one
        from an app-token exchange, gets 403), so a token can always be revoked by its owner. Every `scope`
        entry must be a `service:action` the owner holds.
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppToken'
            example:
              name: anvil on laptop
              scope:
              - warehouse:write
              expires_in_days: 90
      responses:
        '201':
          description: Created; the secret is shown only here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAppToken'
              example:
                id: x7Qm2pLw9aBc
                name: anvil on laptop
                scope:
                - warehouse:write
                created_at: '2026-10-30T08:00:00Z'
                expires_at: '2027-01-28T08:00:00Z'
                last_used_at: null
                revoked: false
                secret: lht_abc...
        '401':
          description: No credential, or the user is gone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: unknown user
        '403':
          description: '`application tokens are created from a signed-in session`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: application tokens are created from a signed-in session
        '422':
          description: Blank name, `expires_in_days` below 1, malformed entry, or an entry the owner does
            not hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: you do not hold sage:write
        '500':
          description: Not stored.
    get:
      tags:
      - app-tokens
      summary: List my application tokens
      description: Includes revoked and expired ones; never the secrets.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: The caller's tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppTokenView'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '500':
          description: Store failure.
  /api/v1/me/tokens/{id}:
    delete:
      tags:
      - app-tokens
      summary: Revoke an application token
      description: Idempotent. Another person's token answers 404.
      security:
      - bearerAuth: []
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        description: The token's `id`.
        schema:
          type: string
        example: x7Qm2pLw9aBc
      responses:
        '204':
          description: Revoked (or already).
        '401':
          description: Missing, invalid or revoked token (empty body).
        '404':
          description: Not the caller's token (empty body).
        '500':
          description: Store failure.
  /api/v1/notify:
    post:
      tags:
      - notify
      summary: Ask Gatehouse to notify a person
      description: 'Validation comes first (unknown template, missing or extra variable, control characters,
        values over 300 characters, a `url` that is not under Gatehouse''s public origin: 400). Then:
        unknown user (`skipped: no_such_user`), no confirmed address (`no_verified_email`), unsubscribed
        (`not_subscribed`), duplicate `dedupe_key` (`duplicate`), per-person limit 20/hour or per-person-per-template
        10/hour (`rate_limited`). Mail goes out in the person''s `preferred_locale`.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:notify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyBody'
            example:
              username: alice
              template: conveyor.run.failed
              vars:
                project: forge
                run: '#412'
                ref: master
                url: https://ennor.ddns.net/conveyor/ui/runs/412
              dedupe_key: run-412
              requested: false
      responses:
        '202':
          description: Handed to the mail server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyResponse'
              example:
                status: accepted
        '200':
          description: Deliberately not sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyResponse'
              example:
                status: skipped
                reason: not_subscribed
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: 'no such notification: conveyor.run.nope'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Authenticated but lacking the required `gatehouse` action (empty body).
        '502':
          description: Should have been sent and was not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyResponse'
              example:
                status: failed
                reason: the daily email budget is used up
                retryable: true
  /api/v1/test/token:
    post:
      tags:
      - test
      summary: Mint a token (tests only)
      description: Signs the given claims with the real key. Answers 404 unless the environment variable
        `GATEHOUSE_TEST_MODE` is `true` (the service's `main` never sets it).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestTokenRequest'
            example:
              sub: tester
              aud:
              - gatehouse
              scope: admin
      responses:
        '200':
          description: The token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                required:
                - access_token
              example:
                access_token: eyJ...
        '404':
          description: Test mode is off.
        '500':
          description: Signing failed.
  /api/v1/ui/dashboard:
    get:
      tags:
      - pages
      summary: Dashboard cards
      description: 'Services of the catalog with `home = true` whose `<NAME>_UI_URL` (or `<NAME>_URL`)
        is set and `FEATURE_<NAME>_ENABLED` is not off, filtered to those the person may use: holds `read`
        on it, or any grant on it, or a wildcard role. In catalog (name) order.'
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          description: Missing, invalid or revoked token (empty body).
  /api/v1/ui/account:
    get:
      tags:
      - pages
      summary: The caller's account
      description: With `SERVICE_AUTH_ENABLED` off the stand-in administrator `admin` is used.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '404':
          description: The user is gone (`ui_admin_error_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_forbidden
        '500':
          description: Store failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_forbidden
  /api/v1/ui/mfa-enroll:
    get:
      tags:
      - pages
      summary: A fresh TOTP secret
      description: Nothing is stored until the first code is checked.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: Secret, URI and QR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '500':
          description: Secret generation failed (`ui_admin_error_internal`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_forbidden
    post:
      tags:
      - pages
      summary: Turn on MFA
      description: Checks the code against the secret, stores the secret encrypted, enables MFA and mails
        a security notice to the confirmed address.
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollRequest'
            example:
              secret: JBSWY3DPEHPK3PXP
              code: '123456'
      responses:
        '200':
          description: MFA is on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
              example:
                done: true
        '400':
          description: Wrong code (`ui_admin_error_mfa_code_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_forbidden
        '401':
          description: Missing, invalid or revoked token (empty body).
        '500':
          description: Not saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_forbidden
  /api/v1/ui/admin/users:
    get:
      tags:
      - pages
      summary: User list for the administration screen
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:read-users
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsers'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Lacks `read-users` (`ui_admin_forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_forbidden
  /api/v1/ui/admin/users/{username}:
    get:
      tags:
      - pages
      summary: One user with the catalog
      security:
      - bearerAuth: []
      - sessionCookie: []
      x-permission: gatehouse:read-users
      parameters:
      - name: username
        in: path
        required: true
        description: The account name.
        schema:
          type: string
        example: alice
      responses:
        '200':
          description: The user, the catalog and what the viewer may do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          description: Missing, invalid or revoked token (empty body).
        '403':
          description: Lacks `read-users`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_forbidden
        '404':
          description: No such user (`ui_admin_error_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_forbidden
  /api/v1/ui/confirm-email:
    get:
      tags:
      - pages
      summary: What an email-change link would set
      description: 'The link''s token is the credential: no session. Peeks without spending it.'
      security: []
      parameters:
      - name: token
        in: query
        required: true
        description: From the link.
        schema:
          type: string
      responses:
        '200':
          description: The new address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmEmail'
        '404':
          description: Unknown or used token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_not_found
  /api/v1/ui/unsubscribe:
    get:
      tags:
      - pages
      summary: What an unsubscribe link ends
      description: No session; the token is the credential.
      security: []
      parameters:
      - name: token
        in: query
        required: false
        description: From the link.
        schema:
          type: string
      responses:
        '200':
          description: The kind of notification.
          content:
            application/json:
