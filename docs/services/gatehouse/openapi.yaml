            example: username=alice
      responses:
        '302':
          description: '`/ui/login?reset_requested=1` or `?err=ui_login_rate_limited`'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/forgot-password/:
    get:
      tags:
      - ui
      summary: Forgot-password page (trailing slash)
      description: Public.
