          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - ui
      summary: Resend the verification link
      description: 'Limits: 20/hour per client, 3/hour per username, 1/minute per username. Always `302
        /ui/login?resend_requested=1` unless limited; a link is mailed only for an enabled account whose
        address is unconfirmed and who needs verification.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
              required:
              - username
            example: username=carol
      responses:
        '302':
          description: '`/ui/login?resend_requested=1` or `?err=ui_login_rate_limited`'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/resend-verification/:
    get:
      tags:
      - ui
      summary: Resend-verification page (trailing slash)
      description: Public.
      security: []
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
  /ui/accept-invite:
    get:
      tags:
      - ui
      summary: Accept-invitation page
      description: Needs `token` in the query.
      security: []
      parameters:
      - name: token
        in: query
        required: true
        description: From the invitation mail.
        schema:
          type: string
      - name: err
        in: query
        required: false
        description: A notice key.
        schema:
          type: string
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: '`token` missing.'
    post:
      tags:
      - ui
      summary: Choose a password for an invited account
      description: 'Blank password: back to the form with `err=ui_reset_error_password_empty`. Spends
        the token, sets the password (ends sessions), confirms the address.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
              - token
              - password
            example: token=...&password=...
      responses:
        '302':
          description: '`/ui/login?invited=1`, `/ui/login?err=ui_login_invite_invalid` or back to the
            form.'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/confirm-email:
    get:
      tags:
      - ui
      summary: Confirm-new-address page
      description: Shows the change only; with an unknown token redirects to `/ui/login?err=ui_login_confirm_email_invalid`.
      security: []
      parameters:
      - name: token
        in: query
        required: true
        description: From the mail.
        schema:
          type: string
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Invalid token.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
        '400':
          description: '`token` missing.'
    post:
      tags:
      - ui
      summary: Confirm the new address
      description: Spends the token and sets the address as confirmed; the previous address, if it was
        confirmed, is told.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
            example: token=...
      responses:
        '302':
          description: '`/ui/login?email_changed=1` or `?err=ui_login_confirm_email_invalid`'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/unsubscribe:
    get:
      tags:
      - ui
      summary: Unsubscribe page
      description: Public; opening only asks.
      security: []
      parameters:
      - name: token
        in: query
        required: false
        description: From the notification mail.
        schema:
          type: string
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - ui
      summary: End a subscription
      description: 'The token is read from `?token=` or the form field `token`. Also the target of a mail
        provider''s one-click POST (RFC 8058). Idempotent: the token is not spent.'
      security: []
      parameters:
      - name: token
        in: query
        required: false
        description: From the mail (alternatively the form field).
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
            example: List-Unsubscribe=One-Click
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
              example:
                done: true
        '404':
          description: Unknown token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_unsubscribe_invalid
        '500':
          description: Not saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                error: ui_admin_error_internal
  /ui/account:
    get:
      tags:
      - ui
      summary: Account page
      description: The client draws it from `GET /api/v1/ui/account`; `?ok=` / `?err=` show the outcome
        of a form post.
      security:
      - bearerAuth: []
      - sessionCookie: []
      responses:
        '200':
          description: The client page (HTML shell); the screen is drawn in the browser.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: 'No session: to the login page.'
          headers:
            Location:
              description: '`<base>/ui/login`'
              schema:
                type: string
    post:
      tags:
      - ui
      summary: Save the profile
      description: Multipart. Validates the zone (IANA) and locale (one of `en-US pl-PL es-ES de-DE fr-FR`),
        resolves the picture (`avatar_remove`, else a file, else an http(s) `avatar_url`), updates the
        record. Redirects to `/ui/account?ok=saved` or `?err=<key>` (`ui_account_error_avatar_size`, `ui_account_error_avatar_type`,
        `ui_account_error_invalid`, a realm error key).
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUpload'
      responses:
        '302':
          description: '`/ui/account?ok=saved` or `?err=...`; no session: login page.'
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
  /ui/account/notifications:
    post:
      tags:
      - ui
      summary: Choose notification kinds
      description: One checkbox per kind named `sub_<template id>` (present = wanted). Only departures
        from a kind's default are stored.
      security:
      - bearerAuth: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                sub_conveyor.run.failed:
                  type: string
                  description: 'Checkbox: present means wanted.'
