[package]
name = "conveyor-cli"
version = "0.3.18"
edition = { workspace = true }
authors = { workspace = true }
description = "Conveyor CLI - drive the Forge CI/CD service from a terminal"
keywords = ["ci", "cd", "pipeline", "cli"]
categories = ["command-line-utilities", "development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[lib]
name = "conveyor_cli"
path = "src/lib.rs"

[[bin]]
name = "conveyor"
path = "src/main.rs"

[dependencies]
quench-serde = { workspace = true }
quench-core = { workspace = true }
clap = { workspace = true }
conveyor-pipeline = { workspace = true }
dotenvy = { workspace = true }
quench-cli = { workspace = true }
quench-client = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
