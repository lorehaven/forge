# Pulley Backup Configuration Example
#
# Global configs (~/.config/pulley/*.toml, e.g. personal.toml) and local configs
# (*.pulley.toml in the current directory) merge alphabetically; local jobs
# override global jobs with matching IDs.

# Local backup example
[[jobs]]
id = "documents"
desc = "Backup documents folder"
src = "/home/user/Documents"
dest = "/tmp/documents"
delete = true
skip = ["temp", "cache"]
no-confirm = false

# Remote backup example (via SSH)
[[jobs]]
id = "remote-photos"
desc = "Backup photos from remote server"
src = "user@server.com:/home/user/photos"
dest = "/mnt/backup/photos"
delete = false
skip = ["thumbnails"]
no-confirm = true

# Another local backup
[[jobs]]
id = "projects"
desc = "Backup project files"
src = "/home/user/projects"
dest = "/mnt/backup/projects"
delete = true
skip = ["target", "node_modules", ".git"]
no-confirm = false
