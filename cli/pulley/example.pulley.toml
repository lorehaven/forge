# Pulley Backup Configuration Example
#
# Global configs (~/.config/pulley/*.toml, e.g. personal.toml) and local configs
# (*.pulley.toml in the current directory) merge alphabetically; local jobs
# override global jobs with matching IDs.

# Local backup example. `interval` (seconds) makes this job daemon-eligible:
# `pulley daemon` will only pick up jobs that set it, and re-runs this one
# every 5 minutes. Jobs without `interval` stay REPL-only.
[[jobs]]
id = "documents"
desc = "Backup documents folder"
src = "/home/user/Documents"
dest = "/tmp/documents"
delete = true
skip = ["temp", "cache"]
no-confirm = false
interval = 300

# Remote backup example (via SSH)
[[jobs]]
id = "remote-photos"
desc = "Backup photos from remote server"
src = "user@server.com:/home/user/photos"
dest = "/mnt/backup/photos"
delete = false
skip = ["thumbnails"]
no-confirm = true

# Another local backup
[[jobs]]
id = "projects"
desc = "Backup project files"
src = "/home/user/projects"
dest = "/mnt/backup/projects"
delete = true
skip = ["target", "node_modules", ".git"]
no-confirm = false

# A source that is switched off part of the day, with deletions propagated. Nothing extra is needed on the source: a job that
# deletes runs only when the source answers, exists and is not empty (an unmounted drive's mount point is empty), so a host
# that is off, or up with its drive not mounted yet, is skipped quietly (one log line when it goes, one when it returns) and
# the backup keeps what it has. `marker = "projects"` would additionally require that existing path to be present.
[[jobs]]
id = "lorien"
desc = "Backup from lorien"
src = "me@lorien:/mnt/data/projects"
dest = "/srv/backup/lorien/projects"
delete = true
no-confirm = true
interval = 900
