[package]
name = "pulley"
version = "0.1.21"
edition = { workspace = true }
authors = { workspace = true }
description = "Pulley CLI - sync/backup jobs powered by rsync"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[[bin]]
name = "pulley"
path = "src/main.rs"

[lib]
name = "pulley"
path = "src/lib.rs"

[dependencies]
quench-serde = { workspace = true }
quench-core = { workspace = true }
quench-tz = { workspace = true }
quench-args = { workspace = true }
quench-cli = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
