[package]
name = "anvil"
version = "0.4.22"
edition = { workspace = true }
authors = { workspace = true }
description = "Anvil CLI - workspace build tools for cargo projects"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[[bin]]
name = "anvil"
path = "src/main.rs"

[lib]
name = "anvil"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
quench-serde = { workspace = true }
quench-core = { workspace = true }
quench-args = { workspace = true }
gatehouse-auth = { workspace = true }
quench-client = { workspace = true }
quench-cli = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "cli_tests"
path = "tests/cli_tests.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
