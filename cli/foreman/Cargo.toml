[package]
name = "foreman"
version = "0.1.11"
edition = { workspace = true }
authors = { workspace = true }
description = "Foreman - run a project's local development estate from one TOML file"
keywords = ["development", "tools", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"
autotests = false

[[bin]]
name = "foreman"
path = "src/main.rs"

[lib]
name = "foreman"
path = "src/lib.rs"

[dependencies]
quench-serde = { workspace = true }
quench-core = { workspace = true }
quench-args = { workspace = true }
libc = { workspace = true }
quench-cli = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
