apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: golden
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: api
    app.kubernetes.io/managed-by: riveter
    env: golden
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: api
        env: golden
    spec:
      serviceAccountName: ossiriand-golden-sa
      restartPolicy: Never
      containers:
      - name: ossiriand
        image: nginx
        imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: golden
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/instance: worker
    app.kubernetes.io/managed-by: riveter
    env: golden
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/instance: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/instance: worker
        env: golden
    spec:
      serviceAccountName: worker-sa
      restartPolicy: Never
      containers:
      - name: worker
        image: nginx
        imagePullPolicy: Always
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg
  namespace: golden
  labels:
    app.kubernetes.io/name: pg
    app.kubernetes.io/instance: pg
    app.kubernetes.io/managed-by: riveter
    env: golden
spec:
  serviceName: pg
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: pg
      app.kubernetes.io/instance: pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg
        app.kubernetes.io/instance: pg
        env: golden
    spec:
      serviceAccountName: ossiriand-golden-sa
      restartPolicy: Never
      containers:
      - name: ossiriand
        image: postgres:17
        imagePullPolicy: IfNotPresent
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: golden
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/instance: migrate
    app.kubernetes.io/managed-by: riveter
    env: golden
spec:
  template:
    spec:
      serviceAccountName: ossiriand-golden-sa
      restartPolicy: Never
      containers:
      - name: ossiriand
        image: migrate:1
        imagePullPolicy: IfNotPresent
      volumes:
      - name: script
        hostPath:
          path: /opt/migrate.sh
          type: DirectoryOrCreate
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: golden
  labels:
    app.kubernetes.io/name: nightly
    app.kubernetes.io/instance: nightly
    app.kubernetes.io/managed-by: riveter
    env: golden
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ossiriand-golden-sa
          restartPolicy: Never
          containers:
          - name: ossiriand
            image: report:1
            imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: golden
  labels:
    app.kubernetes.io/name: debug
    app.kubernetes.io/instance: debug
    app.kubernetes.io/managed-by: riveter
    env: golden
spec:
  serviceAccountName: ossiriand-golden-sa
  restartPolicy: Never
  containers:
  - name: ossiriand
    image: busybox
    imagePullPolicy: IfNotPresent
