[package]
name = "riveter"
version = "0.4.7"
edition = { workspace = true }
authors = { workspace = true }
description = "Riveter – k8s support tool, powered by Rust and minijinja."
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
exclude = ["**/*.rs.bk", ".gitignore", "target", "Cargo.lock"]
autotests = false

[[bin]]
name = "riveter"
path = "src/main.rs"

[lib]
name = "riveter"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
quench-crypto = { workspace = true }
quench-core = { workspace = true }
quench-serde = { workspace = true, features = ["yaml"] }
quench-args = { workspace = true }
gatehouse-auth = { workspace = true }
quench-schema = { workspace = true }
quench-template = { workspace = true }
quench-cli = { workspace = true }
rivet-package = { workspace = true }
quench-regex = { workspace = true }
quench-client = { workspace = true, features = ["blocking"] }

[dev-dependencies]
conveyor-pipeline = { workspace = true }
tokio = { workspace = true }
quench-test = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
