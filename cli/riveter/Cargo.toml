[package]
name = "riveter"
version = "0.3.5"
edition = { workspace = true }
authors = { workspace = true }
description = "Riveter – k8s support tool, powered by Rust and minijinja."
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
exclude = ["**/*.rs.bk", ".gitignore", "target", "Cargo.lock"]

[[bin]]
name = "riveter"
path = "src/main.rs"

[lib]
name = "riveter"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
age = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
minijinja = { workspace = true }
quench-cli = { workspace = true }
rivet-package = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "query"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
urlencoding = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
conveyor-pipeline = { workspace = true }
envmnt = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
