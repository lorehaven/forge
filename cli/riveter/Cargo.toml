[package]
name = "riveter"
version = "0.4.3"
edition = { workspace = true }
authors = { workspace = true }
description = "Riveter – k8s support tool, powered by Rust and minijinja."
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
exclude = ["**/*.rs.bk", ".gitignore", "target", "Cargo.lock"]

[[bin]]
name = "riveter"
path = "src/main.rs"

[lib]
name = "riveter"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
quench-crypto = { workspace = true }
quench-core = { workspace = true }
quench-serde = { workspace = true, features = ["yaml"] }
age = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
gatehouse-auth = { workspace = true }
jsonschema = { workspace = true }
minijinja = { workspace = true }
quench-cli = { workspace = true }
rivet-package = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
quench-client = { workspace = true, features = ["blocking"] }
walkdir = { workspace = true }

[dev-dependencies]
conveyor-pipeline = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }
