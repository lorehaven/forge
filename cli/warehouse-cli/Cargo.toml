[package]
name = "warehouse-cli"
version = "0.1.15"
edition = { workspace = true }
authors = { workspace = true }
description = "Warehouse - cli tool"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[[bin]]
name = "warehouse"
path = "src/main.rs"

[dependencies]
quench-serde = { workspace = true }
quench-core = { workspace = true }
quench-args = { workspace = true }
quench-cli = { workspace = true }
quench-client = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "cli_network_tests"
path = "tests/cli_network_tests.rs"
harness = false

[[test]]
name = "cli_tests"
path = "tests/cli_tests.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
