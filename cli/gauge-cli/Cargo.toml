[package]
name = "gauge-cli"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Gauge CLI - the host metrics dashboard in a terminal"
keywords = ["monitoring", "metrics", "tui", "cli"]
categories = ["command-line-utilities"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"
autotests = false

[lib]
name = "gauge_cli"
path = "src/lib.rs"

[[bin]]
name = "gauge"
path = "src/main.rs"

[dependencies]
forge-tui = { workspace = true }
gatehouse-client = { workspace = true }
gauge-core = { workspace = true }
quench-args = { workspace = true }
quench-cli = { workspace = true }
quench-core = { workspace = true }
quench-serde = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true
