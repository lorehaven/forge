[package]
name = "forge-toolbox"
version = "0.1.17"
edition = { workspace = true }
authors = { workspace = true }
description = "Forge Toolbox - monitor and self-update Forge installables"
keywords = ["development", "tools", "forge"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[[bin]]
name = "forge-toolbox"
path = "src/main.rs"

[lib]
name = "forge_toolbox"
path = "src/lib.rs"

[dependencies]
quench-core = { workspace = true }
quench-args = { workspace = true }
quench-cli = { workspace = true }

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
