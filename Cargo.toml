[workspace]
members = [
  "cli/*",
  "libs/*",
  "services/conveyor/app",
  "services/conveyor/core",
  "services/conveyor/service",
  "services/conveyor/web",
  "services/daybook/app",
  "services/daybook/core",
  "services/daybook/desktop",
  "services/daybook/host",
  "services/daybook/net",
  "services/daybook/service",
  "services/daybook/surface",
  "services/daybook/web",
  "services/forklift/app",
  "services/forklift/core",
  "services/forklift/desktop",
  "services/forklift/host",
  "services/forklift/net",
  "services/forklift/surface",
  "services/foundry/service",
  "services/gantry/app",
  "services/gantry/core",
  "services/gantry/service",
  "services/gantry/web",
  "services/gatehouse/app",
  "services/gatehouse/core",
  "services/gatehouse/service",
  "services/gatehouse/web",
  "services/gauge/app",
  "services/gauge/core",
  "services/gauge/service",
  "services/gauge/web",
  "services/hoist/app",
  "services/hoist/core",
  "services/hoist/desktop",
  "services/hoist/net",
  "services/hoist/service",
  "services/hoist/surface",
  "services/lectern/service",
  "services/sage/app",
  "services/sage/core",
  "services/sage/service",
  "services/sage/web",
  "services/switchboard/app",
  "services/switchboard/core",
  "services/switchboard/service",
  "services/switchboard/web",
  "services/warehouse/app",
  "services/warehouse/core",
  "services/warehouse/service",
  "services/warehouse/web",
  "services/workbench/app",
  "services/workbench/core",
  "services/workbench/service",
  "services/workbench/web",
  "tests/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Paweł Walus <pawel.walus@protonmail.com>"]
homepage = "https://github.com/lorehaven/forge"
repository = "https://github.com/lorehaven/forge"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
quench-android = { registry = "ennor", version = "0.1.1" }
conveyor-pipeline = { path = "libs/conveyor-pipeline", registry = "ennor", version = "0.2.0" }
gatehouse-client = { path = "libs/gatehouse-client" }
gatehouse-auth = { path = "libs/gatehouse-auth", registry = "ennor", version = "0.1.0" }
forge-ui = { path = "libs/forge-ui", version = "0.1.0" }
forge-shell = { path = "libs/forge-shell" }
forge-web = { path = "libs/forge-web" }
libc = { version = "0.2" }
quench-android-surface = { registry = "ennor", version = "0.1.6" }
quench-desktop-native = { registry = "ennor", version = "0.1.8" }
quench-style = { registry = "ennor", version = "0.1.3" }
quench-ui = { registry = "ennor", version = "0.1.4" }
quench-ui-native = { registry = "ennor", version = "0.1.6" }
quench-ui-web = { registry = "ennor", version = "0.1.8" }
quench-archive = { registry = "ennor", version = "0.1.3" }
quench-args = { registry = "ennor", version = "0.1.3" }
quench-auth = { registry = "ennor", version = "0.4.17" }
quench-cache = { registry = "ennor", version = "0.1.21" }
quench-cli = { registry = "ennor", version = "0.1.15" }
quench-client = { registry = "ennor", version = "0.2.18" }
quench-config = { registry = "ennor", version = "0.1.14" }
quench-convert = { registry = "ennor", version = "0.1.4" }
quench-core = { registry = "ennor", version = "0.1.8" }
quench-crypto = { registry = "ennor", version = "0.1.9" }
quench-db = { registry = "ennor", version = "0.2.15" }
quench-html = { registry = "ennor", version = "0.1.3" }
quench-fullstack = { registry = "ennor", version = "0.1.8" }
quench-http = { registry = "ennor", version = "0.1.16" }
quench-k8s = { registry = "ennor", version = "0.1.6" }
quench-log = { registry = "ennor", version = "0.1.10" }
quench-mail = { registry = "ennor", version = "0.1.13" }
quench-pg = { registry = "ennor", version = "0.1.10" }
quench-proto = { registry = "ennor", version = "0.1.11" }
quench-pdf = { registry = "ennor", version = "0.1.3" }
quench-qr = { registry = "ennor", version = "0.1.3" }
quench-regex = { registry = "ennor", version = "0.1.3" }
quench-schema = { registry = "ennor", version = "0.1.4" }
quench-serde = { registry = "ennor", version = "0.1.8" }
quench-starter = { registry = "ennor", version = "0.4.20" }
quench-test = { registry = "ennor", version = "0.1.4" }
quench-test-bdd = { registry = "ennor", version = "0.1.4" }
quench-tls = { registry = "ennor", version = "0.1.9" }
quench-template = { registry = "ennor", version = "0.1.4" }
quench-tz = { registry = "ennor", version = "0.1.4" }
quench-web = { registry = "ennor", version = "0.1.26" }
quench-web-components = { registry = "ennor", version = "0.1.21" }
conveyor-app = { path = "services/conveyor/app" }
conveyor-core = { path = "services/conveyor/core" }
conveyor-web = { path = "services/conveyor/web" }
daybook-app = { path = "services/daybook/app" }
daybook-core = { path = "services/daybook/core" }
daybook-desktop = { path = "services/daybook/desktop" }
daybook-host = { path = "services/daybook/host", default-features = false }
daybook-net = { path = "services/daybook/net", default-features = false }
daybook-web = { path = "services/daybook/web" }
gantry-app = { path = "services/gantry/app" }
gantry-core = { path = "services/gantry/core" }
gantry-web = { path = "services/gantry/web" }
gatehouse-app = { path = "services/gatehouse/app" }
gatehouse-core = { path = "services/gatehouse/core" }
gatehouse-web = { path = "services/gatehouse/web" }
gauge-app = { path = "services/gauge/app" }
gauge-core = { path = "services/gauge/core" }
gauge-web = { path = "services/gauge/web" }
warehouse-app = { path = "services/warehouse/app" }
warehouse-core = { path = "services/warehouse/core" }
warehouse-web = { path = "services/warehouse/web" }
switchboard-app = { path = "services/switchboard/app" }
switchboard-core = { path = "services/switchboard/core" }
switchboard-web = { path = "services/switchboard/web" }
sage-app = { path = "services/sage/app" }
sage-core = { path = "services/sage/core" }
sage-web = { path = "services/sage/web" }
workbench-app = { path = "services/workbench/app" }
workbench-core = { path = "services/workbench/core" }
workbench-web = { path = "services/workbench/web" }
forklift-app = { path = "services/forklift/app" }
forklift-core = { path = "services/forklift/core" }
forklift-host = { path = "services/forklift/host" }
forklift-net = { path = "services/forklift/net" }
hoist-app = { path = "services/hoist/app" }
hoist-core = { path = "services/hoist/core" }
hoist-desktop = { path = "services/hoist/desktop" }
hoist-net = { path = "services/hoist/net" }
hoist = { path = "services/hoist/service" }
rivet-package = { path = "libs/rivet-package", registry = "ennor", version = "0.1.0" }
tokio = { version = "1.54", features = ["full"] }

[profile.release]
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
fn_params_excessive_bools = "allow"

# Hoist's screens are laid out and painted on every change by the native renderer; unoptimised that is ~200 ms on a
# phone and every tap feels slow. These crates are built once, so optimising them costs nothing after the first build,
# and nothing else in the workspace uses them. The assertions and overflow checks of a debug build cost them a good part
# of their speed again, so they are off.
[profile.dev.package.hoist-app]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.forklift-app]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.forklift-core]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.forklift-host]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.forklift-net]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.daybook-app]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-css]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-layout]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-paint]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-text]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-image]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-raster]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-svg]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-ui]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-ui-native]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-style]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-desktop-native]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-android-surface]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The browser build, as `quench build --release` makes it (Hoist and the other quench projects): small and slow to compile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The browser build while you work: quick to compile.
[profile.wasm-dev]
inherits = "dev"
