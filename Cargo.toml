[workspace]
members = [
  "cli/*",
  "docker/*",
  "examples/*",
  "libs/*",
  "tests/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Paweł Walus <pawel.walus@protonmail.com>"]
homepage = "https://github.com/lorehaven/forge"
repository = "https://github.com/lorehaven/forge"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
actix-http = { version = "3.12" }
actix-service = { version = "2.0" }
actix-web = { version = "4.13", features = ["rustls-0_23"] }
actix-ws = { version = "0.4" }
anyhow = { version = "1.0" }
assert_cmd = { version = "2.2" }
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["json"] }
base64 = { version = "0.22" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29" }
cucumber = { version = "0.23" }
dotenvy = { version = "0.15" }
envmnt = { version = "0.10" }
fluent-syntax = { version = "0.12" }
futures = { version = "0.3" }
futures-util = { version = "0.3" }
gguf = { version = "0.1" }
hex = { version = "0.4" }
html5ever = { version = "0.39" }
hmac = { version = "0.13" }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
markup5ever_rcdom = { version = "0.39" }
minijinja = { version = "2.20", features = ["loader", "serde"] }
moka = { version = "0.12", features = ["sync"] }
predicates = { version = "3.1" }
quench-cli = { path = "libs/quench-cli", registry = "ennor", version = "0.1.1" }
quench-db = { path = "libs/quench-db", registry = "ennor", version = "0.1.0" }
quench-srv = { path = "libs/quench-srv", registry = "ennor", version = "0.1.8" }
quench-web = { path = "libs/quench-web", registry = "ennor", version = "0.1.1" }
regex = { version = "1.12" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "cookies",
  "multipart",
  "form",
] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = { version = "2" }
rustyline = { version = "18.0" }
semver = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = { version = "0.9" }
shlex = { version = "2.0" }
sha2 = { version = "0.11" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "json", "chrono", "uuid"] }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
tempfile = { version = "3.27" }
thiserror = { version = "2.0" }
tokio = { version = "1.52", features = ["full"] }
toml = { version = "1.1" }
toml_edit = { version = "0.25" }
tower-http = { version = "0.6", features = ["fs"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
utoipa = { version = "5.5", features = ["macros"] }
utoipa-swagger-ui = { version = "9.0", features = ["actix-web"] }
uuid = { version = "1.23", features = ["v4"] }
walkdir = { version = "2.5" }
which = { version = "8.0" }
zip = { version = "8.6" }
