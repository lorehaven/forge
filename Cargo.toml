[workspace]
members = [
  "cli/*",
  "docker/*",
  "examples/*",
  "libs/*",
  "tests/*",
]
exclude = ["examples/vllm_cluster_test"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Paweł Walus <pawel.walus@protonmail.com>"]
homepage = "https://github.com/lorehaven/forge"
repository = "https://github.com/lorehaven/forge"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
conveyor-pipeline = { path = "libs/conveyor-pipeline", registry = "ennor", version = "0.1.0" }
gatehouse-auth = { path = "libs/gatehouse-auth", registry = "ennor", version = "0.1.0" }
forge-ui = { path = "libs/forge-ui", version = "0.1.0" }
libc = { version = "0.2" }
quench-archive = { registry = "ennor", version = "0.1.1" }
quench-args = { registry = "ennor", version = "0.1.1" }
quench-auth = { registry = "ennor", version = "0.4.14" }
quench-cache = { registry = "ennor", version = "0.1.19" }
quench-cli = { registry = "ennor", version = "0.1.13" }
quench-client = { registry = "ennor", version = "0.2.15" }
quench-config = { registry = "ennor", version = "0.1.12" }
quench-convert = { registry = "ennor", version = "0.1.2" }
quench-core = { registry = "ennor", version = "0.1.6" }
quench-crypto = { registry = "ennor", version = "0.1.7" }
quench-db = { registry = "ennor", version = "0.2.13" }
quench-html = { registry = "ennor", version = "0.1.1" }
quench-http = { registry = "ennor", version = "0.1.13" }
quench-k8s = { registry = "ennor", version = "0.1.3" }
quench-log = { registry = "ennor", version = "0.1.8" }
quench-mail = { registry = "ennor", version = "0.1.10" }
quench-pg = { registry = "ennor", version = "0.1.8" }
quench-proto = { registry = "ennor", version = "0.1.8" }
quench-pdf = { registry = "ennor", version = "0.1.1" }
quench-qr = { registry = "ennor", version = "0.1.1" }
quench-regex = { registry = "ennor", version = "0.1.1" }
quench-schema = { registry = "ennor", version = "0.1.2" }
quench-serde = { registry = "ennor", version = "0.1.6" }
quench-starter = { registry = "ennor", version = "0.4.15" }
quench-test = { registry = "ennor", version = "0.1.2" }
quench-test-bdd = { registry = "ennor", version = "0.1.2" }
quench-tls = { registry = "ennor", version = "0.1.7" }
quench-template = { registry = "ennor", version = "0.1.2" }
quench-tz = { registry = "ennor", version = "0.1.2" }
quench-web = { registry = "ennor", version = "0.1.22" }
quench-web-components = { registry = "ennor", version = "0.1.17" }
rivet-package = { path = "libs/rivet-package", registry = "ennor", version = "0.1.0" }
tokio = { version = "1.54", features = ["full"] }

[profile.release]
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
fn_params_excessive_bools = "allow"
