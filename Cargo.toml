[workspace]
members = [
  "cli/*",
  "docker/*",
  "libs/*",
  "services/forklift/app",
  "services/forklift/core",
  "services/forklift/desktop",
  "services/forklift/host",
  "services/forklift/net",
  "services/forklift/surface",
  "services/hoist/app",
  "services/hoist/core",
  "services/hoist/desktop",
  "services/hoist/net",
  "services/hoist/service",
  "services/hoist/surface",
  "tests/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Paweł Walus <pawel.walus@protonmail.com>"]
homepage = "https://github.com/lorehaven/forge"
repository = "https://github.com/lorehaven/forge"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
quench-android = { registry = "ennor", version = "0.1.0" }
conveyor-pipeline = { path = "libs/conveyor-pipeline", registry = "ennor", version = "0.2.0" }
gatehouse-client = { path = "libs/gatehouse-client" }
gatehouse-auth = { path = "libs/gatehouse-auth", registry = "ennor", version = "0.1.0" }
forge-ui = { path = "libs/forge-ui", version = "0.1.0" }
libc = { version = "0.2" }
quench-android-surface = { registry = "ennor", version = "0.1.3" }
quench-desktop-native = { registry = "ennor", version = "0.1.3" }
quench-style = { registry = "ennor", version = "0.1.2" }
quench-ui = { registry = "ennor", version = "0.1.3" }
quench-ui-native = { registry = "ennor", version = "0.1.3" }
quench-ui-web = { registry = "ennor", version = "0.1.3" }
quench-archive = { registry = "ennor", version = "0.1.1" }
quench-args = { registry = "ennor", version = "0.1.1" }
quench-auth = { registry = "ennor", version = "0.4.14" }
quench-cache = { registry = "ennor", version = "0.1.19" }
quench-cli = { registry = "ennor", version = "0.1.13" }
quench-client = { registry = "ennor", version = "0.2.17" }
quench-config = { registry = "ennor", version = "0.1.12" }
quench-convert = { registry = "ennor", version = "0.1.2" }
quench-core = { registry = "ennor", version = "0.1.6" }
quench-crypto = { registry = "ennor", version = "0.1.8" }
quench-db = { registry = "ennor", version = "0.2.13" }
quench-html = { registry = "ennor", version = "0.1.1" }
quench-http = { registry = "ennor", version = "0.1.14" }
quench-k8s = { registry = "ennor", version = "0.1.3" }
quench-log = { registry = "ennor", version = "0.1.8" }
quench-mail = { registry = "ennor", version = "0.1.10" }
quench-pg = { registry = "ennor", version = "0.1.8" }
quench-proto = { registry = "ennor", version = "0.1.8" }
quench-pdf = { registry = "ennor", version = "0.1.1" }
quench-qr = { registry = "ennor", version = "0.1.1" }
quench-regex = { registry = "ennor", version = "0.1.1" }
quench-schema = { registry = "ennor", version = "0.1.2" }
quench-serde = { registry = "ennor", version = "0.1.6" }
quench-starter = { registry = "ennor", version = "0.4.16" }
quench-test = { registry = "ennor", version = "0.1.2" }
quench-test-bdd = { registry = "ennor", version = "0.1.2" }
quench-tls = { registry = "ennor", version = "0.1.7" }
quench-template = { registry = "ennor", version = "0.1.2" }
quench-tz = { registry = "ennor", version = "0.1.2" }
quench-web = { registry = "ennor", version = "0.1.23" }
quench-web-components = { registry = "ennor", version = "0.1.18" }
forklift-app = { path = "services/forklift/app" }
forklift-core = { path = "services/forklift/core" }
forklift-host = { path = "services/forklift/host" }
forklift-net = { path = "services/forklift/net" }
hoist-app = { path = "services/hoist/app" }
hoist-core = { path = "services/hoist/core" }
hoist-desktop = { path = "services/hoist/desktop" }
hoist-net = { path = "services/hoist/net" }
hoist-service = { path = "services/hoist/service" }
rivet-package = { path = "libs/rivet-package", registry = "ennor", version = "0.1.0" }
tokio = { version = "1.54", features = ["full"] }

[profile.release]
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
fn_params_excessive_bools = "allow"

# Hoist's screens are laid out and painted on every change by the native renderer; unoptimised that is ~200 ms on a
# phone and every tap feels slow. These crates are built once, so optimising them costs nothing after the first build,
# and nothing else in the workspace uses them. The assertions and overflow checks of a debug build cost them a good part
# of their speed again, so they are off.
[profile.dev.package.hoist-app]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.forklift-app]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-css]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-layout]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-paint]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-text]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-image]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-raster]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-svg]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-ui]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-ui-native]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-style]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-desktop-native]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.quench-android-surface]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The browser build, as `quench build --release` makes it (Hoist and the other quench projects): small and slow to compile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The browser build while you work: quick to compile.
[profile.wasm-dev]
inherits = "dev"
