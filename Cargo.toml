[workspace]
members = [
  "cli/*",
  "docker/*",
  "examples/*",
  "libs/*",
  "tests/*",
]
exclude = ["examples/vllm_cluster_test"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Paweł Walus <pawel.walus@protonmail.com>"]
homepage = "https://github.com/lorehaven/forge"
repository = "https://github.com/lorehaven/forge"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
age = { version = "0.12", default-features = false }
assert_cmd = { version = "2.2" }
axmldecoder = { version = "0.5" }
base64 = { version = "0.23" }
bytes = { version = "1.12" }
chrono-tz = { version = "0.10" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
conveyor-pipeline = { path = "libs/conveyor-pipeline", registry = "ennor", version = "0.1.0" }
crossterm = { version = "0.29" }
cucumber = { version = "0.23" }
csv = { version = "1.4" }
gatehouse-auth = { path = "libs/gatehouse-auth", registry = "ennor", version = "0.1.0" }
forge-ui = { path = "libs/forge-ui", version = "0.1.0" }
dotenvy = { version = "0.15" }
futures-util = { version = "0.3" }
gguf = { version = "0.1" }
grep = { version = "0.4" }
hex = { version = "0.4" }
hmac = { version = "0.13" }
http = { version = "1.5" }
http-body-util = { version = "0.1" }
ignore = { version = "0.4" }
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
kube = { version = "4.2", features = ["runtime", "derive"] }
libc = { version = "0.2" }
jsonschema = { version = "0.58", default-features = false }
k8s-openapi = { version = "0.28", features = ["latest"] }
minijinja = { version = "3.0", features = ["serde"] }
pdf-extract = { version = "0.12" }
predicates = { version = "3.1" }
pulldown-cmark = { version = "0.13" }
quench-auth = { registry = "ennor", version = "0.4.8" }
quench-cache = { registry = "ennor", version = "0.1.14" }
quench-cli = { registry = "ennor", version = "0.1.9" }
quench-client = { registry = "ennor", version = "0.2.9" }
quench-config = { registry = "ennor", version = "0.1.8" }
quench-core = { registry = "ennor", version = "0.1.2" }
quench-crypto = { registry = "ennor", version = "0.1.2" }
quench-db = { registry = "ennor", version = "0.2.7" }
quench-http = { registry = "ennor", version = "0.1.7" }
quench-log = { registry = "ennor", version = "0.1.4" }
quench-mail = { registry = "ennor", version = "0.1.5" }
quench-pg = { registry = "ennor", version = "0.1.2" }
quench-proto = { registry = "ennor", version = "0.1.2" }
quench-qr = { registry = "ennor", version = "0.1.0" }
quench-serde = { registry = "ennor", version = "0.1.2" }
quench-starter = { registry = "ennor", version = "0.4.9" }
quench-web = { registry = "ennor", version = "0.1.18" }
quench-web-components = { registry = "ennor", version = "0.1.13" }
rpassword = { version = "7" }
regex = { version = "1.13" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "multipart",
  "form",
] }
rivet-package = { path = "libs/rivet-package", registry = "ennor", version = "0.1.0" }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
scraper = { version = "0.27" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
shlex = { version = "2.0" }
sha2 = { version = "0.11" }
tar = { version = "0.4", default-features = false }
tokio = { version = "1.54", features = ["full"] }
toml_edit = { version = "0.25" }
uuid = { version = "1.28", features = ["v4"] }
urlencoding = { version = "2.1" }
walkdir = { version = "2.5" }
zstd = { version = "0.14" }
zip = { version = "9", default-features = false, features = ["deflate"] }
which = { version = "8.0" }
wiremock = { version = "0.6" }

[profile.release]
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
fn_params_excessive_bools = "allow"
