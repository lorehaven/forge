[workspace]
members = [
  "cli/*",
  "docker/*",
  "examples/*",
  "libs/*",
  "tests/*",
]
exclude = ["examples/vllm_cluster_test"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Paweł Walus <pawel.walus@protonmail.com>"]
homepage = "https://github.com/lorehaven/forge"
repository = "https://github.com/lorehaven/forge"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
actix-service = { version = "2.0" }
actix-web = { version = "4.14", features = ["rustls-0_23"] }
anyhow = { version = "1.0" }
argon2 = { version = "0.5" }
async-stream = { version = "0.3" }
assert_cmd = { version = "2.2" }
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["json"] }
base64 = { version = "0.22" }
bytes = { version = "1.12" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29" }
cucumber = { version = "0.23" }
dashmap = { version = "6.2" }
dotenvy = { version = "0.15" }
envmnt = { version = "0.10" }
fluent-syntax = { version = "0.12" }
futures-util = { version = "0.3" }
gguf = { version = "0.1" }
hex = { version = "0.4" }
html5ever = { version = "0.39" }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
kube = { version = "4.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
markup5ever_rcdom = { version = "0.39" }
minijinja = { version = "2.21", features = ["loader", "serde"] }
predicates = { version = "3.1" }
pulldown-cmark = { version = "0.13" }
quench-auth = { path = "libs/quench-auth", registry = "ennor", version = "0.1.0" }
quench-cache = { path = "libs/quench-cache", registry = "ennor", version = "0.1.0" }
quench-cli = { path = "libs/quench-cli", registry = "ennor", version = "0.1.1" }
quench-client = { path = "libs/quench-client", registry = "ennor", version = "0.1.0" }
quench-config = { path = "libs/quench-config", registry = "ennor", version = "0.1.0" }
quench-db = { path = "libs/quench-db", registry = "ennor", version = "0.1.1" }
quench-starter = { path = "libs/quench-starter", registry = "ennor", version = "0.1.0" }
quench-web = { path = "libs/quench-web", registry = "ennor", version = "0.1.6" }
regex = { version = "1.12" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "cookies",
  "multipart",
  "form",
] }
rustls = { version = "0.23", features = ["ring"] }
rustyline = { version = "18.0" }
scraper = { version = "0.27" }
semver = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = { version = "0.9" }
shlex = { version = "2.0" }
sha2 = { version = "0.11" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "json", "chrono", "uuid"] }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
tempfile = { version = "3.27" }
thiserror = { version = "2.0" }
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = { version = "1.1" }
toml_edit = { version = "0.25" }
tower-http = { version = "0.7", features = ["fs"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
uuid = { version = "1.23", features = ["v4"] }
urlencoding = { version = "2.1" }
walkdir = { version = "2.5" }
which = { version = "8.0" }
