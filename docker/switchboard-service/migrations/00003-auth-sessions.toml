[[migrations]]
id = "0003-auth-sessions"
author = "quench-srv"

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS switchboard.sessions (
    id TEXT PRIMARY KEY,
    username TEXT NOT NULL REFERENCES switchboard.users(username) ON DELETE CASCADE,
    refresh_token_hash TEXT NOT NULL UNIQUE,
    created_at TEXT NOT NULL,
    expires_at TEXT NOT NULL,
    revoked_at TEXT
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS switchboard_sessions_username_idx ON switchboard.sessions(username);"
