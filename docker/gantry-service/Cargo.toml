[package]
name = "gantry-service"
version = "0.1.16"
edition = { workspace = true }
authors = { workspace = true }
description = "Gantry - installs, upgrades, scales and swaps what runs in the cluster"
keywords = ["kubernetes", "deployment", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "gantry_service"
path = "src/lib.rs"

[lints]
workspace = true

[[bin]]
name = "gantry-service"
path = "src/main.rs"

# What a runner Job executes; ships in the runner image next to riveter and kubectl.
[[bin]]
name = "gantry-runner"
path = "src/bin/gantry_runner.rs"

[dependencies]
quench-pg = { workspace = true }
quench-log = { workspace = true }
quench-serde = { workspace = true, features = ["yaml"] }
quench-core = { workspace = true }
forge-ui = { workspace = true }
quench-auth = { workspace = true }
quench-client = { workspace = true }
quench-db = { workspace = true }
quench-http = { workspace = true }
quench-starter = { workspace = true }
quench-web = { workspace = true }
rivet-package = { workspace = true }
quench-k8s = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "cluster_it"
path = "tests/cluster_it.rs"
harness = false

[[test]]
name = "pg_store"
path = "tests/pg_store.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
