[package]
name = "foundry-service"
version = "0.2.11"
edition = { workspace = true }
authors = { workspace = true }
description = "Foundry - database initialization from the Forge migration catalog, run as a Kubernetes Job"
keywords = ["database", "migrations", "postgres", "kubernetes"]
categories = ["database", "command-line-utilities"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[lib]
name = "foundry_service"
path = "src/lib.rs"

[[bin]]
name = "foundry-service"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
quench-cli = { workspace = true }
quench-db = { workspace = true }
quench-log = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
