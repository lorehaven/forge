[package]
name = "foundry-service"
version = "0.2.26"
edition = { workspace = true }
authors = { workspace = true }
description = "Foundry - database initialization from the Forge migration catalog, run as a Kubernetes Job"
keywords = ["database", "migrations", "postgres", "kubernetes"]
categories = ["database", "command-line-utilities"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"
autotests = false

[lib]
name = "foundry_service"
path = "src/lib.rs"

[lints]
workspace = true

[[bin]]
name = "foundry-service"
path = "src/main.rs"

[dependencies]
quench-args = { workspace = true }
quench-cli = { workspace = true }
quench-core = { workspace = true }
quench-db = { workspace = true }
quench-log = { workspace = true }
quench-serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "cli_tests"
path = "tests/cli_tests.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
