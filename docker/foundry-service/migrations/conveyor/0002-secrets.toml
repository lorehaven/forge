[[migrations]]
id = "0002-secrets"
author = "conveyor-service"
since = "0.1.0"

# Sealed values: registry credentials, deploy tokens, and the shared secret a
# provider signs its webhooks with.
#
# `ciphertext` and `nonce` are stored separately because the nonce is not a
# secret and reusing one would be - keeping it its own column makes it obvious
# that a fresh one is written on every update. A NULL `repo_id` is an
# estate-wide secret, available to every pipeline; anything else belongs to one
# repository and is only injected into that repository's jobs.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.secrets (
    id TEXT PRIMARY KEY,
    repo_id TEXT REFERENCES ${schema}.repos(id) ON DELETE CASCADE,
    name TEXT NOT NULL,
    nonce BYTEA NOT NULL,
    ciphertext BYTEA NOT NULL,
    created_by TEXT NOT NULL REFERENCES ${auth_schema}.users(username) ON DELETE CASCADE,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);
"""

# One value per name per scope. Two rows for the same name would make which
# value a job receives depend on row order.
[[migrations.changes]]
sql = """
CREATE UNIQUE INDEX IF NOT EXISTS secrets_repo_name_idx
    ON ${schema}.secrets (repo_id, name) WHERE repo_id IS NOT NULL;
"""

# The estate-wide half of the same rule. Postgres treats NULLs as distinct in a
# unique index, so the scope has to be split into two partial indexes rather
# than one over (repo_id, name).
[[migrations.changes]]
sql = """
CREATE UNIQUE INDEX IF NOT EXISTS secrets_global_name_idx
    ON ${schema}.secrets (name) WHERE repo_id IS NULL;
"""
