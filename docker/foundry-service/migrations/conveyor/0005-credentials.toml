[[migrations]]
id = "0005-credentials"
author = "conveyor-service"
since = "0.1.0"

# Git authentication, sealed the same way `secrets` are but kept in their own
# table: a credential is resolved automatically by a checkout, never named by
# a pipeline, and there is at most one per project or per repo rather than
# many named values per scope - so `name` is a label here, not an identity,
# and the uniqueness below is on the scope column alone.
#
# `username`/`preview` are not secret and stay in the clear so a listing can
# show which credential a scope has without decrypting anything; `token` is
# the only thing `ciphertext` seals.
[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.credentials (
    id TEXT PRIMARY KEY,
    project_id TEXT REFERENCES ${schema}.projects(id) ON DELETE CASCADE,
    repo_id TEXT REFERENCES ${schema}.repos(id) ON DELETE CASCADE,
    name TEXT NOT NULL,
    kind TEXT NOT NULL,
    username TEXT NOT NULL,
    preview TEXT NOT NULL,
    nonce BYTEA NOT NULL,
    ciphertext BYTEA NOT NULL,
    created_by TEXT NOT NULL REFERENCES ${auth_schema}.users(username) ON DELETE CASCADE,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    CONSTRAINT credentials_one_scope CHECK ((project_id IS NOT NULL) <> (repo_id IS NOT NULL))
);
"""

# At most one credential per project, and per repo. Partial rather than a
# plain unique column because the other side is NULL for every row on this
# side - the same reason `secrets` splits its own uniqueness by scope.
[[migrations.changes]]
sql = """
CREATE UNIQUE INDEX IF NOT EXISTS credentials_project_idx
    ON ${schema}.credentials (project_id) WHERE project_id IS NOT NULL;
"""

[[migrations.changes]]
sql = """
CREATE UNIQUE INDEX IF NOT EXISTS credentials_repo_idx
    ON ${schema}.credentials (repo_id) WHERE repo_id IS NOT NULL;
"""
