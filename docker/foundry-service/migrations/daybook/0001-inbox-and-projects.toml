[[migrations]]
id = "0001-inbox-and-projects"
author = "daybook-service"
since = "0.1.0"

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.projects (
    id TEXT PRIMARY KEY,
    owner TEXT NOT NULL REFERENCES ${auth_schema}.users(username) ON DELETE CASCADE,
    name TEXT NOT NULL,
    sort_order INTEGER NOT NULL DEFAULT 0,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    UNIQUE (id, owner)
);
"""

[[migrations.changes]]
sql = """
CREATE INDEX IF NOT EXISTS projects_owner_order_idx
ON ${schema}.projects(owner, sort_order, name);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS ${schema}.tasks (
    id TEXT PRIMARY KEY,
    owner TEXT NOT NULL REFERENCES ${auth_schema}.users(username) ON DELETE CASCADE,
    project_id TEXT,
    content TEXT NOT NULL,
    description TEXT,
    is_completed BOOLEAN NOT NULL DEFAULT FALSE,
    sort_order INTEGER NOT NULL DEFAULT 0,
    due_at TIMESTAMPTZ,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    FOREIGN KEY (project_id, owner) REFERENCES ${schema}.projects(id, owner) ON DELETE CASCADE
);
"""

[[migrations.changes]]
sql = """
CREATE INDEX IF NOT EXISTS tasks_owner_project_order_idx
ON ${schema}.tasks(owner, project_id, is_completed, sort_order, created_at);
"""
