[[migrations]]
id = "0007-files-and-rag-schema"
author = "quench-srv"

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS sage.files (
    id TEXT PRIMARY KEY,
    owner TEXT NOT NULL REFERENCES sage.users(username) ON DELETE CASCADE,
    file_name TEXT NOT NULL,
    mime_type TEXT NOT NULL,
    file_size BIGINT NOT NULL,
    conversation_id TEXT REFERENCES sage.conversations(id) ON DELETE CASCADE,
    project_id TEXT REFERENCES sage.projects(id) ON DELETE CASCADE,
    status TEXT NOT NULL,
    error_message TEXT,
    created_at TEXT NOT NULL,
    updated_at TEXT NOT NULL,
    CHECK (num_nonnulls(conversation_id, project_id) = 1)
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS files_conversation_id_idx ON sage.files (conversation_id);"

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS files_project_id_idx ON sage.files (project_id);"

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS files_owner_idx ON sage.files (owner);"

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS sage.file_blobs (
    file_id TEXT PRIMARY KEY REFERENCES sage.files(id) ON DELETE CASCADE,
    data BYTEA NOT NULL
);
"""

[[migrations.changes]]
sql = """
CREATE TABLE IF NOT EXISTS sage.file_chunks (
    id TEXT PRIMARY KEY,
    file_id TEXT NOT NULL REFERENCES sage.files(id) ON DELETE CASCADE,
    chunk_index INTEGER NOT NULL,
    content TEXT NOT NULL,
    embedding vector(1024),
    embedding_model TEXT,
    metadata JSONB,
    created_at TEXT NOT NULL,
    UNIQUE (file_id, chunk_index)
);
"""

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS file_chunks_file_id_idx ON sage.file_chunks (file_id);"

[[migrations.changes]]
sql = "CREATE INDEX IF NOT EXISTS file_chunks_embedding_idx ON sage.file_chunks USING hnsw (embedding vector_cosine_ops);"
