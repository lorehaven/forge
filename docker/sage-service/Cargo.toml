[package]
name = "sage-service"
version = "0.5.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Sage - AI workspace service"
keywords = ["ai", "assistant", "development", "tools"]
categories = ["asynchronous", "development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }

[lib]
name = "sage_service"
path = "src/lib.rs"

[[bin]]
name = "sage-service"
path = "src/main.rs"

[dependencies]
