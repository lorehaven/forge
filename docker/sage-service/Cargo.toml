bytes = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
dashmap = { workspace = true }
envmnt = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
pdf-extract = { workspace = true }
pulldown-cmark = { workspace = true }
quench-auth = { workspace = true }
quench-cache = { workspace = true }
quench-client = { workspace = true }
quench-config = { workspace = true }
quench-db = { workspace = true }
quench-http = { workspace = true }
quench-starter = { workspace = true }
quench-web = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
