[package]
name = "gatehouse-service"
version = "0.2.19"
edition = { workspace = true }
authors = { workspace = true }
description = "Gatehouse - the Forge authentication service: one login, one identity store"
keywords = ["auth", "sso", "jwt", "identity"]
categories = ["authentication", "web-programming"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[lib]
name = "gatehouse_service"
path = "src/lib.rs"

[[bin]]
name = "gatehouse-service"
path = "src/main.rs"

[dependencies]
actix-web = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
anyhow = { workspace = true }
envmnt = { workspace = true }
quench-auth = { workspace = true }
quench-cache = { workspace = true, features = ["redis"] }
quench-config = { workspace = true }
quench-db = { workspace = true }
quench-starter = { workspace = true }
quench-web = { workspace = true }
quench-web-components = { workspace = true }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
totp-rs = { workspace = true }
urlencoding = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
