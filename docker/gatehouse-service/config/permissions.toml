# The realm's permission catalog: which services exist, what actions each
# supports, and the named grant bundles ("templates") an admin can assign
# instead of building a grant by hand.
#
# The one place a service's grantable shape lives - adding a service or
# action here needs no gatehouse rebuild, just a restart to pick it up
# (`PERMISSIONS_CONFIG`, default this path relative to gatehouse's working
# directory).

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
#
# `actions` is the full set of names grantable on that service - no ordering,
# no implication between them ("write" does not imply "read"). `RequireWrite`
# (in quench-auth) checks specifically for the `"write"` action, so a service
# that only needs a coarse split should list exactly `["read", "write"]`.

[services.sage]
label = "Sage"
actions = ["read", "write"]

[services.warehouse]
label = "Warehouse"
actions = ["read", "write"]
# Lets a grant name one dynamic storage instead of "every storage warehouse
# holds" - see `warehouse:storage:<name>:<action>` in quench-auth. A
# storage's owner already has full access without a grant, so this is for
# sharing with someone who isn't the owner.
resource_types = ["storage"]

[services.conveyor]
label = "Conveyor"
actions = ["read", "write"]
# Lets a grant name one project (or an ancestor node, covering everything
# nested under it) - see `conveyor:project:<id>:<action>` in quench-auth.
resource_types = ["project"]

[services.switchboard]
label = "Switchboard"
actions = ["read", "launch", "stop", "delete-model"]

[services.workbench]
label = "Workbench"
actions = ["read", "write"]
# Lets a grant name one project - see `workbench:project:<id>:<action>` in
# quench-auth. Workbench's projects are flat, so this covers exactly the
# named project, no ancestor walk.
resource_types = ["project"]

# Gatehouse administers itself through the same catalog it hands to every
# other service, which is what lets user administration be delegated below
# full admin. Assigning the `admin` or `service` role is deliberately NOT one
# of these actions - it stays gated on holding the literal `admin` role, so a
# catalog entry can't grant "the power to grant admin".
[services.gatehouse]
label = "Gatehouse"
actions = ["read-users", "create-user", "edit-user", "delete-user", "manage-permissions", "manage-signing-keys"]

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------
#
# Named bundles of grants, assignable in one step instead of checking each
# box by hand. Every action here must exist on the corresponding
# [services.*] entry above - checked at startup, so a typo fails loudly.

[templates.viewer]
sage = ["read"]
warehouse = ["read"]
switchboard = ["read"]
conveyor = ["read"]
workbench = ["read"]

[templates.editor]
sage = ["read", "write"]
warehouse = ["read", "write"]
switchboard = ["read", "launch", "stop"]
conveyor = ["read", "write"]
workbench = ["read", "write"]

# Everything short of assigning roles: create, edit, delete a user, and grant
# them catalog permissions. What "avoid using admin day to day" runs on.
[templates.user-manager]
gatehouse = ["read-users", "create-user", "edit-user", "delete-user", "manage-permissions"]

# ---------------------------------------------------------------------------
# Registration
# ---------------------------------------------------------------------------
#
# What a self-registered account starts with, since there's no admin in the
# loop to grant it anything after the fact.

[registration]
default_template = "viewer"
