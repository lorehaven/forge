# `anvil docs check|build|release`: the documentation books (Jekyll sites of Markdown files).
[docs]
out = "target/docs"
# The warehouse files storage the books are kept in: <book>/<version>/ and <book>/latest.json. It is a static
# storage declared in homecloud (`FILE_STORAGES` of the warehouse deployment: `docs=/docs`); writing needs `warehouse:write`.
storage = "docs"
warehouse_url = "https://ennor.ddns.net/warehouse"

[docs.books.forge]
dir = "docs"
title = "Forge"
# Each docs/services/<name>/openapi.yaml is checked against the routes in the service's source.
[docs.books.forge.openapi]
specs = "services"
sources = ["services/{name}/service/src"]
