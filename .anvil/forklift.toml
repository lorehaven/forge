# One version for every build: the desktop app's (the Android app takes it from there too, as Hoist's does).
[artifacts.programs.forklift]
program = "dev.lorehaven.forklift"
dir = "services/forklift"
version_file = "desktop/Cargo.toml"

[[artifacts.programs.forklift.targets]]
platform = "android"
format = "apk"
build = ["quench", "build", "apk", "--release"]
file = "dist/forklift-${version_name}-${version_code}.apk"

# Linux ships in the formats the distributions install, plus the sources, as Hoist does.
[[artifacts.programs.forklift.targets]]
name = "linux-deb"
platform = "linux"
label = "Forklift"
format = "deb"
arch = "x86_64"
build = ["quench", "build", "deb"]
file = "dist/forklift_${version_name}_amd64.deb"

[[artifacts.programs.forklift.targets]]
name = "linux-rpm"
platform = "linux"
label = "Forklift"
format = "rpm"
arch = "x86_64"
build = ["quench", "build", "rpm"]
file = "dist/forklift-${version_name}-1.x86_64.rpm"

[[artifacts.programs.forklift.targets]]
name = "linux-arch"
platform = "linux"
label = "Forklift"
format = "pkg.tar.zst"
arch = "x86_64"
build = ["quench", "build", "arch"]
file = "dist/forklift-${version_name}-1-x86_64.pkg.tar.zst"

[[artifacts.programs.forklift.targets]]
name = "linux-source"
platform = "linux"
label = "Forklift"
format = "tar.gz"
arch = "universal"
build = ["quench", "build", "source"]
file = "dist/forklift-${version_name}.tar.gz"
